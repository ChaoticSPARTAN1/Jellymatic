"path":"docs/Credits-and-licences.md",
"title":"Credits \u0026 licences",
"html":"\u003ch1 id=\"h-credits--licences\"\u003eCredits \u0026amp; licences\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Credits \u0026amp; licences\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Credits-and-licences.md:author\"\u003eAuthor\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:this-projects-licence\"\u003eThis project's licence\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:parts-made-by-others\"\u003eParts made by others\u003c/a\u003e ·\n\u003ca href=\"#docs/Credits-and-licences.md:used-not-included\"\u003eUsed, not included\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:data-and-services-the-console-uses\"\u003eData and services\u003c/a\u003e ·\n\u003ca href=\"#docs/Credits-and-licences.md:read-as-references\"\u003eRead as references\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:trademarks\"\u003eTrademarks\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-author\"\u003eAuthor\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. Under GPLv3 section 7(b), redistributions and modified versions must keep\nthis attribution in the README credits and in any About/credits screen (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e).\nThe start-up menu's credits screen and Chromatic Manager's About tab show it.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/credits-screen.png\" width=\"320\" alt=\"The start-up menu\u0026#x27;s credits screen\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-this-projects-licence\"\u003eThis project's licence\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), for everything written for Jellymatic: the start-up menu, the\nJellyfin app, the RTL in \u003ccode\u003ertl/\u003c/code\u003e and \u003ccode\u003echromatic/fpga-media/\u003c/code\u003e, Chromatic Manager, the scripts, Remote Pilot\nand the documentation. \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e adds the attribution term (7(b)), the\nmarking of modified versions (7(c)), and two additional permissions: for FPGA bitstreams that combine\nJellymatic's RTL with ModRetro's design and Gowin IP, and for linking the console firmware with\nEspressif's binary-only Wi-Fi/PHY libraries and the ESP32 ROM.\u003c/p\u003e\n\u003ch2 id=\"h-parts-made-by-others\"\u003eParts made by others\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro Chromatic FPGA design v18.14, files modified by ChaoticSPARTAN1 for Jellymatic, 2026-11\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/*/src/\u003c/code\u003e (the list is in \u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e© ModRetro and contributors; the game core files (\u003ccode\u003egb.v\u003c/code\u003e and others) come from the MiSTer handheld core \"Gameboy_MiSTer\" (GPL-3.0-or-later, Till Harbaum and the MiSTer developers). \u003ccode\u003euart.v\u003c/code\u003e names Gowin (GaoYun Semi) as its creator; ModRetro publishes it under its repository's GPL. Only the changed files are here; the rest is ModRetro's public repository at the commit in \u003ccode\u003eupstream.lock.json\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShiny Relay 1.1.5 parts\u003c/td\u003e\n\u003ctd\u003ethe \u003ccode\u003euart_tx_busy\u003c/code\u003e fix in the 18.41 \u003ccode\u003esystem_monitor.sv\u003c/code\u003e; the request-once status channel pattern in \u003ccode\u003ertl/chromatic_pocket_link.v\u003c/code\u003e; the Wi-Fi join wording in \u003ccode\u003echromatic/launcher/shared/wifi_scan.h\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e© Shiny Gen. Marked in each file.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003espeedcontrol.vhd\u003c/code\u003e, Verilog translation for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/fpga-media/sim/speedcontrol_model.v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0 (as the original; not under ADDITIONAL-TERMS.md)\u003c/td\u003e\n\u003ctd\u003eFrom ModRetro's design, which has it from the MiSTer core \"Gameboy_MiSTer\"; translated by ChaoticSPARTAN1.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Simple UART for FPGA\", Verilog port for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ertl/uart2_vhdl_port.v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMIT (the port: GPL-3.0-or-later)\u003c/td\u003e\n\u003ctd\u003e© Jakub Cabal; the VHDL original is part of ModRetro's design. \u003ca href=\"LICENSES/MIT-uart_for_fpga.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/MIT-uart_for_fpga.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eESP-IDF bootloader start file\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/bootloader_components/main/bootloader_start.c\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003e© Espressif Systems; modified (the start decision). \u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin logo, scaled\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/launcher_art.h\u003c/code\u003e, \u003ccode\u003escripts/chromatic_theme.py\u003c/code\u003e (JELLYFIN_MARK), pictures in \u003ccode\u003edocs/images/\u003c/code\u003e showing it\u003c/td\u003e\n\u003ctd\u003eCC BY-SA 4.0\u003c/td\u003e\n\u003ctd\u003e© the Jellyfin contributors, from jellyfin/jellyfin-ux. The scaled versions are shared under the same licence. \u003ca href=\"LICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRoboto Medium, rasterized\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epocket/ui_font.h\u003c/code\u003e (made by \u003ccode\u003escripts/build_ui_font.py\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003eRoboto 2.138 by Christian Robertson, Copyright 2011 Google Inc. \u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eT80 CPU core, SameBoy-derived boot ROM\u003c/td\u003e\n\u003ctd\u003enot here: in ModRetro's source, built into the FPGA images 18.40 and 18.41\u003c/td\u003e\n\u003ctd\u003eBSD-style; MIT\u003c/td\u003e\n\u003ctd\u003e© Daniel Wallner; © Lior Halphon. Their notices go with the images: \u003ca href=\"LICENSES/BSD-style-T80.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/BSD-style-T80.txt\u003c/a\u003e, \u003ca href=\"LICENSES/MIT-SameBoy-boot-ROM.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/MIT-SameBoy-boot-ROM.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLocal Weather announcer lines (five short clips)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/wx_sound_data.c\u003c/code\u003e (in the start-up menu)\u003c/td\u003e\n\u003ctd\u003ePublic domain voice; the clips are part of Jellymatic\u003c/td\u003e\n\u003ctd\u003eSpoken by \u003ca href=\"https://github.com/OHF-Voice/piper1-gpl\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePiper\u003c/a\u003e (GPL-3.0; the tool itself is not included) with its voice \u003ccode\u003een_US-norman-medium\u003c/code\u003e (\u003ca href=\"https://huggingface.co/rhasspy/piper-voices\" target=\"_blank\" rel=\"noopener noreferrer\"\u003erhasspy/piper-voices\u003c/a\u003e), whose model card lists it as public domain, trained from scratch on public-domain LibriVox recordings. The wording, the music loop and the alert tone are the project's own (written in code)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWeather location look-up table\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/places/us-places.txt.gz\u003c/code\u003e (used by Chromatic Manager on the PC)\u003c/td\u003e\n\u003ctd\u003ePublic domain\u003c/td\u003e\n\u003ctd\u003eMade from the US Census Bureau's 2024 Gazetteer files (ZIP Code Tabulation Areas and places), works of the US Government; the source files and their SHA-256 are in \u003ccode\u003echromatic/weather/places/SOURCES.txt\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eState outlines and town land areas\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/places/us-states.txt.gz\u003c/code\u003e and \u003ccode\u003eus-town-sizes.txt.gz\u003c/code\u003e (used by the location pack maker on the PC)\u003c/td\u003e\n\u003ctd\u003ePublic domain\u003c/td\u003e\n\u003ctd\u003eMade from the US Census Bureau's 2023 cartographic boundary file of the states (1:20,000,000) and its 2024 Gazetteer place file, works of the US Government; sources and SHA-256 in \u003ccode\u003echromatic/weather/places/SOURCES.txt\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePress Start 2P font\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003eCodeMan38. \u003ca href=\"LICENSES/OFL-1.1-PressStart2P.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-PressStart2P.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSilkscreen font\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003eThe Silkscreen Project Authors. \u003ca href=\"LICENSES/OFL-1.1-Silkscreen.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-Silkscreen.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-used-not-included\"\u003eUsed, not included\u003c/h2\u003e\n\u003cp\u003eInstalled by you, under their own licences:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTool\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eESP-IDF v5.3 (Espressif) and its components (FreeRTOS, lwIP, Mbed TLS, newlib, Wi-Fi libraries, the root certificate bundle used by Local Weather's HTTPS)\u003c/td\u003e\n\u003ctd\u003eApache-2.0 and others (the certificate bundle is made from Mozilla's CA list, MPL-2.0); see ESP-IDF's \u003ccode\u003eCOPYRIGHT.rst\u003c/code\u003e. A \u003cstrong\u003ebuilt\u003c/strong\u003e start-up menu contains these and must ship their notices.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro's FPGA source (with the MiSTer core (\"Gameboy_MiSTer\"), T80 CPU, SameBoy-derived boot ROM, Gowin IP)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0 / GPL-3.0-or-later / BSD-style / MIT / Gowin's terms. A \u003cstrong\u003ebuilt\u003c/strong\u003e FPGA image contains these and must ship their notices and source.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGowin EDA\u003c/td\u003e\n\u003ctd\u003eGowin's licence (proprietary). Never included.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eopenFPGALoader\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePython, PySide6 / Qt\u003c/td\u003e\n\u003ctd\u003ePSF licence; LGPL-3.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eesptool, pyserial\u003c/td\u003e\n\u003ctd\u003eGPL-2.0-or-later; BSD-3-Clause\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro's official update tool\u003c/td\u003e\n\u003ctd\u003eModRetro's terms. Never included; download it from ModRetro.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-data-and-services-the-console-uses\"\u003eData and services the console uses\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSource\u003c/th\u003e\n\u003cth\u003eUsed by\u003c/th\u003e\n\u003cth\u003eTerms\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eUS National Weather Service, \u003ccode\u003eapi.weather.gov\u003c/code\u003e and its map server\u003c/td\u003e\n\u003ctd\u003eLocal Weather (TV row)\u003c/td\u003e\n\u003ctd\u003eUS Government work, public domain. Asked with a plain program name, nothing personal. Not for safety decisions\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epool.ntp.org\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe clock of Local Weather\u003c/td\u003e\n\u003ctd\u003ePublic time service\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYour own Jellyfin server (Live TV, the ChromaTube library)\u003c/td\u003e\n\u003ctd\u003eJellyfin, TV and ChromaTube rows\u003c/td\u003e\n\u003ctd\u003eJellyfin is GPL-2.0, used through its public web API\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eiptv-org channel data (only if you build a Live TV list with \u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e's tools)\u003c/td\u003e\n\u003ctd\u003eYour server's Live TV tuner\u003c/td\u003e\n\u003ctd\u003eThe Unlicense for the data; each stream belongs to its broadcaster\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eytdlp2STRM (MIT) and yt-dlp (The Unlicense) (only if you set up \u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eThe container beside your server\u003c/td\u003e\n\u003ctd\u003eNot included in Jellymatic; they conflict with YouTube's Terms of Service, so using them is your own choice\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe TV and ChromaTube icons and the Local Weather art, fonts and maps are original pixel art made for the project.\u003c/p\u003e\n\u003ch2 id=\"h-read-as-references\"\u003eRead as references\u003c/h2\u003e\n\u003cp\u003eThese were read to understand the console; no code was copied from them except the parts listed above:\nModRetro's Chromatic MCU source (GPL-3.0), \u003cstrong\u003eChromatiX\u003c/strong\u003e by Enjoy-Digital and contributors (GPL-3.0 /\nBSD-2-Clause), and \u003cstrong\u003eShiny Relay\u003c/strong\u003e by Shiny Gen (GPL-3.0; besides the parts listed above, the \"debug bit\"\nversion scheme follows its approach). Thank you to all of them.\u003c/p\u003e\n\u003ch2 id=\"h-trademarks\"\u003eTrademarks\u003c/h2\u003e\n\u003cp\u003eModRetro and Chromatic are trademarks of ModRetro, Inc. Jellyfin is a trademark of its owners. Analogue and\nPocket are trademarks of Analogue. YouTube is a trademark of Google LLC; ChromaTube is not affiliated with or endorsed\nby YouTube or Google. Channel names belong to their owners. They are used only to say what\nJellymatic works with. Jellymatic is an independent project, not affiliated with, endorsed or supported by\nany of them.\u003c/p\u003e"
},

"title":"Design notes",
"html":"\u003ch1 id=\"h-design-notes-for-developers\"\u003eDesign notes (for developers)\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Design notes\u003c/p\u003e\n\u003cp\u003eSome comments point to \"docs/Design-notes.md\", this page. A few, in the reviewed FPGA sources\n(\u003ccode\u003efpga/images/\u003c/code\u003e, the pinned files in \u003ccode\u003ertl/\u003c/code\u003e and \u003ccode\u003echromatic/fpga-media/\u003c/code\u003e) and in the staging scripts whose\ntext becomes part of those sources, still name the original internal design notes (\u003ccode\u003eCHROMATIC-...md\u003c/code\u003e).\nThose notes are not published, and the pinned sources cannot be edited without changing their SHA-256\nhashes. This page says where each topic lives now.\u003c/p\u003e\n\u003cp\u003eWhat they covered, and where to look instead:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNote\u003c/th\u003e\n\u003cth\u003eTopic\u003c/th\u003e\n\u003cth\u003eWhere now\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePOCKET-TETHER\u003c/td\u003e\n\u003ctd\u003eChromatic ↔ Pocket wire contract, credits, memory budget, link stages\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eshared/pocket_tether.h\u003c/code\u003e, \u003ccode\u003echromatic/launcher/shared/pocket_link.h\u003c/code\u003e, \u003ccode\u003ertl/chromatic_pocket_link.v\u003c/code\u003e and their tests; \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eREMOTE-CONTROL\u003c/td\u003e\n\u003ctd\u003eCHR1 protocol (Remote Pilot ↔ launcher), USB pacing, pairing\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/remote.h\u003c/code\u003e, \u003ccode\u003eremote-pilot/presets/chromatic/PROTOCOL.md\u003c/code\u003e; \u003ca href=\"#docs/Remote-Pilot.md\"\u003eRemote Pilot\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAUDIO-PLAN\u003c/td\u003e\n\u003ctd\u003eFPGA sound hooks, version register, the FPGA job runbook\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/fpga-media/chromatic_media.v\u003c/code\u003e, \u003ccode\u003escripts/stage_chromatic_fpga_media.py\u003c/code\u003e, \u003ccode\u003escripts/chromatic_fpga.py\u003c/code\u003e; \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eInstall\u003c/a\u003e, \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSETUP-ON-CONSOLE\u003c/td\u003e\n\u003ctd\u003eWi-Fi and Jellyfin screens, the one audited flash writer, power-cut model\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/setup_ui.h\u003c/code\u003e, \u003ccode\u003eprovision_write.c\u003c/code\u003e, \u003ccode\u003escripts/test_chromatic_setup.py\u003c/code\u003e; \u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJELLYFIN-PLAYER\u003c/td\u003e\n\u003ctd\u003eThe console's Jellyfin app, pacing, memory\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/jellyfin/jf_app.h\u003c/code\u003e, \u003ccode\u003ejf_ui.h\u003c/code\u003e; \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFPGA-STREAM-IMAGE\u003c/td\u003e\n\u003ctd\u003eHow the 18.41 image met timing, its pins\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/link-18.41/\u003c/code\u003e receipts, \u003ccode\u003escripts/stage_chromatic_fpga_link.py\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDIAGNOSTICS\u003c/td\u003e\n\u003ctd\u003eThe launcher's \u003ccode\u003ePJ-DIAG\u003c/code\u003e serial lines\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/launcher_diag.h\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMANAGER\u003c/td\u003e\n\u003ctd\u003eChromatic Manager's behaviour in detail\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_manager*.py\u003c/code\u003e docstrings and tests; \u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe provisioning record (Wi-Fi, pairing, Jellyfin sign-in in two flash sectors) is defined by\n\u003ccode\u003escripts/chromatic_provision.py\u003c/code\u003e and its C twin \u003ccode\u003echromatic/launcher/shared/provision.h\u003c/code\u003e, cross-checked by\n\u003ccode\u003escripts/test_chromatic_provision_c.py\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-start-up-menu-16-tv-chromatube-local-weather\"\u003eStart-up menu 1.6: TV, ChromaTube, Local Weather\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNote\u003c/th\u003e\n\u003cth\u003eTopic\u003c/th\u003e\n\u003cth\u003eWhere now\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eLAUNCHER-1.6\u003c/td\u003e\n\u003ctd\u003eThe five-row menu; TV and ChromaTube as modes of the Jellyfin app; live-channel tuning and closing; pacing\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/launcher_logic.h\u003c/code\u003e, \u003ccode\u003echromatic/jellyfin/jf_app.h\u003c/code\u003e, \u003ccode\u003escripts/test_chromatic_tv.py\u003c/code\u003e; \u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWEATHER-CHANNEL\u003c/td\u003e\n\u003ctd\u003eThe Local Weather pages, data, radar decoder, clock, memory, sound; the weather location record (two 4 KiB sectors at 0x3FC000 and 0x3FD000, written A then B with sequence and CRC; the apps record and the Manager's launcher area lie below them); no record means the built-in default, Orlando, FL\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/\u003c/code\u003e (\u003ccode\u003ewx_place.h\u003c/code\u003e for the record), \u003ccode\u003escripts/chromatic_weather_location.py\u003c/code\u003e, \u003ccode\u003escripts/test_chromatic_weather*.py\u003c/code\u003e; \u003ca href=\"#docs/TV-and-Local-Weather.md\"\u003eTV and Local Weather\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAPPS (1.6.4)\u003c/td\u003e\n\u003ctd\u003eWhich app rows show, chosen in the Manager (Settings › Apps) or on the console (Select hides, Other firmware › Show hidden apps). A 32-byte versioned record with CRC (\"PJAP\" v1: sequence, flags TV / ChromaTube / Live TV) in two 4 KiB sectors at 0x3FA000 and 0x3FB000; absent or damaged means the defaults (TV with Local Weather only, ChromaTube hidden). The console's Hide/Show writes the copy not in force through the one audited writer. The Manager's launcher area ends at 0x3FA000 (largest image 1,679,360 bytes)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/apps_record.h\u003c/code\u003e, \u003ccode\u003echromatic/launcher/shared/provision_write.c\u003c/code\u003e, \u003ccode\u003escripts/chromatic_apps.py\u003c/code\u003e, \u003ccode\u003escripts/test_chromatic_apps.py\u003c/code\u003e; \u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSERVER-APPS (1.6.4)\u003c/td\u003e\n\u003ctd\u003eThe Manager's Live TV channels and ChromaTube server set-ups\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_server_apps.py\u003c/code\u003e, \u003ccode\u003escripts/test_chromatic_server_apps.py\u003c/code\u003e; \u003ca href=\"#docs/TV-and-Local-Weather.md:live-tv-optional\"\u003eTV and Local Weather\u003c/a\u003e, \u003ca href=\"#docs/ChromaTube.md:set-it-up\"\u003eChromaTube\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe server sides of TV and ChromaTube are separate projects with their own tools and tests:\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e and \u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e.\u003c/p\u003e"
},
{
"path":"CONTRIBUTING.md",
"title":"Contributing",
"html":"\u003ch1 id=\"h-contributing-to-jellymatic\"\u003eContributing to Jellymatic\u003c/h1\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome. This is a hobby project: there is no guarantee of a\nresponse or a fix, but every report is read when time allows.\u003c/p\u003e\n\u003ch2 id=\"h-reporting-a-bug\"\u003eReporting a bug\u003c/h2\u003e\n\u003cp\u003eOpen an issue with:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eWhat you did, what you expected, what happened.\u003c/li\u003e\n\u003cli\u003eVersions: start-up menu (shown on its credits screen and in Chromatic Manager), Chromatic Manager\ncommit, FPGA image (official, 18.40 or 18.41), Windows version.\u003c/li\u003e\n\u003cli\u003eThe Manager's result headline and, if useful, the relevant log lines \u003cstrong\u003eafter removing\u003c/strong\u003e every address,\nnetwork name, user name, token and device ID. Turn on the Manager's eye button (private details hidden)\nbefore taking screenshots.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eNever post Wi-Fi details, server addresses, Jellyfin tokens, backups or full logs. For security problems\nuse \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e instead of an issue.\u003c/p\u003e\n\u003ch2 id=\"h-pull-requests\"\u003ePull requests\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep the safety rules: no change may write the official firmware slot, settings or cartridges; every\nwrite goes through Chromatic Manager's journal, backup, read-back and Approve.\u003c/li\u003e\n\u003cli\u003eRun the tests that cover your change (\u003ca href=\"#docs/Building-from-source.md:tests\"\u003edocs/Building-from-source.md\u003c/a\u003e)\nand say which ones you ran. The tests must never open a device.\u003c/li\u003e\n\u003cli\u003ePlain words in anything a user reads. Keep the pixel style of the console and the Manager.\u003c/li\u003e\n\u003cli\u003eAfter editing any documentation page, run \u003ccode\u003epy -3 scripts\\build_docs_html.py\u003c/code\u003e (Open-Documentation.html and\ndocs/index.html) and \u003ccode\u003epy -3 scripts\\build_docs_pdf.py\u003c/code\u003e (the PDF guide); \u003ccode\u003escripts\\test_docs_html.py\u003c/code\u003e checks\nall three. When the repository is public, GitHub Pages can serve the docs: Settings \u0026gt; Pages, branch \u003ccode\u003emain\u003c/code\u003e,\nfolder \u003ccode\u003e/docs\u003c/code\u003e; the site is \u003ccode\u003ehttps://chaoticspartan1.github.io/Jellymatic/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eDo not add files you may not share (firmware dumps, ModRetro's or Gowin's files, licences, real media).\u003c/li\u003e\n\u003cli\u003eBy contributing you agree that your contribution is licensed under GPL-3.0-or-later with the additional\nattribution term in \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e"
},
{
"path":"SECURITY.md",
"title":"Security",
"html":"\u003ch1 id=\"h-security\"\u003eSecurity\u003c/h1\u003e\n\u003ch2 id=\"h-reporting-a-vulnerability\"\u003eReporting a vulnerability\u003c/h2\u003e\n\u003cp\u003ePlease report security problems \u003cstrong\u003eprivately\u003c/strong\u003e, not in a public issue: use GitHub's\n\u003cstrong\u003eSecurity › Report a vulnerability\u003c/strong\u003e (private vulnerability reporting) on this repository. Describe the\nproblem, how to reproduce it, and what it affects (console, PC tool, Remote Pilot, Jellyfin sign-in).\nThere is no guarantee of a response time; reports are handled as time allows.\u003c/p\u003e\n\u003ch2 id=\"h-never-post-publicly\"\u003eNever post publicly\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eWi-Fi network names and passwords\u003c/li\u003e\n\u003cli\u003eJellyfin server addresses, user names, user IDs, tokens, Quick Connect codes, device IDs\u003c/li\u003e\n\u003cli\u003eRemote Pilot pairing keys, the Manager's local API token or discovery file\u003c/li\u003e\n\u003cli\u003eConsole backups, flash dumps, serial numbers, MAC addresses\u003c/li\u003e\n\u003cli\u003eLogs or screenshots that show any of the above (turn on the Manager's eye button before a screenshot)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-jellymatic-does-to-protect-you\"\u003eWhat Jellymatic does to protect you\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eYour Wi-Fi and Jellyfin details stay in \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e on your PC and on your console;\nnothing is uploaded.\u003c/li\u003e\n\u003cli\u003eThe console gets its own revocable Jellyfin sign-in (Quick Connect); your password never goes to it, and\nJellymatic signs out only that console's own sign-in.\u003c/li\u003e\n\u003cli\u003eChromatic Manager's API listens on 127.0.0.1 only, with a random token per run; every write needs your\nApprove in the window.\u003c/li\u003e\n\u003cli\u003eRemote Pilot works on private networks only and never shows password fields while connected.\u003c/li\u003e\n\u003c/ul\u003e"
},
{
"path":"THIRD-PARTY-NOTICES.md",
"title":"Third-party notices",
"html":"\u003ch1 id=\"h-third-party-notices\"\u003eThird-party notices\u003c/h1\u003e\n\u003cp\u003eComponents by others that are \u003cstrong\u003eincluded in this repository\u003c/strong\u003e, with where their licence text is.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eComponent\u003c/th\u003e\n\u003cth\u003eFiles here\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003cth\u003eLicence text\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro Chromatic FPGA design v18.14 (commit a01aa375), files modified by ChaoticSPARTAN1 for Jellymatic, 2026-11\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/sound-18.40/src/\u003c/code\u003e and \u003ccode\u003efpga/images/link-18.41/src/\u003c/code\u003e: ModRetro's files \u003ccode\u003etop.v\u003c/code\u003e, \u003ccode\u003ertl/BSP/system_monitor.sv\u003c/code\u003e, \u003ccode\u003ertl/EMU/emu_system_top.v\u003c/code\u003e, \u003ccode\u003ertl/EMU/cart.v\u003c/code\u003e, \u003ccode\u003eboard/evt1_x2/evt1_x2.sdc\u003c/code\u003e (both images), \u003ccode\u003ertl/BSP/uart/uart.v\u003c/code\u003e, and the project files \u003ccode\u003eevt1_x2.gprj\u003c/code\u003e, \u003ccode\u003ebuild_options.tcl\u003c/code\u003e (18.41); the full list is in \u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e (the same GPL-3.0 text)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003euart.v\u003c/code\u003e (UART2 wrapper) in ModRetro's design\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/link-18.41/src/rtl/BSP/uart/uart.v\u003c/code\u003e (modified)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0, as ModRetro publishes it in its repository\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e. The file came to ModRetro's design from Gowin's reference design; ModRetro publishes it under its repository's GPL. Kept as ModRetro ships it apart from Jellymatic's marked hook.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMiSTer core (\"Gameboy_MiSTer\") (Till Harbaum and the MiSTer developers), as used in ModRetro's design\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/*/src/rtl/EMU/CORE/gb.v\u003c/code\u003e (modified)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0-or-later (file header)\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShiny Relay 1.1.5 (Shiny Gen), the open firmware for the Chromatic\u003c/td\u003e\n\u003ctd\u003ethe \u003ccode\u003euart_tx_busy\u003c/code\u003e one-cycle gap fix in \u003ccode\u003efpga/images/link-18.41/src/rtl/BSP/system_monitor.sv\u003c/code\u003e (taken from its \u003ccode\u003esystem_monitor.sv\u003c/code\u003e, marked in the file); the request-once status channel pattern of its \u003ccode\u003elink_ev_req\u003c/code\u003e in \u003ccode\u003ertl/chromatic_pocket_link.v\u003c/code\u003e; the plain-word Wi-Fi join messages in \u003ccode\u003echromatic/launcher/shared/wifi_scan.h\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e (the same GPL-3.0 text)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003espeedcontrol.vhd\u003c/code\u003e of ModRetro's design (from the MiSTer core \"Gameboy_MiSTer\"), translated to Verilog for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/fpga-media/sim/speedcontrol_model.v\u003c/code\u003e (translation by ChaoticSPARTAN1, 2026-11)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0, as ModRetro publishes the original (ADDITIONAL-TERMS.md does not apply)\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Simple UART for FPGA\" (Jakub Cabal), as used in ModRetro's design; Verilog port for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ertl/uart2_vhdl_port.v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMIT (port: GPL-3.0-or-later)\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/MIT-uart_for_fpga.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/MIT-uart_for_fpga.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEspressif ESP-IDF bootloader start file\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/bootloader_components/main/bootloader_start.c\u003c/code\u003e (modified)\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin logo (jellyfin/jellyfin-ux, commit 69a2b7b1)\u003c/td\u003e\n\u003ctd\u003escaled in \u003ccode\u003echromatic/launcher/shared/launcher_art.h\u003c/code\u003e, \u003ccode\u003escripts/chromatic_theme.py\u003c/code\u003e; shown in \u003ccode\u003edocs/images/jellymatic-icon.png\u003c/code\u003e and console screenshots\u003c/td\u003e\n\u003ctd\u003eCC BY-SA 4.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRoboto Medium (Roboto 2.138, Copyright 2011 Google Inc.), rasterized and scaled by \u003ccode\u003escripts/build_ui_font.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epocket/ui_font.h\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePress Start 2P (CodeMan38)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/heading-PressStart2P-Regular.ttf\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/OFL-1.1-PressStart2P.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-PressStart2P.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSilkscreen (The Silkscreen Project Authors)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/body-Silkscreen-Regular.ttf\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/OFL-1.1-Silkscreen.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-Silkscreen.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLocal Weather place table, made from the US Census Bureau 2024 Gazetteer files (ZIP Code Tabulation Areas, places)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/places/us-places.txt.gz\u003c/code\u003e (sources and hashes: \u003ccode\u003echromatic/weather/places/SOURCES.txt\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003ePublic domain (works of the US Government, 17 U.S.C. 105)\u003c/td\u003e\n\u003ctd\u003enone required\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eState outlines for the location pack maker, made from the US Census Bureau 2023 cartographic boundary file of the states (1:20,000,000)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/places/us-states.txt.gz\u003c/code\u003e (sources and hashes: \u003ccode\u003echromatic/weather/places/SOURCES.txt\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003ePublic domain (works of the US Government, 17 U.S.C. 105)\u003c/td\u003e\n\u003ctd\u003enone required\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTown land areas for the location pack maker, made from the US Census Bureau 2024 Gazetteer place file\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/places/us-town-sizes.txt.gz\u003c/code\u003e (sources and hashes: \u003ccode\u003echromatic/weather/places/SOURCES.txt\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003ePublic domain (works of the US Government, 17 U.S.C. 105)\u003c/td\u003e\n\u003ctd\u003enone required\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLocal Weather announcer lines, spoken by the Piper speech tool with its voice \u003ccode\u003een_US-norman-medium\u003c/code\u003e (rhasspy/piper-voices)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/weather/wx_sound_data.c\u003c/code\u003e (five short IMA ADPCM clips); generated by \u003ccode\u003echromatic/weather/tools/make_sound.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe voice's model card: public domain, trained from scratch on public-domain LibriVox recordings. Piper itself (GPL-3.0) is not included and is not part of the start-up menu; only its spoken output is\u003c/td\u003e\n\u003ctd\u003enone required\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe Local Weather music loop and alert tone are written in code for Jellymatic (GPL-3.0-or-later), and the wording\nof the announcer lines is the project's own.\u003c/p\u003e\n\u003ch2 id=\"h-data-and-services-used-at-run-time-not-included\"\u003eData and services used at run time (not included)\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSource\u003c/th\u003e\n\u003cth\u003eUsed by\u003c/th\u003e\n\u003cth\u003eTerms\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eUS National Weather Service (\u003ccode\u003eapi.weather.gov\u003c/code\u003e, its map server)\u003c/td\u003e\n\u003ctd\u003ethe start-up menu's Local Weather channel; Chromatic Manager's weather location look-up\u003c/td\u003e\n\u003ctd\u003eUS Government work, public domain (\u003ca href=\"https://www.weather.gov/disclaimer\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eweather.gov/disclaimer\u003c/a\u003e). Not for safety decisions\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epool.ntp.org\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ethe Local Weather clock\u003c/td\u003e\n\u003ctd\u003epublic time service\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-not-included-needed-to-build-or-run\"\u003eNot included, needed to build or run\u003c/h2\u003e\n\u003cp\u003eInstalled separately by you; each comes with its own licence: ESP-IDF v5.3 and its components, ModRetro's\nfull FPGA source with its submodule, Gowin EDA (proprietary, needs your own licence), openFPGALoader\n(Apache-2.0), Python (PSF), PySide6/Qt (LGPL-3.0), esptool (GPL-2.0-or-later), pyserial (BSD-3-Clause).\u003c/p\u003e\n\u003ch2 id=\"h-if-you-distribute-built-images\"\u003eIf you distribute built images\u003c/h2\u003e\n\u003cp\u003eThis repository ships \u003cstrong\u003eno\u003c/strong\u003e built firmware. If you publish a built start-up menu or FPGA image:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eStart-up menu\u003c/strong\u003e (ESP32 binaries): include ESP-IDF's notices (its \u003ccode\u003eLICENSE\u003c/code\u003e and \u003ccode\u003eCOPYRIGHT.rst\u003c/code\u003e, which\nlist FreeRTOS (MIT), lwIP (BSD-3-Clause), Mbed TLS (Apache-2.0), wpa_supplicant (BSD), newlib and the\nEspressif Wi-Fi/PHY libraries (Apache-2.0)), the notice of the root certificate bundle built in for Local\nWeather's HTTPS (made from Mozilla's CA list, MPL-2.0), this repository's licence, and the exact source commit.\nLinking with Espressif's binary-only Wi-Fi/PHY libraries and calling the ESP32 ROM is allowed by the\nadditional permission in \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e, section 4.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFPGA images\u003c/strong\u003e: they are GPL works. Ship them with the GPL text, this repository's source at the same\ncommit and ModRetro's source at the commit in \u003ccode\u003eupstream.lock.json\u003c/code\u003e, plus the notices of the T80 CPU\n(\u003ca href=\"LICENSES/BSD-style-T80.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/BSD-style-T80.txt\u003c/a\u003e, required for synthesized forms) and the\nSameBoy-derived boot ROM (\u003ca href=\"LICENSES/MIT-SameBoy-boot-ROM.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/MIT-SameBoy-boot-ROM.txt\u003c/a\u003e). Both\nare in ModRetro's source, not in this repository, but both are built into the images. The images also\ncontain Gowin IP that ModRetro publishes only in encrypted form; check Gowin's terms for redistributing\nbitstreams before you publish one.\u003c/li\u003e\n\u003c/ul\u003e"

"html":"\u003ch1 id=\"h-additional-terms-gnu-gpl-version-3-section-7\"\u003eAdditional terms (GNU GPL version 3, section 7)\u003c/h1\u003e\n\u003cp\u003eJellymatic is licensed under the GNU General Public License, version 3 or (at your option) any later\nversion (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e). These additional terms apply only to the material in this repository whose\ncopyright is held by its author, \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. They do not apply to parts made by others (see\n\u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e and \u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e), which keep their own licences, nor to\ntranslations of others' files such as \u003ccode\u003echromatic/fpga-media/sim/speedcontrol_model.v\u003c/code\u003e (GPL-3.0, as its original).\u003c/p\u003e\n\u003ch2 id=\"h-1-attribution-section-7b\"\u003e1. Attribution (section 7(b))\u003c/h2\u003e\n\u003cp\u003eAs permitted by GPLv3 section 7(b), if you convey this work or a modified version of it, you must\npreserve the reasonable author attribution \"ChaoticSPARTAN1\":\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ein the credits section of the README (or the equivalent main documentation page), and\u003c/li\u003e\n\u003cli\u003ein any About, credits or similar screen that the program or its user interface shows (for example the\nstart-up menu's credits screen and Chromatic Manager's About tab).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-2-marking-modified-versions-section-7c\"\u003e2. Marking modified versions (section 7(c))\u003c/h2\u003e\n\u003cp\u003eAs permitted by GPLv3 section 7(c), a modified version must be marked in reasonable ways as different\nfrom the original version (for example in its name, version string or About/credits screen), and must not\nbe presented as the original Jellymatic or as made or endorsed by its author.\u003c/p\u003e\n\u003ch2 id=\"h-3-additional-permission-for-fpga-bitstreams-section-7-additional-permission\"\u003e3. Additional permission for FPGA bitstreams (section 7, additional permission)\u003c/h2\u003e\n\u003cp\u003eIf you modify this Program, or any covered work, by combining or linking it with ModRetro's Chromatic\nFPGA design (or a modified version of it) or with Gowin Semiconductor FPGA IP or primitives generated or\nsupplied by Gowin's FPGA design software (or modified versions of them), the licensors of this Program\ngrant you additional permission to convey the resulting work, including FPGA bitstreams. Corresponding\nSource for a non-source form of such a combination need not include the source code of those parts,\nwhich remain under their own licences.\u003c/p\u003e\n\u003cp\u003eThis permission is given only for the copyright held by ChaoticSPARTAN1 (the RTL in \u003ccode\u003ertl/\u003c/code\u003e and\n\u003ccode\u003echromatic/fpga-media/\u003c/code\u003e, and the build scripts). It cannot and does not change the licence of ModRetro's\ndesign, which is itself GPL-3.0: anyone conveying a bitstream must still meet ModRetro's licence terms\nand Gowin's terms for its IP. See THIRD-PARTY-NOTICES.md.\u003c/p\u003e\n\u003ch2 id=\"h-4-additional-permission-for-espressifs-binary-only-libraries-and-the-esp32-rom-section-7-additional-permission\"\u003e4. Additional permission for Espressif's binary-only libraries and the ESP32 ROM (section 7, additional permission)\u003c/h2\u003e\n\u003cp\u003eIf you modify this Program, or any covered work, by linking or combining it with the binary-only\nlibraries that Espressif Systems supplies with ESP-IDF for the ESP32 (such as the Wi-Fi, PHY, Bluetooth,\ncoexistence and RF calibration libraries, for example \u003ccode\u003elibnet80211\u003c/code\u003e, \u003ccode\u003elibpp\u003c/code\u003e, \u003ccode\u003elibphy\u003c/code\u003e, \u003ccode\u003elibrtc\u003c/code\u003e and\n\u003ccode\u003elibcoexist     tabs.textContent = ''; list.textContent = '';
    data.groups.forEach(function (g) {
      tabs.appendChild(link(g.name, g.pages[0].path, g.name === page.group ? 'on' : ''));
      if (data.theme === 'chroma' && g.name !== page.group) return;
      var head = document.createElement('div'); head.className = 'group'; head.textContent = g.name; list.appendChild(head);
      g.pages.forEach(function (p) { list.appendChild(link(p.title, p.path, p.path === page.path ? 'on' : '')); });
    });
  }
  function show() {
    var where = parse(), page = pages[where.path];
    if (current !== page) {
      el('page').innerHTML = page.html;
      el('title').textContent = page.title;
      el('crumb').textContent = data.project + ' / ' + page.path;
      document.title = page.title + ' \u00b7 ' + data.project + ' documentation';
      nav(page);
      current = page;
    }
    var target = where.anchor && document.getElementById('h-' + where.anchor.toLowerCase());
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
