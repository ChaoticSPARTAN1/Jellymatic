"title":"Start here",
"html":"\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/readme/jellymatic-banner.png\" width=\"100%\" alt=\"Jellymatic: Jellyfin on your ModRetro Chromatic. A pixel-art Chromatic handheld next to a red Chromatic Manager window reading Games + Jellyfin + Pocket link\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  A start-up menu for the Chromatic that keeps your games exactly as they are, a Jellyfin app,\n  a link to the Analogue Pocket, and a PC tool that installs, checks and undoes everything.\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  \u003cb\u003eRead the guide online:\u003c/b\u003e \u003ca href=\"https://chaoticspartan1.github.io/Jellymatic/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003echaoticspartan1.github.io/Jellymatic\u003c/a\u003e,\n  as a PDF: \u003ca href=\"docs/Jellymatic-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/Jellymatic-Guide.pdf\u003c/a\u003e (opens right on GitHub),\n  or offline: download and double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e.\n\u003c/p\u003e\n\u003ch2 id=\"h-safety\"\u003eSafety\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eJellymatic is an independent project, not affiliated with ModRetro or the Jellyfin project.\u003c/strong\u003e\nIt is not made, endorsed or supported by ModRetro, Analogue or the Jellyfin project. \"Jellyfin\" is a\ntrademark of its owners; \"ModRetro\" and \"Chromatic\" are trademarks of ModRetro, Inc.; they are used here\nonly to say what this project works with. \u003cstrong\u003eUse it at your own risk.\u003c/strong\u003e It changes firmware on your\nconsole. Support is not guaranteed.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhat it does\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eStart-up menu\u003c/strong\u003e (ESP32 \"launcher\")\u003c/td\u003e\n\u003ctd\u003eShows \u003cstrong\u003eGames\u003c/strong\u003e, \u003cstrong\u003eJellyfin\u003c/strong\u003e, \u003cstrong\u003eTV\u003c/strong\u003e, \u003cstrong\u003eChromaTube\u003c/strong\u003e and \u003cstrong\u003eOther firmware\u003c/strong\u003e when you switch the console on (TV is shown unless you hide it; ChromaTube is off until you switch it on). Games is always there, always first, and starts the console's own, untouched firmware.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eJellyfin app\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBrowse your Jellyfin library and play video with sound on the Chromatic, over Wi-Fi. Wi-Fi and the Jellyfin sign-in are set up on the console itself.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eTV\u003c/strong\u003e (\u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eA retro \u003cstrong\u003eLocal Weather\u003c/strong\u003e channel drawn on the console from US weather data (no server needed; it shows Orlando, FL until you choose your place), and optional \u003cstrong\u003elive channels\u003c/strong\u003e through your Jellyfin server's Live TV.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eChromaTube\u003c/strong\u003e (\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eOptional and unofficial (not affiliated with YouTube or Google): the newest videos of channels you choose, through a small third-party server tool and one Jellyfin library.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePocket link\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAn updated console chip (FPGA) image, 18.41, that lets the Chromatic feed an Analogue Pocket over a link cable. The Pocket side is \u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eChromatic Manager\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eA Windows program (window, text menu, local API and MCP server) that installs, updates, checks, backs up and removes all of the above, one Approve at a time.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eRemote Pilot\u003c/strong\u003e (bundled)\u003c/td\u003e\n\u003ctd\u003eSee and press the console's menus from your PC, in your browser or in the Manager's own tab. The full tool is \u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/startup-menu-apps.png\" width=\"320\" alt=\"The start-up menu: Games, Jellyfin, TV, ChromaTube, Other firmware\"\u003e\n  \u003cimg src=\"docs/images/player-details.png\" width=\"320\" alt=\"The Jellyfin app on the console (sample data)\"\u003e\n  \u003cimg src=\"docs/images/pocket-link.png\" width=\"320\" alt=\"The Pocket link screen\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/manager-home.png\" width=\"480\" alt=\"Chromatic Manager: up to date\"\u003e\n\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eAll pictures are drawn by the project's own preview renderers with made-up sample data.\u003c/em\u003e\u003c/p\u003e\n\u003ch2 id=\"h-apps-on-the-menu-tv-and-chromatube\"\u003eApps on the menu: TV and ChromaTube\u003c/h2\u003e\n\u003cp\u003eFrom start-up menu 1.6 the console has two more apps, each with its own row, its own guide and its own repository,\nbuilt into the same start-up menu (one image to install, check and undo):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTV\u003c/strong\u003e (\u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e): opens straight to the \u003cstrong\u003eLocal Weather\u003c/strong\u003e\nchannel, which needs only Wi-Fi; it shows Orlando, FL until you choose your US place in Chromatic Manager\n(\u003cstrong\u003eSettings › Weather location\u003c/strong\u003e). Live channels are optional: one tuner on your Jellyfin server's Live TV, added\nsafely with \u003cstrong\u003eSettings › Live TV channels\u003c/strong\u003e or Chromavision's PC tools.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChromaTube\u003c/strong\u003e (\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e): optional, off until you switch it on,\nand unofficial (not affiliated with YouTube or Google). Its server tool conflicts with YouTube's Terms of Service, so\nsetting it up is your own choice: read its \"Before you start\" first.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eChoose the rows in Chromatic Manager (\u003cstrong\u003eSettings › Apps\u003c/strong\u003e) or on the console (\u003cstrong\u003eSelect\u003c/strong\u003e on a row hides it; \u003cstrong\u003eOther\nfirmware › Show hidden apps\u003c/strong\u003e brings it back): \u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/weather-current.png\" width=\"320\" alt=\"Local Weather: current conditions (sample data)\"\u003e\n  \u003cimg src=\"docs/images/tv-channel-list.png\" width=\"320\" alt=\"The TV channel list (sample names)\"\u003e\n  \u003cimg src=\"docs/images/chromatube-details.png\" width=\"320\" alt=\"ChromaTube: a video\u0026#x27;s page (sample data)\"\u003e\n\u003c/p\u003e\n\u003ch2 id=\"h-remote-pilot-your-chromatic-on-your-pc-screen\"\u003eRemote Pilot: your Chromatic on your PC screen\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eRemote Pilot\u003c/strong\u003e\u003c/a\u003e lets you \u003cstrong\u003esee and control the\nChromatic from your PC\u003c/strong\u003e: its live screen, its buttons, its logs and screenshots, over the USB cable or\nyour home Wi-Fi. A copy is bundled in \u003ccode\u003eremote-pilot/\u003c/code\u003e so the Manager's \u003cstrong\u003eRemote Pilot\u003c/strong\u003e tab works out of\nthe box.\u003c/p\u003e\n\u003cp\u003eWhy it is included:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEasier set-up and troubleshooting\u003c/strong\u003e: read the console's menus and messages on a big screen instead of\nsquinting at the handheld, and press its buttons with the mouse.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClean bug reports\u003c/strong\u003e: save screenshots and logs with addresses, network names and codes masked.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI assistants, safely\u003c/strong\u003e: Claude, Codex or another assistant can test or demo the console through\nRemote Pilot's command line (it presses buttons and reads the screen; it cannot change firmware).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRemote demos\u003c/strong\u003e: show the console's screens to someone else from your PC.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIt is \u003cstrong\u003eoptional\u003c/strong\u003e, stays \u003cstrong\u003eon your own PC and network\u003c/strong\u003e by default, and is \u003cstrong\u003enever needed\u003c/strong\u003e to watch\nJellyfin. Full documentation: \u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e and\n\u003ca href=\"#docs/Remote-Pilot.md\"\u003edocs/Remote-Pilot.md\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-quick-start-plain-english\"\u003eQuick start (plain English)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eRead \u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e.\u003c/strong\u003e It explains why your games keep working and what\nis changed on the console.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGet the tools\u003c/strong\u003e (\u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e): a Windows PC, Python 3.12+, the USB cable,\nopenFPGALoader with GWU2X support (for the first backup), and your Chromatic switched \u003cstrong\u003eon\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDownload the release files\u003c/strong\u003e from the \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/releases/latest\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eReleases page\u003c/a\u003e:\n\u003ccode\u003eJellymatic-start-up-menu-\u0026lt;version\u0026gt;.zip\u003c/code\u003e (the start-up menu) and, for Jellyfin sound and the Pocket link,\n\u003ccode\u003eJellymatic-FPGA-images-\u0026lt;version\u0026gt;.zip\u003c/code\u003e. Extract both \u003cstrong\u003einto your Jellymatic folder\u003c/strong\u003e (the one with\n\u003ccode\u003eChromatic-Manager-Window.cmd\u003c/code\u003e), keeping their folders: they fill \u003ccode\u003erelease\\launcher\\\u003c/code\u003e and\n\u003ccode\u003efpga\\images\\*\\build\\\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOpen Chromatic Manager\u003c/strong\u003e: double-click \u003ccode\u003eChromatic-Manager-Window.cmd\u003c/code\u003e (first run sets everything up;\nsee \u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall with Chromatic Manager\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePress the one big button\u003c/strong\u003e the Manager shows (Install), then \u003cstrong\u003eApprove\u003c/strong\u003e. The first time it takes a\nfull backup of both chips (about 15 minutes, nothing written), then writes the start-up menu, reads\nevery byte back and checks the console starts. The backup's second copy is usually on the same disk;\nput it on another disk or a USB stick for real safety (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003eInstall\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOn the console\u003c/strong\u003e: switch it off and on, choose \u003cstrong\u003eJellyfin\u003c/strong\u003e, press \u003cstrong\u003eSelect\u003c/strong\u003e for setup, add your\nWi-Fi and sign in to Jellyfin with \u003cstrong\u003eQuick Connect\u003c/strong\u003e\n(\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePlay\u003c/strong\u003e: choose a film or episode and press A (\u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOptional\u003c/strong\u003e: choose \u003cstrong\u003eTV\u003c/strong\u003e for Local Weather (set your place in the Manager's \u003cstrong\u003eSettings › Weather location\u003c/strong\u003e), and\nset up live channels or ChromaTube if you want them (\u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eSomething went wrong? \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e explains what the Manager does by itself, and how to put\neverything back, including with ModRetro's \u003cstrong\u003eofficial\u003c/strong\u003e update tool.\u003c/p\u003e\n\u003ch2 id=\"h-documentation-wiki\"\u003eDocumentation (wiki)\u003c/h2\u003e\n\u003cp\u003eStart at \u003cstrong\u003e\u003ca href=\"#docs/Home.md\"\u003edocs/Home.md\u003c/a\u003e\u003c/strong\u003e. Pages: What you need · Before you start · Install with Chromatic\nManager · First run on the console · Using Jellyfin on the Chromatic · Apps on the start-up menu · TV and Local\nWeather · ChromaTube · Hosting Jellyfin · Pocket link · Remote Pilot · Recovery · FAQ · Building from source · AI\nprompt examples · Credits \u0026amp; licences.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAs one PDF:\u003c/strong\u003e \u003ca href=\"docs/Jellymatic-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/Jellymatic-Guide.pdf\u003c/a\u003e holds every page, with a clickable table\nof contents; GitHub shows it right in the browser.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOffline:\u003c/strong\u003e download or clone this repository, then double-click \u003cstrong\u003e\u003ccode\u003eOpen-Documentation.html\u003c/code\u003e\u003c/strong\u003e in its main\nfolder. It opens every page above in your browser, with pictures, without a server or an internet\nconnection (keep it in the repository folder: it loads the pictures from \u003ccode\u003edocs/\u003c/code\u003e). It is built from the\nMarkdown pages by \u003ccode\u003escripts/build_docs_html.py\u003c/code\u003e (the PDF by \u003ccode\u003escripts/build_docs_pdf.py\u003c/code\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-what-is-in-this-repository\"\u003eWhat is in this repository\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003echromatic/launcher/     start-up menu (ESP-IDF 5.3 app, custom bootloader, host tests)\nchromatic/jellyfin/     the console's Jellyfin app, with its TV and ChromaTube modes (shared C, host-tested)\nchromatic/weather/      the Local Weather channel: pages, data reader, radar decoder, sound, location record\nchromatic/fpga-media/   console chip (FPGA) sound hooks, Verilog + test benches\nrtl/                    Pocket link bridge and link-port RTL + test benches\nfpga/images/            the exact sources and build receipts of the reviewed FPGA images 18.40 and 18.41\nscripts/                Chromatic Manager (GUI, text menu, API, MCP), FPGA staging, tests, preview renderer\nremote-pilot/           Remote Pilot receiver + web viewer, Chromatic package and presets\npocket/, shared/        the small shared parts the launcher uses (link framing, fonts)\ndocs/                   the wiki\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eNot in this repository:\u003c/strong\u003e ModRetro's firmware or updater, any console backup, built firmware images,\nthe Gowin FPGA tools or licence, and anything personal. The start-up menu you can build yourself. \u003cstrong\u003eJellyfin\nsound and the Pocket link need the official release files\u003c/strong\u003e of the console chip (FPGA) images 18.40 and\n18.41 (\u003ccode\u003eevt1_x2.fs\u003c/code\u003e and \u003ccode\u003eevt1_x2.bin\u003c/code\u003e), published separately as release assets on the\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/releases/latest\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eReleases page\u003c/a\u003e (\u003ccode\u003eJellymatic-FPGA-images-\u0026lt;version\u0026gt;.zip\u003c/code\u003e, with\nthe ready-built start-up menu in \u003ccode\u003eJellymatic-start-up-menu-\u0026lt;version\u0026gt;.zip\u003c/code\u003e): a build of your own will\nnot match the SHA-256 pins the Manager checks, so it is refused (see \u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e).\nYour own files (Wi-Fi list, Jellyfin sign-in, backups) live in a per-user folder, \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e,\ncreated on first run and never part of Git.\u003c/p\u003e\n\u003ch2 id=\"h-sibling-projects\"\u003eSibling projects\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e: Jellyfin on the Analogue Pocket (the Pocket side of the Pocket link).\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e: this project.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e: the TV row (Local Weather, optional Live TV): its guide and server tools.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e: the optional ChromaTube row: its guide and server set-up.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e: Remote Pilot, the full PC remote-control tool.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-licence\"\u003eLicence\u003c/h2\u003e\n\u003cp\u003eJellymatic is free software: \u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), with additional terms under GPLv3\nsection 7 (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e): keep the author attribution \"ChaoticSPARTAN1\" (7(b)),\nmark modified versions as modified (7(c)), and additional permissions for FPGA bitstreams that combine\nJellymatic's RTL with ModRetro's design and Gowin IP, and for linking the console firmware with Espressif's\nbinary-only Wi-Fi/PHY libraries and the ESP32 ROM.\nParts made by others keep their own licences; see \u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e, \u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e\nand \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-contributing-and-security\"\u003eContributing and security\u003c/h2\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome: \u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e. To report a\nsecurity problem privately: \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e. Never post Wi-Fi details, server addresses, tokens\nor logs with addresses.\u003c/p\u003e\n\u003ch2 id=\"h-credits\"\u003eCredits\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. Built on ModRetro's open-source Chromatic FPGA source (GPL-3.0),\nEspressif ESP-IDF (Apache-2.0), the MiSTer core (\"Gameboy_MiSTer\"), and the Jellyfin logo (CC BY-SA 4.0, the\nJellyfin contributors). Small parts come from \u003cstrong\u003eShiny Relay\u003c/strong\u003e by Shiny Gen (GPL-3.0): its \u003ccode\u003euart_tx_busy\u003c/code\u003e fix in the\n18.41 image and the request-once status channel pattern of the Pocket link bridge. Thanks also to the authors of\nChromatiX, whose open documentation was read as a reference. Local Weather uses US National Weather Service data and\nthe US Census Bureau Gazetteer (both public domain); its announcer lines were made with Piper and its public-domain\n\"Norman\" voice. Full list: \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e"
},

"path":"docs/Home.md",
"title":"Wiki home",
"html":"\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/jellymatic-icon.png\" width=\"132\" alt=\"Pixel Chromatic with the Jellyfin logo\"\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/jellymatic-logo.png\" width=\"444\" alt=\"Jellymatic\"\u003e\u003c/p\u003e\n\u003ch1 id=\"h-jellymatic-wiki\"\u003eJellymatic wiki\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eJellyfin on your ModRetro Chromatic\u003c/strong\u003e, with a start-up menu that keeps your games exactly as they were.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRead it as one PDF:\u003c/strong\u003e \u003ca href=\"docs/Jellymatic-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic-Guide.pdf\u003c/a\u003e (opens right on GitHub). \u003cstrong\u003eOr offline:\u003c/strong\u003e\ndownload or clone the repository, then double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e in its main folder. Every\npage here opens in your browser, with pictures, with no internet connection needed.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eJellymatic is an independent project, not affiliated with ModRetro or the Jellyfin project. Use it at\nyour own risk; support is not guaranteed. \"Jellyfin\", \"ModRetro\" and \"Chromatic\" are trademarks of their\nowners, used only to say what this works with.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-contents\"\u003eContents\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePage\u003c/th\u003e\n\u003cth\u003eRead it when\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBefore anything else: the console, the PC, the cable, the server\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to know why your games keep working and what changes\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall with Chromatic Manager\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou are ready to install or update\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWi-Fi, Jellyfin sign-in, Pocket link set-up on the console\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin on the Chromatic\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBrowsing and playing\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to know the rows, or switch TV or ChromaTube on or off\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/TV-and-Local-Weather.md\"\u003eTV and Local Weather\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eThe weather channel, your weather location, optional live channels\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/ChromaTube.md\"\u003eChromaTube\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eThe optional video-channel row\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Hosting-Jellyfin.md\"\u003eHosting Jellyfin\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYour server is not reachable over Wi-Fi yet\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou have an Analogue Pocket and a link cable\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Remote-Pilot.md\"\u003eRemote Pilot\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to see and press the console's menus from the PC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eSomething went wrong, or you want to undo everything\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eShort answers\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Building-from-source.md\"\u003eBuilding from source\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to build the start-up menu, the FPGA images or the Manager yourself\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/AI-prompt-examples.md\"\u003eAI prompt examples\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou use Claude, Codex or another assistant with the Manager\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWho made what, and under which licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Design-notes.md\"\u003eDesign notes\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou read the code and meet a reference to an internal note\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-in-one-picture\"\u003eIn one picture\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003e Switch on ──► start-up menu ──┬─► Games ............ the console's own firmware, untouched (always there)\n                               ├─► Jellyfin ......... browse and play over Wi-Fi (Select: set-up)\n                               │      └─► Pocket link  feed an Analogue Pocket over a link cable\n                               ├─► TV ............... Local Weather; optional live channels (shown unless you hide it)\n                               ├─► ChromaTube ....... optional video channels through Jellyfin (off until you switch it on)\n                               └─► Other firmware ... the stock firmware, listed and protected\n Hold any button while switching on ──► straight to Games, no menu\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/startup-menu-apps.png\" width=\"320\" alt=\"The start-up menu with Games, Jellyfin, TV, ChromaTube and Other firmware\"\u003e\u003c/p\u003e\n\u003cp\u003eThe PC side is \u003cstrong\u003eChromatic Manager\u003c/strong\u003e: one window with one main button at a time. It backs up the\nconsole, installs or updates the start-up menu, reads every byte back, and can undo all of it.\u003c/p\u003e"
},

"title":"What you need",
"html":"\u003ch1 id=\"h-what-you-need\"\u003eWhat you need\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › What you need\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/What-you-need.md:for-the-start-up-menu-and-jellyfin\"\u003eFor the start-up menu and Jellyfin\u003c/a\u003e ·\n\u003ca href=\"#docs/What-you-need.md:for-jellyfin-sound-and-the-pocket-link\"\u003eFor Jellyfin sound and the Pocket link\u003c/a\u003e ·\n\u003ca href=\"#docs/What-you-need.md:for-tv-and-chromatube-optional\"\u003eFor TV and ChromaTube\u003c/a\u003e · \u003ca href=\"#docs/What-you-need.md:not-needed\"\u003eNot needed\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-for-the-start-up-menu-and-jellyfin\"\u003eFor the start-up menu and Jellyfin\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eModRetro Chromatic\u003c/strong\u003e with its \u003cstrong\u003eofficial firmware\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe start-up menu sits next to it\u003c/td\u003e\n\u003ctd\u003eTested with official MCU firmware v4.6 and FPGA v18.14. The Manager reads the console first and \u003cstrong\u003erefuses\u003c/strong\u003e layouts or firmware it does not know, rather than guess.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003ecartridge\u003c/strong\u003e in the console\u003c/td\u003e\n\u003ctd\u003eThe menu draws over a running cartridge\u003c/td\u003e\n\u003ctd\u003eAny working cartridge or flash cart. Without one, the console simply starts as normal.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eWindows 10 or 11 PC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eChromatic Manager runs there\u003c/td\u003e\n\u003ctd\u003emacOS/Linux: the code is Python and mostly portable, but only Windows is tested.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePython 3.12 or newer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eRuns Chromatic Manager from source\u003c/td\u003e\n\u003ctd\u003eFrom \u003ca href=\"https://www.python.org/downloads/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003epython.org\u003c/a\u003e. \u003ccode\u003eSetup-Jellymatic.ps1\u003c/code\u003e installs the rest.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eUSB-C data cable\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003ePC ↔ console\u003c/td\u003e\n\u003ctd\u003eThe console must be switched \u003cstrong\u003eon\u003c/strong\u003e while the Manager works.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eJellyfin server\u003c/strong\u003e on your network, with \u003cstrong\u003eQuick Connect\u003c/strong\u003e turned on\u003c/td\u003e\n\u003ctd\u003eThe console signs in with its own code\u003c/td\u003e\n\u003ctd\u003eSee \u003ca href=\"#docs/Hosting-Jellyfin.md\"\u003eHosting Jellyfin\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e2.4 GHz Wi-Fi\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe console's radio\u003c/td\u003e\n\u003ctd\u003eA phone hotspot works. Hotel-style sign-in pages are not supported.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe \u003cstrong\u003estart-up menu image\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eWhat the Manager installs\u003c/td\u003e\n\u003ctd\u003eDownload \u003ccode\u003eJellymatic-start-up-menu-\u0026lt;version\u0026gt;.zip\u003c/code\u003e from the \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/releases/latest\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eReleases page\u003c/a\u003e and extract it into your Jellymatic folder (it fills \u003ccode\u003erelease/launcher/\u003c/code\u003e), or build it (\u003ca href=\"#docs/Building-from-source.md\"\u003eBuilding from source\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eopenFPGALoader\u003c/strong\u003e with \u003cstrong\u003eGWU2X\u003c/strong\u003e cable support\u003c/td\u003e\n\u003ctd\u003eThe first \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003efull backup\u003c/a\u003e reads the console chip (FPGA) too, over the console's USB\u003c/td\u003e\n\u003ctd\u003eNot shipped with Jellymatic (Apache-2.0). Ready-made downloads often lack GWU2X support, so it usually has to be \u003cstrong\u003ebuilt\u003c/strong\u003e: see ModRetro's own instructions in its \u003ca href=\"https://github.com/ModRetro/oss-chromatic-console-fpga#flashing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromatic FPGA source\u003c/a\u003e (README, \"Flashing\": openFPGALoader must be compiled with GWU2X cable support) and \u003ca href=\"https://trabucayre.github.io/openFPGALoader/guide/install.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eopenFPGALoader's build guide\u003c/a\u003e. Put it at \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\tools\\openFPGALoader\\openFPGALoader.exe\u003c/code\u003e or set \u003ccode\u003eJELLYMATIC_OPENFPGALOADER\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe Gowin \u003cstrong\u003eGWU2X USB driver\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe JTAG bridge openFPGALoader talks to\u003c/td\u003e\n\u003ctd\u003eUsually installed by ModRetro's official updater.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-for-jellyfin-sound-and-the-pocket-link\"\u003eFor Jellyfin sound and the Pocket link\u003c/h2\u003e\n\u003cp\u003eThese change the console's \u003cstrong\u003egame chip (FPGA)\u003c/strong\u003e. They are optional; the start-up menu and silent video\nwork without them.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003efull backup of your console\u003c/strong\u003e (both chips)\u003c/td\u003e\n\u003ctd\u003eThe Manager will only change the FPGA when it can put your original image back. It takes this backup by itself the first time (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003eInstall\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eopenFPGALoader\u003c/strong\u003e and the \u003cstrong\u003eGWU2X driver\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAs above: they read and write the FPGA over the console's USB.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe \u003cstrong\u003eofficial release files\u003c/strong\u003e of the FPGA images 18.40 (sound) and 18.41 (sound + Pocket link)\u003c/td\u003e\n\u003ctd\u003eThe sound and the Pocket link \u003cstrong\u003eneed the official release files\u003c/strong\u003e (\u003ccode\u003eevt1_x2.fs\u003c/code\u003e and \u003ccode\u003eevt1_x2.bin\u003c/code\u003e of each image), published separately as \u003cstrong\u003erelease assets\u003c/strong\u003e of this project: download \u003ccode\u003eJellymatic-FPGA-images-\u0026lt;version\u0026gt;.zip\u003c/code\u003e from the \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/releases/latest\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eReleases page\u003c/a\u003e and extract it into your Jellymatic folder, keeping its folders. It puts each pair in its folder's \u003ccode\u003ebuild\\\u003c/code\u003e (\u003ccode\u003efpga/images/sound-18.40/build/\u003c/code\u003e, \u003ccode\u003efpga/images/link-18.41/build/\u003c/code\u003e). This repository has the exact sources and receipts, but no binaries. \u003cstrong\u003eA build of your own will not match the pins\u003c/strong\u003e (it is almost never byte-identical to the reviewed image), and the Manager refuses it on purpose: only the reviewed image was tried on a console (\u003ca href=\"#docs/Building-from-source.md:console-chip-fpga-images\"\u003eBuilding from source\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFor the Pocket link: an \u003cstrong\u003eAnalogue Pocket\u003c/strong\u003e, \u003cstrong\u003ePocketFin\u003c/strong\u003e, and a \u003cstrong\u003elink cable\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSee \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-for-tv-and-chromatube-optional\"\u003eFor TV and ChromaTube (optional)\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eFor\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStart-up menu \u003cstrong\u003e1.6.5 or newer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe TV and ChromaTube rows, your own weather location and its area pages\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWi-Fi with \u003cstrong\u003einternet access\u003c/strong\u003e and a \u003cstrong\u003eUS place\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLocal Weather (no Jellyfin server needed)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYour Jellyfin server's \u003cstrong\u003eLive TV\u003c/strong\u003e with one tuner, set up with \u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e's tools\u003c/td\u003e\n\u003ctd\u003eLive channels\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA small \u003cstrong\u003eDocker\u003c/strong\u003e container beside your server and one library, set up with \u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e's files and tool\u003c/td\u003e\n\u003ctd\u003eChromaTube\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn \u003cstrong\u003eadministrator\u003c/strong\u003e sign-in, typed once on the PC\u003c/td\u003e\n\u003ctd\u003eAdding the tuner or the library (the console keeps a normal user)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eSee \u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-not-needed\"\u003eNot needed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eNo developer cartridge, UART adapter or soldering.\u003c/li\u003e\n\u003cli\u003eNo account anywhere, and nothing is uploaded. Your Wi-Fi and Jellyfin details and your weather location stay on\nyour PC (\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e) and your console.\u003c/li\u003e\n\u003cli\u003eNo ModRetro files: Jellymatic never ships their firmware or updater. For official updates you use\n\u003cstrong\u003eModRetro's own update tool\u003c/strong\u003e, downloaded from ModRetro (\u003ca href=\"#docs/Recovery.md:official-updates-and-restoring-chromatic-os\"\u003eRecovery\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Before-you-start.md",
"title":"Before you start",
"html":"\u003ch1 id=\"h-before-you-start-keeping-your-games-working\"\u003eBefore you start: keeping your games working\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Before you start\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Before-you-start.md:how-the-start-up-menu-works\"\u003eHow the start-up menu works\u003c/a\u003e ·\n\u003ca href=\"#docs/Before-you-start.md:games-is-always-there\"\u003eGames is always there\u003c/a\u003e · \u003ca href=\"#docs/Before-you-start.md:what-is-changed-on-the-console\"\u003eWhat is changed on the console\u003c/a\u003e ·\n\u003ca href=\"#docs/Before-you-start.md:what-is-never-changed\"\u003eWhat is never changed\u003c/a\u003e · \u003ca href=\"#docs/Before-you-start.md:if-something-fails\"\u003eIf something fails\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-how-the-start-up-menu-works\"\u003eHow the start-up menu works\u003c/h2\u003e\n\u003cp\u003eThe Chromatic has two chips: an \u003cstrong\u003eESP32\u003c/strong\u003e (menus, Wi-Fi, settings) and an \u003cstrong\u003eFPGA\u003c/strong\u003e (the game hardware itself).\nJellymatic adds a small \u003cstrong\u003estart-up menu\u003c/strong\u003e to the ESP32, \u003cstrong\u003enext to\u003c/strong\u003e the official firmware, not instead of it.\u003c/p\u003e\n\u003cp\u003eWhen you switch the console on, a tiny boot program makes one decision:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eHow the console started\u003c/th\u003e\n\u003cth\u003eWhat runs\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eYou switched it on\u003c/td\u003e\n\u003ctd\u003eThe start-up menu (if its image checks out; otherwise the official firmware)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAnything else: a restart, a crash, a watchdog\u003c/td\u003e\n\u003ctd\u003eThe official firmware, directly\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYou held any button while switching on\u003c/td\u003e\n\u003ctd\u003eThe official firmware, directly, no menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThere is no setting, flag or saved state that could go wrong: the reason for the start is the only input.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/startup-menu.png\" width=\"320\" alt=\"Start-up menu with Games, Jellyfin and Other firmware\"\u003e\n\u003cimg src=\"docs/images/other-firmware.png\" width=\"320\" alt=\"Other firmware: the stock Chromatic is protected and always there\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-games-is-always-there\"\u003eGames is always there\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eGames\u003c/strong\u003e (or \u003cstrong\u003eB\u003c/strong\u003e on the menu) restarts the console into its own firmware and your cartridge. It is\nthe same as before Jellymatic, with your settings, palettes and saves.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOther firmware\u003c/strong\u003e lists the stock Chromatic first, marked \"Protected, always here\".\u003c/li\u003e\n\u003cli\u003eThe menu waits for your choice; nothing starts by itself, and nothing is lost by leaving it open.\u003c/li\u003e\n\u003cli\u003eCartridges, flash carts, their SD cards and saves are never read or written by Jellymatic.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-is-changed-on-the-console\"\u003eWhat is changed on the console\u003c/h2\u003e\n\u003cp\u003eOnly three areas of the ESP32's flash:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eArea\u003c/th\u003e\n\u003cth\u003eWhat\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBoot program (\u003ccode\u003e0x1000\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eA small custom bootloader built from Espressif's ESP-IDF 5.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePartition table (\u003ccode\u003e0x8000\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eThe three official rows, unchanged and in order, plus one row for the menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMenu area (\u003ccode\u003e0x260000\u003c/code\u003e onward)\u003c/td\u003e\n\u003ctd\u003eThe start-up menu and, at the very end, your Wi-Fi and Jellyfin set-up\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eOptional, only if you choose Jellyfin sound or the Pocket link: the FPGA image is replaced by a version of\nModRetro's own open-source design with sound hooks (18.40) or with sound hooks and the Pocket link\nbridge (18.41). It still plays every game; it reports itself with the same major version (18) so\nModRetro's tools still recognise the console.\u003c/p\u003e\n\u003ch2 id=\"h-what-is-never-changed\"\u003eWhat is never changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe \u003cstrong\u003eofficial firmware\u003c/strong\u003e slot, your \u003cstrong\u003esettings\u003c/strong\u003e (NVS) and \u003cstrong\u003eradio calibration\u003c/strong\u003e (PHY data).\u003c/li\u003e\n\u003cli\u003eThe cartridge, its saves, and any flash cart.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-if-something-fails\"\u003eIf something fails\u003c/h2\u003e\n\u003cp\u003eEvery change is made by Chromatic Manager, and every write:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003estarts from a \u003cstrong\u003ebackup\u003c/strong\u003e of the console (the first time: both chips, each read twice), saved with a second copy on your PC (put that copy on another disk or a USB stick if you can);\u003c/li\u003e\n\u003cli\u003eis \u003cstrong\u003ewritten down in a journal\u003c/strong\u003e before it happens, so an interrupted job can be finished or undone;\u003c/li\u003e\n\u003cli\u003eis \u003cstrong\u003eread back\u003c/strong\u003e and compared byte for byte, then the whole flash is checked;\u003c/li\u003e\n\u003cli\u003eneeds \u003cstrong\u003eyour Approve\u003c/strong\u003e in the Manager's window (an AI assistant can ask, but you decide);\u003c/li\u003e\n\u003cli\u003eends with a \u003cstrong\u003estart check\u003c/strong\u003e: the console must start and keep running.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThe ESP32 also has a recovery mode in its read-only ROM that no flash content can block, so the Manager\n(or ModRetro's official updater) can always reach it again. See \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall with Chromatic Manager\u003c/a\u003e\u003c/p\u003e"
}
]
