"path":"docs/Remote-Pilot.md",
"title":"Remote Pilot",
"html":"\u003ch1 id=\"h-remote-pilot\"\u003eRemote Pilot\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Remote Pilot\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Remote-Pilot.md:what-it-is\"\u003eWhat it is\u003c/a\u003e · \u003ca href=\"#docs/Remote-Pilot.md:why-it-is-bundled\"\u003eWhy it is bundled\u003c/a\u003e · \u003ca href=\"#docs/Remote-Pilot.md:in-chromatic-manager\"\u003eIn Chromatic Manager\u003c/a\u003e ·\n\u003ca href=\"#docs/Remote-Pilot.md:in-your-browser-web-tool\"\u003eIn your browser\u003c/a\u003e · \u003ca href=\"#docs/Remote-Pilot.md:pairing\"\u003ePairing\u003c/a\u003e · \u003ca href=\"#docs/Remote-Pilot.md:for-ai-assistants-command-line\"\u003eFor AI assistants\u003c/a\u003e ·\n\u003ca href=\"#docs/Remote-Pilot.md:safety\"\u003eSafety\u003c/a\u003e · \u003ca href=\"#docs/Remote-Pilot.md:full-documentation\"\u003eFull documentation\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eRemote Pilot\u003c/strong\u003e\u003c/a\u003e is a small program on your PC that\nshows the Chromatic in your web browser: you \u003cstrong\u003esee its live screen, press its buttons, read its logs and\nsave screenshots\u003c/strong\u003e, over the USB cable or your home Wi-Fi. It works with the start-up menu and the\nJellyfin screens. It cannot change firmware; only Chromatic Manager does that.\u003c/p\u003e\n\u003cp\u003eThe \u003ccode\u003eremote-pilot/\u003c/code\u003e folder is a copy of the\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e repository: its Chromatic web tool part (the\nreceiver, the web viewer, the Chromatic package and the \u003cstrong\u003eModRetro Chromatic\u003c/strong\u003e and \u003cstrong\u003eExample\u003c/strong\u003e presets).\u003c/p\u003e\n\u003ch2 id=\"h-why-it-is-bundled\"\u003eWhy it is bundled\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEasier set-up and troubleshooting\u003c/strong\u003e: read the console's menus and messages on your PC screen instead\nof squinting at the handheld, and click its buttons.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClean bug reports\u003c/strong\u003e: screenshots and logs with addresses, network names and codes masked.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI assistants, safely\u003c/strong\u003e: Claude, Codex or another assistant can test or demo the console through\nRemote Pilot's command line; it presses buttons and reads the screen, nothing more.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRemote demos\u003c/strong\u003e: show the console's screens to someone else from your PC.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIt is \u003cstrong\u003eoptional\u003c/strong\u003e, works \u003cstrong\u003eonly on your own PC and private network\u003c/strong\u003e by default, and is \u003cstrong\u003enever needed\u003c/strong\u003e\nto watch Jellyfin.\u003c/p\u003e\n\u003ch2 id=\"h-in-chromatic-manager\"\u003eIn Chromatic Manager\u003c/h2\u003e\n\u003cp\u003eOpen the \u003cstrong\u003eRemote Pilot\u003c/strong\u003e tab. The Manager finds the bundled \u003ccode\u003eremote-pilot\\\u003c/code\u003e folder (or the folder in\n\u003ccode\u003eREMOTE_PILOT_HOME\u003c/code\u003e), starts its receiver with Remote Pilot's own Python (\u003ccode\u003eremote-pilot\\local\\venv\u003c/code\u003e, made\nby \u003ccode\u003eSetup-Jellymatic.ps1\u003c/code\u003e), and opens the Chromatic page in a window. While a Manager job runs, Remote\nPilot lets go of the USB port, and gets it back afterwards.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-remote-pilot.png\" width=\"400\" alt=\"The Remote Pilot tab before it has found its folder\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-in-your-browser-web-tool\"\u003eIn your browser (web tool)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eDouble-click \u003ccode\u003eremote-pilot\\Start-RemotePilot.cmd\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eOpen \u003ccode\u003ehttp://127.0.0.1:38764/\u003c/code\u003e and choose \u003cstrong\u003eModRetro Chromatic\u003c/strong\u003e in the \u003cstrong\u003eGame preset\u003c/strong\u003e menu.\u003c/li\u003e\n\u003cli\u003ePress \u003cstrong\u003eConnect to device\u003c/strong\u003e. The first time, it lists the console's USB port and offers \u003cstrong\u003eAllow USB on\nCOMx\u003c/strong\u003e; only that click writes Remote Pilot's private settings (\u003ccode\u003eremote-pilot\\local\\\u003c/code\u003e, never in Git).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eTo try it without a console, choose a \u003cstrong\u003eSimulated\u003c/strong\u003e connection in the Chromatic tools panel.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"remote-pilot/docs/images/viewer-chromatic-live.png\" width=\"560\" alt=\"The Remote Pilot viewer showing a simulated Chromatic\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-pairing\"\u003ePairing\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePair over USB\u003c/strong\u003e: both screens show the same 6-digit code; only an \u003cstrong\u003eA\u003c/strong\u003e press on the console approves.\u003c/li\u003e\n\u003cli\u003eOr let Chromatic Manager's Wi-Fi setup provision a pairing key (it writes the console and\n\u003ccode\u003eremote-pilot\\local\\chromatic\\pairing.json\u003c/code\u003e together).\u003c/li\u003e\n\u003cli\u003eWi-Fi control works only on your private network. A Wi-Fi pairing code expires after 10 minutes, works\nonce, and is replaced after 20 wrong tries. Viewers on other PCs of your network can watch, but cannot\nchange the mode, pair, or run Manager actions.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-running-chromatic-manager-from-remote-pilot-optional-off-by-default\"\u003eRunning Chromatic Manager from Remote Pilot (optional, off by default)\u003c/h2\u003e\n\u003cp\u003eRemote Pilot's \u003cstrong\u003eFirmware patching\u003c/strong\u003e panel can start Chromatic Manager jobs, but only after you switch it\non yourself in \u003ccode\u003eremote-pilot\\local\\chromatic\\config.json\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\"managerProject\": \"C:\\\\path\\\\to\\\\Jellymatic\", \"managerRunAllowed\": true,\n \"managerPython\": \"C:\\\\path\\\\to\\\\LocalAppData\\\\Jellymatic\\\\venv\\\\Scripts\\\\python.exe\"}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSet \u003ccode\u003emanagerPython\u003c/code\u003e to the Python that \u003ccode\u003eSetup-Jellymatic.ps1\u003c/code\u003e made (the full path of\n\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\venv\\Scripts\\python.exe\u003c/code\u003e). Every write still asks for your confirmation.\nEasier and recommended: use Chromatic Manager's own window.\u003c/p\u003e\n\u003cp\u003eDetails: \u003ca href=\"remote-pilot/docs/Pairing-with-a-Chromatic.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePairing with a Chromatic\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-for-ai-assistants-command-line\"\u003eFor AI assistants (command line)\u003c/h2\u003e\n\u003cp\u003eStart Remote Pilot and connect first, then (from the \u003ccode\u003eremote-pilot\u003c/code\u003e folder):\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003elocal\\venv\\Scripts\\python.exe -m chromatic.cli status          # what is connected, launcher version\nlocal\\venv\\Scripts\\python.exe -m chromatic.cli press DOWN      # one short press (or a chord: press A B)\nlocal\\venv\\Scripts\\python.exe -m chromatic.cli shot --png      # a screenshot; prints its path\nlocal\\venv\\Scripts\\python.exe -m chromatic.cli tail --lines 20 # newest console log lines\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEvery command talks only to the Remote Pilot on this PC (127.0.0.1). More, with example prompts:\n\u003ca href=\"remote-pilot/docs/Using-with-AI-assistants.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eUsing it with AI assistants\u003c/a\u003e and\n\u003ca href=\"#docs/AI-prompt-examples.md\"\u003eAI prompt examples\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-safety\"\u003eSafety\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePassword fields on the console never show their text while Remote Pilot is connected.\u003c/li\u003e\n\u003cli\u003eRemote Pilot never writes flash, never puts the console into firmware-update mode, and never takes the\nport while Chromatic Manager or ModRetro's updater works.\u003c/li\u003e\n\u003cli\u003eScreenshots can show network names: check before you share them.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-full-documentation\"\u003eFull documentation\u003c/h2\u003e\n\u003cp\u003eThe public repository \u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eRemotePilot\u003c/strong\u003e\u003c/a\u003e has the\nfull wiki (also bundled in \u003ca href=\"remote-pilot/docs/Home.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ccode\u003eremote-pilot/docs/\u003c/code\u003e\u003c/a\u003e): what it does, install,\npairing, the web viewer, AI assistants, security model, troubleshooting and FAQ.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e\u003c/p\u003e"
}
]
},

{
"path":"docs/Recovery.md",
"title":"Recovery",
"html":"\u003ch1 id=\"h-recovery-and-troubleshooting\"\u003eRecovery and troubleshooting\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Recovery\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Recovery.md:how-jellymatic-avoids-breaking-chromatic-os\"\u003eHow Jellymatic avoids breaking Chromatic OS\u003c/a\u003e ·\n\u003ca href=\"#docs/Recovery.md:if-an-install-stops-half-way\"\u003eIf an install stops half-way\u003c/a\u003e · \u003ca href=\"#docs/Recovery.md:what-the-result-means\"\u003eWhat the result means\u003c/a\u003e ·\n\u003ca href=\"#docs/Recovery.md:reinstall-or-repair-the-start-up-menu\"\u003eReinstall the start-up menu\u003c/a\u003e · \u003ca href=\"#docs/Recovery.md:turn-the-menu-off-or-remove-it\"\u003eTurn the menu off or remove it\u003c/a\u003e ·\n\u003ca href=\"#docs/Recovery.md:put-the-previous-fpga-image-back\"\u003ePut the previous FPGA image back\u003c/a\u003e · \u003ca href=\"#docs/Recovery.md:restore-the-original-fpga-image\"\u003eRestore the original FPGA image\u003c/a\u003e ·\n\u003ca href=\"#docs/Recovery.md:official-updates-and-restoring-chromatic-os\"\u003eOfficial updates and restoring Chromatic OS\u003c/a\u003e · \u003ca href=\"#docs/Recovery.md:common-problems\"\u003eCommon problems\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-how-jellymatic-avoids-breaking-chromatic-os\"\u003eHow Jellymatic avoids breaking Chromatic OS\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eThe official firmware stays.\u003c/strong\u003e The start-up menu is added next to it; the official firmware slot,\nyour settings and radio calibration are never written by an install.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGames is always one press away.\u003c/strong\u003e Any restart that is not a power-on goes straight to the official\nfirmware; holding a button while switching on skips the menu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBackups first.\u003c/strong\u003e Nothing is written before a verified full backup of both chips exists (the Manager\ntakes it by itself the first time), saved with a second copy. The second copy is usually on the same disk;\nput it on another disk or a USB stick for real safety (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003eInstall\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eA journal.\u003c/strong\u003e Every step is written to disk before it happens, so an interrupted job is finished or\nundone the next time the Manager runs. Nothing else runs until then.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRead-back checks.\u003c/strong\u003e Every written region is read back from the chip and compared, then the whole flash.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYou approve.\u003c/strong\u003e Every write needs your \u003cstrong\u003eApprove\u003c/strong\u003e in the Manager's window; FPGA updates are first run\nfrom the chip's RAM so you can try a game \u003cstrong\u003eon the console\u003c/strong\u003e before you approve the write.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eA start check.\u003c/strong\u003e After writing, the console is restarted and watched: it must start and keep running.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe chip's own rescue mode.\u003c/strong\u003e The ESP32's download mode is in read-only ROM. No flash content can\nblock it, so the Manager and ModRetro's official updater can always reach the console.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-if-an-install-stops-half-way\"\u003eIf an install stops half-way\u003c/h2\u003e\n\u003cp\u003eUnplugged cable, flat battery, closed window: plug the console back in, switch it \u003cstrong\u003eon\u003c/strong\u003e, open the\nManager. It sees the journal and offers \u003cstrong\u003eFinish job\u003c/strong\u003e (finish or undo, from the journal and the backup).\n\u003cstrong\u003eClose job\u003c/strong\u003e is only for a job the Manager has confirmed is no longer needed. If the console shows nothing\nat all, it still works: the Manager reaches it through the ROM download mode.\u003c/p\u003e\n\u003ch2 id=\"h-what-the-result-means\"\u003eWhat the result means\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eResult\u003c/th\u003e\n\u003cth\u003eMeaning\u003c/th\u003e\n\u003cth\u003eWhat to do\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eDone\u003c/strong\u003e (green)\u003c/td\u003e\n\u003ctd\u003eWritten, read back, console seen starting\u003c/td\u003e\n\u003ctd\u003eNothing\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNothing was changed\u003c/strong\u003e (amber)\u003c/td\u003e\n\u003ctd\u003eRefused before writing (for example a console it does not recognise)\u003c/td\u003e\n\u003ctd\u003eRead the reason; nothing to undo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePut right\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAn interrupted job was finished or undone\u003c/td\u003e\n\u003ctd\u003eNothing\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eStopped: this needs you\u003c/strong\u003e (red)\u003c/td\u003e\n\u003ctd\u003eIt stopped safely and tells you the one thing to do\u003c/td\u003e\n\u003ctd\u003eFollow the words on screen, then Finish job\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e…not seen restarting\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe flash is right, but the console was not seen starting\u003c/td\u003e\n\u003ctd\u003eUnplug, switch off and on, try a game\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-reinstall-or-repair-the-start-up-menu\"\u003eReinstall or repair the start-up menu\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eFix a problem › Repair menu\u003c/strong\u003e writes the start-up menu again (same checks as Install). Use it when the\nmenu is missing, damaged or switched off.\u003c/p\u003e\n\u003ch2 id=\"h-turn-the-menu-off-or-remove-it\"\u003eTurn the menu off or remove it\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eButton\u003c/th\u003e\n\u003cth\u003eWhat it does\u003c/th\u003e\n\u003cth\u003eYour Wi-Fi/Jellyfin set-up\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSwitch menu off\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eErases only the menu program (power-safe); the console boots straight to the official firmware\u003c/td\u003e\n\u003ctd\u003eKept, for when you Install again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eRemove menu\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003ePuts the official boot program and partition table back and erases the menu area\u003c/td\u003e\n\u003ctd\u003eErased; the console's Jellyfin sign-in is signed out on the server\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eRestore original\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eRewrites the ESP32 from your newest verified backup of the official firmware (settings kept). The first of those backups is your original, taken only from the official firmware as it comes\u003c/td\u003e\n\u003ctd\u003eErased; sign-in signed out\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eAfter \u003cstrong\u003eRemove menu\u003c/strong\u003e or \u003cstrong\u003eRestore original\u003c/strong\u003e the console is exactly the official layout. Install brings\nthe menu back at any time.\u003c/p\u003e\n\u003ch2 id=\"h-put-the-previous-fpga-image-back\"\u003ePut the previous FPGA image back\u003c/h2\u003e\n\u003cp\u003eAfter \u003cstrong\u003eUpdate the Pocket link\u003c/strong\u003e, \u003cstrong\u003ePut the previous image back\u003c/strong\u003e (one Approve) writes the sound image\n18.40 again, read back byte for byte.\u003c/p\u003e\n\u003ch2 id=\"h-restore-the-original-fpga-image\"\u003eRestore the original FPGA image\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eFix a problem › Restore FPGA\u003c/strong\u003e writes your \u003cstrong\u003eown\u003c/strong\u003e original FPGA image from your full backup, reads all\n4 MiB back and compares them, then restarts the chip. Nothing from anyone else's console is ever used.\nThat original is taken once, by the first full backup, and only from ModRetro's own console chip image\n(never from Jellymatic's sound or Pocket link image); it is never replaced afterwards.\u003c/p\u003e\n\u003cp\u003eIf the Manager says your full backup \u003cstrong\u003ecould not be checked in both copies\u003c/strong\u003e, connect the disk or USB stick\nthat holds the second copy and try again. It never takes a new original over an existing one. If the\nfirst backup is refused because the console is \u003cstrong\u003enot on the official firmware as it comes\u003c/strong\u003e, put the\nofficial firmware back with ModRetro's updater (below), then press \u003cstrong\u003eBack up\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-official-updates-and-restoring-chromatic-os\"\u003eOfficial updates and restoring Chromatic OS\u003c/h2\u003e\n\u003cp\u003eUse \u003cstrong\u003eModRetro's official update tool\u003c/strong\u003e, downloaded from ModRetro (modretro.com). Jellymatic never ships\nit. The Manager guides you (Home › More › \u003cstrong\u003eOfficial update\u003c/strong\u003e, or text menu choice 6):\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eThe Manager switches the start-up menu off (power-safe).\u003c/li\u003e\n\u003cli\u003eYou run ModRetro's updater: \u003cstrong\u003efirmware update only\u003c/strong\u003e, not Cart Clinic. Keep the console plugged in and\non. When it reports success, close it and press \u003cstrong\u003eDone\u003c/strong\u003e in the Manager.\u003c/li\u003e\n\u003cli\u003eThe Manager checks what changed (the updater does not check its own ESP32 write), backs up the new\nfirmware, and switches the start-up menu back on (\u003cstrong\u003eInstall\u003c/strong\u003e).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eGood to know:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe official updater writes the FPGA first, then the whole ESP32 through the ROM download mode, so\n\u003cstrong\u003eit always works\u003c/strong\u003e, whatever Jellymatic left on the console. That is your last-resort restore of\nChromatic OS: run it, and the console is fully official again.\u003c/li\u003e\n\u003cli\u003eIt \u003cstrong\u003eerases your console settings\u003c/strong\u003e (brightness, palette and so on); that is the official updater's\nbehaviour, not Jellymatic's.\u003c/li\u003e\n\u003cli\u003eIt also replaces the FPGA image with the official one, so Jellyfin sound and the Pocket link are gone\nuntil you install them again. The start-up menu stays on the flash, switched off, until \u003cstrong\u003eInstall\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eIf the updater fails: unplug USB, switch the console off and on, run it again. It needs the internet and\nmay install the Gowin USB driver on Windows.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTo reinstall Jellymatic on top afterwards: open the Manager, press \u003cstrong\u003eInstall\u003c/strong\u003e, then (optional) \u003cstrong\u003eSet up\nJellyfin sound\u003c/strong\u003e and \u003cstrong\u003eUpdate the Pocket link\u003c/strong\u003e again.\u003c/p\u003e\n\u003ch2 id=\"h-common-problems\"\u003eCommon problems\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProblem\u003c/th\u003e\n\u003cth\u003eTry\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eManager says \"plug in\"\u003c/td\u003e\n\u003ctd\u003eUse a data cable, switch the console \u003cstrong\u003eon\u003c/strong\u003e, close other tools that use the port (ModRetro's updater, a serial monitor)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Not the console the backups came from\"\u003c/td\u003e\n\u003ctd\u003eConnect your own console, the one the backups were made from\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Not a layout or firmware this tool knows\"\u003c/td\u003e\n\u003ctd\u003eYour console has firmware Jellymatic was not tested with. Nothing was written. Use the official updater first, or wait for a newer Jellymatic\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMenu does not appear\u003c/td\u003e\n\u003ctd\u003eIs a cartridge in? Are you holding a button at power-on?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGames will not start from the menu\u003c/td\u003e\n\u003ctd\u003eLet go of all buttons; insert a cartridge\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eSee also the \u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e.\u003c/p\u003e"
},

"path":"docs/FAQ.md",
"title":"FAQ",
"html":"\u003ch1 id=\"h-faq\"\u003eFAQ\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › FAQ\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/FAQ.md:general\"\u003eGeneral\u003c/a\u003e · \u003ca href=\"#docs/FAQ.md:safety\"\u003eSafety\u003c/a\u003e · \u003ca href=\"#docs/FAQ.md:jellyfin\"\u003eJellyfin\u003c/a\u003e · \u003ca href=\"#docs/FAQ.md:pocket-link\"\u003ePocket link\u003c/a\u003e · \u003ca href=\"#docs/FAQ.md:help\"\u003eHelp\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-general\"\u003eGeneral\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eIs this made by ModRetro or Jellyfin?\u003c/strong\u003e No. Jellymatic is an independent project, not affiliated with\nModRetro or the Jellyfin project.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it cost anything?\u003c/strong\u003e No. It is free software (GPL-3.0-or-later). Building the FPGA images needs\nGowin's FPGA tools, which need a (free) licence from Gowin.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhich consoles?\u003c/strong\u003e The ModRetro Chromatic. Tested with official firmware MCU v4.6 and FPGA v18.14 on one\nconsole. The Manager refuses firmware or layouts it does not recognise.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDo I need the PC after set-up?\u003c/strong\u003e No. Wi-Fi and Jellyfin are set up on the console and it talks to your\nserver directly. The PC is for installing, updating and recovery.\u003c/p\u003e\n\u003ch2 id=\"h-safety\"\u003eSafety\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eCan it break my console?\u003c/strong\u003e Every write is backed up, journalled, read back and approved by you, and the\nofficial firmware stays on the console. The ESP32's ROM rescue mode cannot be blocked by anything in\nflash, so the Manager and ModRetro's updater can always reach it. Still: \u003cstrong\u003euse it at your own risk\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAre my games and saves safe?\u003c/strong\u003e Jellymatic never reads or writes cartridges, flash carts, their SD cards or\nsaves. \u003cstrong\u003eGames\u003c/strong\u003e starts the untouched official firmware.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I go back to completely official?\u003c/strong\u003e Yes: \u003cstrong\u003eRemove menu\u003c/strong\u003e or \u003cstrong\u003eRestore original\u003c/strong\u003e in the Manager, or\nModRetro's official update tool (\u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it send anything anywhere?\u003c/strong\u003e No. Nothing is uploaded. The console talks only to your Jellyfin\nserver (and, if you use it, Remote Pilot on your own PC).\u003c/p\u003e\n\u003ch2 id=\"h-jellyfin\"\u003eJellyfin\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eWhere is my Jellyfin password?\u003c/strong\u003e Only where you put it. The console gets its own sign-in with Quick\nConnect; the Manager can do the same if you give it this PC's Jellyfin settings\n(kept in \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy is there no sound?\u003c/strong\u003e Sound needs the FPGA sound image 18.40 or 18.41\n(\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eInstall\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy is the picture small?\u003c/strong\u003e The console's screen is 160 × 144; video is up to 160 × 120.\u003c/p\u003e\n\u003ch2 id=\"h-pocket-link\"\u003ePocket link\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eWhat do I need?\u003c/strong\u003e An Analogue Pocket with \u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e, a\nlink cable, and the 18.41 FPGA image on the Chromatic (\u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes the Pocket need Wi-Fi?\u003c/strong\u003e No. The Chromatic does the network part.\u003c/p\u003e\n\u003ch2 id=\"h-help\"\u003eHelp\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eWhere do I report a bug?\u003c/strong\u003e In the repository's issues (\u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING\u003c/a\u003e). Security\nproblems privately (\u003ca href=\"#SECURITY.md\"\u003eSECURITY\u003c/a\u003e). Support is not guaranteed.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I use an AI assistant?\u003c/strong\u003e Yes, with care: \u003ca href=\"#docs/AI-prompt-examples.md\"\u003eAI prompt examples\u003c/a\u003e.\u003c/p\u003e"
}
]

"html":"\u003ch1 id=\"h-building-from-source\"\u003eBuilding from source\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Building from source\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Building-from-source.md:start-up-menu\"\u003eStart-up menu\u003c/a\u003e · \u003ca href=\"#docs/Building-from-source.md:console-chip-fpga-images\"\u003eConsole chip (FPGA) images\u003c/a\u003e ·\n\u003ca href=\"#docs/Building-from-source.md:chromatic-manager\"\u003eChromatic Manager\u003c/a\u003e · \u003ca href=\"#docs/Building-from-source.md:tests\"\u003eTests\u003c/a\u003e · \u003ca href=\"#docs/Building-from-source.md:previews-and-pictures\"\u003ePreviews and pictures\u003c/a\u003e ·\n\u003ca href=\"#docs/Building-from-source.md:offline-documentation-page\"\u003eOffline documentation page\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eEverything builds on Windows. Nothing in this page touches a console.\u003c/p\u003e\n\u003ch2 id=\"h-start-up-menu\"\u003eStart-up menu\u003c/h2\u003e\n\u003cp\u003eNeeds: Git, Python 3.12, about 3 GB of disk.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epowershell -ExecutionPolicy Bypass -File scripts\\Get-Upstreams.ps1 -EspIdf   # ESP-IDF v5.3 at the pinned commit\n$env:IDF_TOOLS_PATH = \"$env:LOCALAPPDATA\\Jellymatic\\tools\\esp32-tools\"\nupstream\\esp-idf\\install.ps1 esp32                                            # Espressif's own tool installer\npowershell -ExecutionPolicy Bypass -File scripts\\Build-ChromaticLauncher.ps1\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe result goes to \u003ccode\u003erelease\\launcher\\\u003c/code\u003e (ignored by Git), where Chromatic Manager installs it from.\n\u003ccode\u003eidf.py flash\u003c/code\u003e is made to fail on purpose: it would overwrite the console's official firmware. Install\nonly with Chromatic Manager.\u003c/p\u003e\n\u003cp\u003eSettings: \u003ccode\u003echromatic\\launcher\\CMakeLists.txt\u003c/code\u003e (\u003ccode\u003ePROJECT_VER\u003c/code\u003e, \u003ccode\u003ePJ_ENABLE_SETUP\u003c/code\u003e),\n\u003ccode\u003echromatic\\launcher\\sdkconfig.defaults\u003c/code\u003e, \u003ccode\u003echromatic\\launcher\\partitions.csv\u003c/code\u003e (the three official rows\nfirst, unchanged).\u003c/p\u003e\n\u003ch2 id=\"h-console-chip-fpga-images\"\u003eConsole chip (FPGA) images\u003c/h2\u003e\n\u003cp\u003eNeeds: Gowin EDA \u003cstrong\u003eV1.9.12.04\u003c/strong\u003e with \u003cstrong\u003eyour own\u003c/strong\u003e Gowin licence (from gowinsemi.com; never commit it),\nand ModRetro's FPGA source:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epowershell -ExecutionPolicy Bypass -File scripts\\Get-Upstreams.ps1 -ChromaticFpga\n$env:GOWIN_SH = \"C:\\Gowin\\Gowin_V1.9.12.04_x64\\IDE\\bin\\gw_sh.exe\"              # where your Gowin is\npy -3 scripts\\stage_chromatic_fpga_link.py --build                           # 18.41: stage + Gowin build\npy -3 scripts\\stage_chromatic_fpga_link.py --export my-18.41                 # copy image, receipts, sources\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe staging scripts copy ModRetro's tree (never edited) to \u003ccode\u003estaging\\\u003c/code\u003e and apply exact text patches; every\nanchor must match or they stop. \u003ccode\u003escripts\\stage_chromatic_fpga_media.py\u003c/code\u003e does the same for the sound image\n18.40 (build it with \u003ccode\u003egw_sh build.tcl\u003c/code\u003e in \u003ccode\u003estaging\\chromatic-fpga-media\\esp32t\u003c/code\u003e, then\n\u003ccode\u003epy -3 scripts\\record_chromatic_fpga_build.py staging\\chromatic-fpga-media\\esp32t\u003c/code\u003e).\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003efpga\\images\\link-18.41\\\u003c/code\u003e and \u003ccode\u003efpga\\images\\sound-18.40\\\u003c/code\u003e hold the \u003cstrong\u003eexact sources and receipts\u003c/strong\u003e of the\nreviewed images, but not the images themselves. To use an image, put the \u003cstrong\u003eofficial release files\u003c/strong\u003e\n\u003ccode\u003eevt1_x2.fs\u003c/code\u003e and \u003ccode\u003eevt1_x2.bin\u003c/code\u003e (published separately as release assets) in that folder's \u003ccode\u003ebuild\\\u003c/code\u003e. The\nManager refuses any image whose bytes differ from its receipt (and, for 18.41, from the SHA-256 pins in\n\u003ccode\u003escripts\\chromatic_fpga.py\u003c/code\u003e). A build of your own is almost never byte-identical (any other Gowin version,\nsetting or IP changes the bytes), so it will not match the pins and is refused; that is on purpose, because only the reviewed image\nwas tried on a console. Building is still useful to check the sources and the timing reports.\u003c/p\u003e\n\u003cp\u003eThe RTL added by Jellymatic is in \u003ccode\u003ertl\\\u003c/code\u003e (Pocket link bridge, link-port byte/stream, FIFOs) and\n\u003ccode\u003echromatic\\fpga-media\\\u003c/code\u003e (sound hooks), each with Icarus Verilog test benches.\u003c/p\u003e\n\u003ch2 id=\"h-chromatic-manager\"\u003eChromatic Manager\u003c/h2\u003e\n\u003cp\u003eRuns from source (\u003ccode\u003eSetup-Jellymatic.ps1\u003c/code\u003e, then \u003ccode\u003eChromatic-Manager-Window.cmd\u003c/code\u003e). To make a portable\nWindows program for yourself: \u003ccode\u003escripts\\Build-ChromaticManagerApp.ps1\u003c/code\u003e (PyInstaller; output in \u003ccode\u003edist\\\u003c/code\u003e).\nIf you \u003cstrong\u003eshare\u003c/strong\u003e such a build, you take on the obligations of the bundled libraries: Qt/PySide6 is\nLGPL-3.0 (keep the Qt libraries replaceable, ship their licence and point to their source), esptool is\nGPL-2.0-or-later, Python and the other packages have their own licences. That is why this repository\nships source, not a built program.\u003c/p\u003e\n\u003ch2 id=\"h-tests\"\u003eTests\u003c/h2\u003e\n\u003cp\u003eNeeds MSYS2 UCRT64 gcc (\u003ccode\u003eC:\\msys64\\ucrt64\\bin\\gcc.exe\u003c/code\u003e) for the C host checks, and for the RTL benches\nIcarus Verilog in \u003ccode\u003e\u0026lt;tools\u0026gt;\\fpga-tools\\native\\ucrt64\u003c/code\u003e (\u003ccode\u003ebin\\iverilog.exe\u003c/code\u003e, \u003ccode\u003ebin\\vvp.exe\u003c/code\u003e; \u003ccode\u003e\u0026lt;tools\u0026gt;\u003c/code\u003e is\n\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\tools\u003c/code\u003e or \u003ccode\u003eJELLYMATIC_TOOLS\u003c/code\u003e).\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003e$py = \"$env:LOCALAPPDATA\\Jellymatic\\venv\\Scripts\\python.exe\"\n\u0026amp; $py -B scripts\\test_chromatic_manager.py        # Manager logic against a simulated console\n\u0026amp; $py -B scripts\\test_chromatic_manager_gui.py    # the window, offscreen\n\u0026amp; $py -B scripts\\test_chromatic_launcher.py       # launcher host checks (+ ELF checks when built)\n\u0026amp; $py -B scripts\\test_chromatic_setup.py          # on-console Wi-Fi/Jellyfin set-up, power-cut model\n\u0026amp; $py -B scripts\\test_chromatic_fpga.py           # FPGA jobs against a simulated chip\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBuild the start-up menu first (\u003ca href=\"#docs/Building-from-source.md:start-up-menu\"\u003eabove\u003c/a\u003e): the Manager tests install that build on a\nsimulated console, and the launcher test checks the linked program; without it they stop with \"No launcher\nrelease found\" (the launcher test skips its build checks). The FPGA staging tests need ModRetro's source\n(\u003ccode\u003eGet-Upstreams.ps1 -ChromaticFpga\u003c/code\u003e) and staged trees: run \u003ccode\u003epy -3 scripts\\stage_chromatic_fpga_media.py\u003c/code\u003e,\n\u003ccode\u003epy -3 scripts\\check_pocket_link_patch.py\u003c/code\u003e and \u003ccode\u003epy -3 scripts\\stage_chromatic_fpga_link.py\u003c/code\u003e first (nothing\nis built by these; they only copy and patch).\u003c/p\u003e\n\u003cp\u003eThe tests never open a device. Where they need a stock firmware image they use a \u003cstrong\u003emade-up\u003c/strong\u003e one\n(\u003ccode\u003ecompose_chromatic_image.synthetic_stock\u003c/code\u003e, no ModRetro code in it), unless you point\n\u003ccode\u003eJELLYMATIC_STOCK_DUMP\u003c/code\u003e at a full read of your own console. Remote Pilot's tests are in \u003ccode\u003eremote-pilot\\\u003c/code\u003e\n(\u003ccode\u003epython -m unittest test_chromatic\u003c/code\u003e, \u003ccode\u003enode test_chromatic_panel.js\u003c/code\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-previews-and-pictures\"\u003ePreviews and pictures\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003escripts\\render_chromatic_manager_previews.py --out \u0026lt;folder\u0026gt;\u003c/code\u003e: the Manager window in each state, with\nmade-up data.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003escripts\\test_chromatic_launcher.py\u003c/code\u003e and \u003ccode\u003etest_chromatic_setup.py\u003c/code\u003e write the console's screens as\n\u003ccode\u003e.ppm\u003c/code\u003e/\u003ccode\u003e.png\u003c/code\u003e previews under \u003ccode\u003estaging\\\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003escripts\\test_chromatic_player.py\u003c/code\u003e writes the Jellyfin app's screens (synthetic test pattern video).\u003c/li\u003e\n\u003cli\u003eThe console's text font, \u003ccode\u003epocket\\ui_font.h\u003c/code\u003e, is made from Google's Roboto Medium (Apache-2.0) by\n\u003ccode\u003epy -3 scripts\\build_ui_font.py --fetch\u003c/code\u003e (needs \u003ccode\u003efonttools\u003c/code\u003e; the font is pinned by SHA-256 in\n\u003ccode\u003eupstream.lock.json\u003c/code\u003e). \u003ccode\u003e--check\u003c/code\u003e only compares the result with the file in the repository.\u003c/li\u003e\n\u003cli\u003eThe README's banner, section headers and dividers are pictures in \u003ccode\u003edocs/images/readme/\u003c/code\u003e (GitHub does not\nshow page styles, so the pixel look travels as images); keep a normal \u003ccode\u003e##\u003c/code\u003e heading under each header\npicture for screen readers and links.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-offline-documentation-page\"\u003eOffline documentation page\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eOpen-Documentation.html\u003c/code\u003e in the main folder is every documentation page in one file that opens by\ndouble-click, offline. \u003cstrong\u003eAfter editing any \u003ccode\u003e.md\u003c/code\u003e page, rebuild it:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 scripts\\build_docs_html.py           # rewrites Open-Documentation.html\npy -3 scripts\\test_docs_html.py            # fails if it is out of date or would load anything from the internet\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt needs only Python (no packages). It converts README, \u003ccode\u003edocs\\*.md\u003c/code\u003e, CONTRIBUTING, SECURITY,\nTHIRD-PARTY-NOTICES and ADDITIONAL-TERMS (only files tracked by Git) and puts them inside the page; the\npictures and the pixel fonts (\u003ccode\u003edocs\\fonts\\\u003c/code\u003e, SIL OFL 1.1) load from the repository folder. A new page in\n\u003ccode\u003edocs\\\u003c/code\u003e appears under \u003cstrong\u003eMore\u003c/strong\u003e until you add it to a tab in \u003ccode\u003eGROUPS\u003c/code\u003e at the top of the script.\nThe same run writes \u003ccode\u003edocs\\index.html\u003c/code\u003e, a copy for GitHub Pages (see below).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe PDF guide\u003c/strong\u003e (\u003ccode\u003edocs\\Jellymatic-Guide.pdf\u003c/code\u003e, shown by GitHub in the browser) is printed from the same\npages by Chrome or Edge, offline:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 scripts\\build_docs_pdf.py            # rewrites docs\\Jellymatic-Guide.pdf and docs\\.guide-source.sha256\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe test above says when the PDF is out of date (it compares \u003ccode\u003edocs\\.guide-source.sha256\u003c/code\u003e with the pages\nand build scripts; it does not print again). Set \u003ccode\u003eDOCS_BROWSER\u003c/code\u003e if Chrome or Edge is not found.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFor maintainers, when the repository is public:\u003c/strong\u003e GitHub can host the documentation for free. In the\nrepository's Settings \u0026gt; Pages, choose Deploy from a branch, branch \u003ccode\u003emain\u003c/code\u003e, folder \u003ccode\u003e/docs\u003c/code\u003e. The site is then\n\u003ccode\u003ehttps://chaoticspartan1.github.io/Jellymatic/\u003c/code\u003e (it serves \u003ccode\u003edocs\\index.html\u003c/code\u003e; \u003ccode\u003edocs\\.nojekyll\u003c/code\u003e makes GitHub\nserve the files as they are). Add a link to it in the README only once it works.\u003c/p\u003e"
},

"path":"docs/AI-prompt-examples.md",
"title":"AI prompt examples",
"html":"\u003ch1 id=\"h-ai-prompt-examples-claude-codex-and-other-assistants\"\u003eAI prompt examples (Claude, Codex and other assistants)\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › AI prompt examples\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/AI-prompt-examples.md:safety-rules-read-first\"\u003eSafety rules\u003c/a\u003e · \u003ca href=\"#docs/AI-prompt-examples.md:connect-an-assistant-mcp\"\u003eConnect an assistant\u003c/a\u003e ·\n\u003ca href=\"#docs/AI-prompt-examples.md:prompts-that-only-read\"\u003ePrompts that only read\u003c/a\u003e · \u003ca href=\"#docs/AI-prompt-examples.md:prompts-that-may-change-the-console\"\u003ePrompts that may change the console\u003c/a\u003e ·\n\u003ca href=\"#docs/AI-prompt-examples.md:prompts-for-developers\"\u003ePrompts for developers\u003c/a\u003e · \u003ca href=\"#docs/AI-prompt-examples.md:prompts-for-bug-reports\"\u003eBug reports\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-safety-rules-read-first\"\u003eSafety rules (read first)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eYou approve every change.\u003c/strong\u003e The Manager's API lets an assistant \u003cem\u003eread\u003c/em\u003e freely and \u003cem\u003eask\u003c/em\u003e for a job;\nevery write waits for \u003cstrong\u003eyour Approve\u003c/strong\u003e in the Manager's window. AI control is \u003cstrong\u003eoff\u003c/strong\u003e unless you turn it\non (Settings › AI control), and \u003cstrong\u003eStop AI now\u003c/strong\u003e ends it at once.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNever give an assistant your secrets.\u003c/strong\u003e Do not paste Wi-Fi passwords, Jellyfin passwords, tokens,\nserver addresses or backups into a chat. The Manager never returns them through its API.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBe present.\u003c/strong\u003e Only let an assistant start a console job when you are at the console, it is plugged in\nand on, and you can switch it off and on if asked.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNo flashing by hand.\u003c/strong\u003e Ask assistants to use Chromatic Manager only, never \u003ccode\u003eesptool write_flash\u003c/code\u003e,\n\u003ccode\u003eidf.py flash\u003c/code\u003e or \u003ccode\u003eopenFPGALoader --write-flash\u003c/code\u003e directly. (The project makes \u003ccode\u003eidf.py flash\u003c/code\u003e fail on purpose.)\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEnough budget left.\u003c/strong\u003e AI-started writes stay \u003cstrong\u003erefused\u003c/strong\u003e unless you turn AI control on (rule 1), and even\nthen each one also needs the \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003efull backup\u003c/a\u003e\nand a fresh \u003cem\u003eusage reading\u003c/em\u003e, so an assistant that is about to run out of its limits does not start a\nfirmware change it cannot finish. The assistant (or you) writes the reading to\n\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\chromatic-tools\\usage-snapshot.json\u003c/code\u003e just before it asks:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\"observed_at\": \"2026-11-10T14:02:00+00:00\", \"used_percent_by_window\": [41, 12],\n \"reporter\": \"claude\", \"ordinary_usage_allowed\": true}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eobserved_at\u003c/code\u003e: when the usage was read, with its time zone; older than \u003cstrong\u003e5 minutes\u003c/strong\u003e is refused.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eused_percent_by_window\u003c/code\u003e: percent \u003cstrong\u003eused\u003c/strong\u003e (0 to 100) of each usage limit the assistant has (for example\nits session and weekly limits). If any is at the reserve, the write is refused: \u003cstrong\u003e75%\u003c/strong\u003e used, or \u003cstrong\u003e90%\u003c/strong\u003e\nfor \u003ccode\u003e\"reporter\": \"claude\"\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ereporter\u003c/code\u003e: a short name of the assistant; \u003ccode\u003eordinary_usage_allowed\u003c/code\u003e: must be \u003ccode\u003etrue\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWrites you start yourself in the window never need this file.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCheck what it says.\u003c/strong\u003e An assistant can be wrong. Read the Approve window yourself: it names the\nexact image that will be written.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-connect-an-assistant-mcp\"\u003eConnect an assistant (MCP)\u003c/h2\u003e\n\u003cp\u003eChromatic Manager has an MCP server (\u003ccode\u003escripts/chromatic_manager_mcp.py\u003c/code\u003e). It attaches to the open window\nthrough a local, token-protected API on \u003ccode\u003e127.0.0.1\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eClaude Code:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003eclaude mcp add chromatic-manager -- \"$env:LOCALAPPDATA\\Jellymatic\\venv\\Scripts\\python.exe\" -B \"C:\\path\\to\\Jellymatic\\scripts\\chromatic_manager_mcp.py\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eCodex\u003c/strong\u003e (\u003ccode\u003e~/.codex/config.toml\u003c/code\u003e):\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e[mcp_servers.chromatic-manager]\n# the full path of %LOCALAPPDATA%\\Jellymatic\\venv\\Scripts\\python.exe on your PC\ncommand = 'C:\\path\\to\\LocalAppData\\Jellymatic\\venv\\Scripts\\python.exe'\nargs = ['-B', 'C:\\path\\to\\Jellymatic\\scripts\\chromatic_manager_mcp.py']\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eOther MCP clients:\u003c/strong\u003e the same command and arguments, as a stdio server.\u003c/p\u003e\n\u003ch2 id=\"h-prompts-that-only-read\"\u003ePrompts that only read\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eUse the chromatic-manager tools to check my Chromatic and tell me, in plain words, what is installed and\nwhether anything needs doing. Do not start any job.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eList my Chromatic backups (paths only) and tell me whether both copies exist.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRead the last Chromatic Manager job's log and explain what happened. Do not change anything.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-prompts-that-may-change-the-console\"\u003ePrompts that may change the console\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eMy Chromatic is plugged in, on, and I am here. Ask Chromatic Manager to install the start-up menu. I will\napprove it in the window. Stop and tell me if it asks for anything else.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAsk Chromatic Manager to run \"Update the Pocket link\". I will check a game on the console while the new\nimage runs from RAM and approve it myself. If any automatic check fails, stop and explain.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eSomething went wrong during an install. Ask Chromatic Manager to finish the interrupted job, and tell\nme what it says. Do not start anything else.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-prompts-for-developers\"\u003ePrompts for developers\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eIn this repository, run the host tests (scripts/test_chromatic_launcher.py, test_chromatic_setup.py,\ntest_chromatic_manager.py) and summarise failures. Do not open any device or serial port.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eExplain how the start-up menu decides between the menu and the official firmware\n(chromatic/launcher/bootloader_components, shared/boot_decision.h). Do not change code.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAdd a test to scripts/test_chromatic_setup.py for \u0026lt;behaviour\u0026gt;. Keep the power-cut model passing.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-prompts-for-bug-reports\"\u003ePrompts for bug reports\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eHelp me write a bug report for Jellymatic from this Chromatic Manager log. Remove every address, network\nname, user name, token and device ID before showing it to me.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eNever paste logs that show addresses or names into a public issue. See \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e.\u003c/p\u003e"
},

"html":"\u003ch1 id=\"h-credits--licences\"\u003eCredits \u0026amp; licences\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Credits \u0026amp; licences\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Credits-and-licences.md:author\"\u003eAuthor\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:this-projects-licence\"\u003eThis project's licence\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:parts-made-by-others\"\u003eParts made by others\u003c/a\u003e ·\n\u003ca href=\"#docs/Credits-and-licences.md:used-not-included\"\u003eUsed, not included\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:read-as-references\"\u003eRead as references\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:trademarks\"\u003eTrademarks\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-author\"\u003eAuthor\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. Under GPLv3 section 7(b), redistributions and modified versions must keep\nthis attribution in the README credits and in any About/credits screen (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e).\nThe start-up menu's credits screen and Chromatic Manager's About tab show it.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/credits-screen.png\" width=\"320\" alt=\"The start-up menu\u0026#x27;s credits screen\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-this-projects-licence\"\u003eThis project's licence\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), for everything written for Jellymatic: the start-up menu, the\nJellyfin app, the RTL in \u003ccode\u003ertl/\u003c/code\u003e and \u003ccode\u003echromatic/fpga-media/\u003c/code\u003e, Chromatic Manager, the scripts, Remote Pilot\nand the documentation. \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e adds the attribution term (7(b)), the\nmarking of modified versions (7(c)), and two additional permissions: for FPGA bitstreams that combine\nJellymatic's RTL with ModRetro's design and Gowin IP, and for linking the console firmware with\nEspressif's binary-only Wi-Fi/PHY libraries and the ESP32 ROM.\u003c/p\u003e\n\u003ch2 id=\"h-parts-made-by-others\"\u003eParts made by others\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro Chromatic FPGA design v18.14, files modified by ChaoticSPARTAN1 for Jellymatic, 2026-11\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/*/src/\u003c/code\u003e (the list is in \u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e© ModRetro and contributors; the game core files (\u003ccode\u003egb.v\u003c/code\u003e and others) come from the MiSTer handheld core \"Gameboy_MiSTer\" (GPL-3.0-or-later, Till Harbaum and the MiSTer developers). \u003ccode\u003euart.v\u003c/code\u003e names Gowin (GaoYun Semi) as its creator; ModRetro publishes it under its repository's GPL. Only the changed files are here; the rest is ModRetro's public repository at the commit in \u003ccode\u003eupstream.lock.json\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShiny Relay 1.1.5 parts\u003c/td\u003e\n\u003ctd\u003ethe \u003ccode\u003euart_tx_busy\u003c/code\u003e fix in the 18.41 \u003ccode\u003esystem_monitor.sv\u003c/code\u003e; the request-once status channel pattern in \u003ccode\u003ertl/chromatic_pocket_link.v\u003c/code\u003e; the Wi-Fi join wording in \u003ccode\u003echromatic/launcher/shared/wifi_scan.h\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e© Shiny Gen. Marked in each file.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003espeedcontrol.vhd\u003c/code\u003e, Verilog translation for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/fpga-media/sim/speedcontrol_model.v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0 (as the original; not under ADDITIONAL-TERMS.md)\u003c/td\u003e\n\u003ctd\u003eFrom ModRetro's design, which has it from the MiSTer core \"Gameboy_MiSTer\"; translated by ChaoticSPARTAN1.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Simple UART for FPGA\", Verilog port for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ertl/uart2_vhdl_port.v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMIT (the port: GPL-3.0-or-later)\u003c/td\u003e\n\u003ctd\u003e© Jakub Cabal; the VHDL original is part of ModRetro's design. \u003ca href=\"LICENSES/MIT-uart_for_fpga.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/MIT-uart_for_fpga.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eESP-IDF bootloader start file\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/bootloader_components/main/bootloader_start.c\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003e© Espressif Systems; modified (the start decision). \u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin logo, scaled\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/launcher_art.h\u003c/code\u003e, \u003ccode\u003escripts/chromatic_theme.py\u003c/code\u003e (JELLYFIN_MARK), pictures in \u003ccode\u003edocs/images/\u003c/code\u003e showing it\u003c/td\u003e\n\u003ctd\u003eCC BY-SA 4.0\u003c/td\u003e\n\u003ctd\u003e© the Jellyfin contributors, from jellyfin/jellyfin-ux. The scaled versions are shared under the same licence. \u003ca href=\"LICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRoboto Medium, rasterized\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epocket/ui_font.h\u003c/code\u003e (made by \u003ccode\u003escripts/build_ui_font.py\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003eRoboto 2.138 by Christian Robertson, Copyright 2011 Google Inc. \u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eT80 CPU core, SameBoy-derived boot ROM\u003c/td\u003e\n\u003ctd\u003enot here: in ModRetro's source, built into the FPGA images 18.40 and 18.41\u003c/td\u003e\n\u003ctd\u003eBSD-style; MIT\u003c/td\u003e\n\u003ctd\u003e© Daniel Wallner; © Lior Halphon. Their notices go with the images: \u003ca href=\"LICENSES/BSD-style-T80.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/BSD-style-T80.txt\u003c/a\u003e, \u003ca href=\"LICENSES/MIT-SameBoy-boot-ROM.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/MIT-SameBoy-boot-ROM.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePress Start 2P font\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003eCodeMan38. \u003ca href=\"LICENSES/OFL-1.1-PressStart2P.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-PressStart2P.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSilkscreen font\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003eThe Silkscreen Project Authors. \u003ca href=\"LICENSES/OFL-1.1-Silkscreen.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-Silkscreen.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-used-not-included\"\u003eUsed, not included\u003c/h2\u003e\n\u003cp\u003eInstalled by you, under their own licences:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTool\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eESP-IDF v5.3 (Espressif) and its components (FreeRTOS, lwIP, Mbed TLS, newlib, Wi-Fi libraries)\u003c/td\u003e\n\u003ctd\u003eApache-2.0 and others; see ESP-IDF's \u003ccode\u003eCOPYRIGHT.rst\u003c/code\u003e. A \u003cstrong\u003ebuilt\u003c/strong\u003e start-up menu contains these and must ship their notices.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro's FPGA source (with the MiSTer core (\"Gameboy_MiSTer\"), T80 CPU, SameBoy-derived boot ROM, Gowin IP)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0 / GPL-3.0-or-later / BSD-style / MIT / Gowin's terms. A \u003cstrong\u003ebuilt\u003c/strong\u003e FPGA image contains these and must ship their notices and source.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGowin EDA\u003c/td\u003e\n\u003ctd\u003eGowin's licence (proprietary). Never included.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eopenFPGALoader\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePython, PySide6 / Qt\u003c/td\u003e\n\u003ctd\u003ePSF licence; LGPL-3.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eesptool, pyserial\u003c/td\u003e\n\u003ctd\u003eGPL-2.0-or-later; BSD-3-Clause\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro's official update tool\u003c/td\u003e\n\u003ctd\u003eModRetro's terms. Never included; download it from ModRetro.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-read-as-references\"\u003eRead as references\u003c/h2\u003e\n\u003cp\u003eThese were read to understand the console; no code was copied from them except the parts listed above:\nModRetro's Chromatic MCU source (GPL-3.0), \u003cstrong\u003eChromatiX\u003c/strong\u003e by Enjoy-Digital and contributors (GPL-3.0 /\nBSD-2-Clause), and \u003cstrong\u003eShiny Relay\u003c/strong\u003e by Shiny Gen (GPL-3.0; besides the parts listed above, the \"debug bit\"\nversion scheme follows its approach). Thank you to all of them.\u003c/p\u003e\n\u003ch2 id=\"h-trademarks\"\u003eTrademarks\u003c/h2\u003e\n\u003cp\u003eModRetro and Chromatic are trademarks of ModRetro, Inc. Jellyfin is a trademark of its owners. Analogue and\nPocket are trademarks of Analogue. They are used only to say what\nJellymatic works with. Jellymatic is an independent project, not affiliated with, endorsed or supported by\nany of them.\u003c/p\u003e"
},

"path":"docs/Design-notes.md",
"title":"Design notes",
"html":"\u003ch1 id=\"h-design-notes-for-developers\"\u003eDesign notes (for developers)\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Design notes\u003c/p\u003e\n\u003cp\u003eSome comments point to \"docs/Design-notes.md\", this page. A few, in the reviewed FPGA sources\n(\u003ccode\u003efpga/images/\u003c/code\u003e, the pinned files in \u003ccode\u003ertl/\u003c/code\u003e and \u003ccode\u003echromatic/fpga-media/\u003c/code\u003e) and in the staging scripts whose\ntext becomes part of those sources, still name the original internal design notes (\u003ccode\u003eCHROMATIC-...md\u003c/code\u003e).\nThose notes are not published, and the pinned sources cannot be edited without changing their SHA-256\nhashes. This page says where each topic lives now.\u003c/p\u003e\n\u003cp\u003eWhat they covered, and where to look instead:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNote\u003c/th\u003e\n\u003cth\u003eTopic\u003c/th\u003e\n\u003cth\u003eWhere now\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePOCKET-TETHER\u003c/td\u003e\n\u003ctd\u003eChromatic ↔ Pocket wire contract, credits, memory budget, link stages\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eshared/pocket_tether.h\u003c/code\u003e, \u003ccode\u003echromatic/launcher/shared/pocket_link.h\u003c/code\u003e, \u003ccode\u003ertl/chromatic_pocket_link.v\u003c/code\u003e and their tests; \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eREMOTE-CONTROL\u003c/td\u003e\n\u003ctd\u003eCHR1 protocol (Remote Pilot ↔ launcher), USB pacing, pairing\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/remote.h\u003c/code\u003e, \u003ccode\u003eremote-pilot/presets/chromatic/PROTOCOL.md\u003c/code\u003e; \u003ca href=\"#docs/Remote-Pilot.md\"\u003eRemote Pilot\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAUDIO-PLAN\u003c/td\u003e\n\u003ctd\u003eFPGA sound hooks, version register, the FPGA job runbook\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/fpga-media/chromatic_media.v\u003c/code\u003e, \u003ccode\u003escripts/stage_chromatic_fpga_media.py\u003c/code\u003e, \u003ccode\u003escripts/chromatic_fpga.py\u003c/code\u003e; \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eInstall\u003c/a\u003e, \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSETUP-ON-CONSOLE\u003c/td\u003e\n\u003ctd\u003eWi-Fi and Jellyfin screens, the one audited flash writer, power-cut model\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/setup_ui.h\u003c/code\u003e, \u003ccode\u003eprovision_write.c\u003c/code\u003e, \u003ccode\u003escripts/test_chromatic_setup.py\u003c/code\u003e; \u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJELLYFIN-PLAYER\u003c/td\u003e\n\u003ctd\u003eThe console's Jellyfin app, pacing, memory\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/jellyfin/jf_app.h\u003c/code\u003e, \u003ccode\u003ejf_ui.h\u003c/code\u003e; \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFPGA-STREAM-IMAGE\u003c/td\u003e\n\u003ctd\u003eHow the 18.41 image met timing, its pins\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/link-18.41/\u003c/code\u003e receipts, \u003ccode\u003escripts/stage_chromatic_fpga_link.py\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDIAGNOSTICS\u003c/td\u003e\n\u003ctd\u003eThe launcher's \u003ccode\u003ePJ-DIAG\u003c/code\u003e serial lines\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/shared/launcher_diag.h\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMANAGER\u003c/td\u003e\n\u003ctd\u003eChromatic Manager's behaviour in detail\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_manager*.py\u003c/code\u003e docstrings and tests; \u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe provisioning record (Wi-Fi, pairing, Jellyfin sign-in in two flash sectors) is defined by\n\u003ccode\u003escripts/chromatic_provision.py\u003c/code\u003e and its C twin \u003ccode\u003echromatic/launcher/shared/provision.h\u003c/code\u003e, cross-checked by\n\u003ccode\u003escripts/test_chromatic_provision_c.py\u003c/code\u003e.\u003c/p\u003e"
},
{
"path":"CONTRIBUTING.md",
"title":"Contributing",
"html":"\u003ch1 id=\"h-contributing-to-jellymatic\"\u003eContributing to Jellymatic\u003c/h1\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome. This is a hobby project: there is no guarantee of a\nresponse or a fix, but every report is read when time allows.\u003c/p\u003e\n\u003ch2 id=\"h-reporting-a-bug\"\u003eReporting a bug\u003c/h2\u003e\n\u003cp\u003eOpen an issue with:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eWhat you did, what you expected, what happened.\u003c/li\u003e\n\u003cli\u003eVersions: start-up menu (shown on its credits screen and in Chromatic Manager), Chromatic Manager\ncommit, FPGA image (official, 18.40 or 18.41), Windows version.\u003c/li\u003e\n\u003cli\u003eThe Manager's result headline and, if useful, the relevant log lines \u003cstrong\u003eafter removing\u003c/strong\u003e every address,\nnetwork name, user name, token and device ID. Turn on the Manager's eye button (private details hidden)\nbefore taking screenshots.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eNever post Wi-Fi details, server addresses, Jellyfin tokens, backups or full logs. For security problems\nuse \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e instead of an issue.\u003c/p\u003e\n\u003ch2 id=\"h-pull-requests\"\u003ePull requests\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep the safety rules: no change may write the official firmware slot, settings or cartridges; every\nwrite goes through Chromatic Manager's journal, backup, read-back and Approve.\u003c/li\u003e\n\u003cli\u003eRun the tests that cover your change (\u003ca href=\"#docs/Building-from-source.md:tests\"\u003edocs/Building-from-source.md\u003c/a\u003e)\nand say which ones you ran. The tests must never open a device.\u003c/li\u003e\n\u003cli\u003ePlain words in anything a user reads. Keep the pixel style of the console and the Manager.\u003c/li\u003e\n\u003cli\u003eAfter editing any documentation page, run \u003ccode\u003epy -3 scripts\\build_docs_html.py\u003c/code\u003e (Open-Documentation.html and\ndocs/index.html) and \u003ccode\u003epy -3 scripts\\build_docs_pdf.py\u003c/code\u003e (the PDF guide); \u003ccode\u003escripts\\test_docs_html.py\u003c/code\u003e checks\nall three. When the repository is public, GitHub Pages can serve the docs: Settings \u0026gt; Pages, branch \u003ccode\u003emain\u003c/code\u003e,\nfolder \u003ccode\u003e/docs\u003c/code\u003e; the site is \u003ccode\u003ehttps://chaoticspartan1.github.io/Jellymatic/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eDo not add files you may not share (firmware dumps, ModRetro's or Gowin's files, licences, real media).\u003c/li\u003e\n\u003cli\u003eBy contributing you agree that your contribution is licensed under GPL-3.0-or-later with the additional\nattribution term in \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e"
},
{
"path":"SECURITY.md",
"title":"Security",
"html":"\u003ch1 id=\"h-security\"\u003eSecurity\u003c/h1\u003e\n\u003ch2 id=\"h-reporting-a-vulnerability\"\u003eReporting a vulnerability\u003c/h2\u003e\n\u003cp\u003ePlease report security problems \u003cstrong\u003eprivately\u003c/strong\u003e, not in a public issue: use GitHub's\n\u003cstrong\u003eSecurity › Report a vulnerability\u003c/strong\u003e (private vulnerability reporting) on this repository. Describe the\nproblem, how to reproduce it, and what it affects (console, PC tool, Remote Pilot, Jellyfin sign-in).\nThere is no guarantee of a response time; reports are handled as time allows.\u003c/p\u003e\n\u003ch2 id=\"h-never-post-publicly\"\u003eNever post publicly\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eWi-Fi network names and passwords\u003c/li\u003e\n\u003cli\u003eJellyfin server addresses, user names, user IDs, tokens, Quick Connect codes, device IDs\u003c/li\u003e\n\u003cli\u003eRemote Pilot pairing keys, the Manager's local API token or discovery file\u003c/li\u003e\n\u003cli\u003eConsole backups, flash dumps, serial numbers, MAC addresses\u003c/li\u003e\n\u003cli\u003eLogs or screenshots that show any of the above (turn on the Manager's eye button before a screenshot)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-jellymatic-does-to-protect-you\"\u003eWhat Jellymatic does to protect you\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eYour Wi-Fi and Jellyfin details stay in \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e on your PC and on your console;\nnothing is uploaded.\u003c/li\u003e\n\u003cli\u003eThe console gets its own revocable Jellyfin sign-in (Quick Connect); your password never goes to it, and\nJellymatic signs out only that console's own sign-in.\u003c/li\u003e\n\u003cli\u003eChromatic Manager's API listens on 127.0.0.1 only, with a random token per run; every write needs your\nApprove in the window.\u003c/li\u003e\n\u003cli\u003eRemote Pilot works on private networks only and never shows password fields while connected.\u003c/li\u003e\n\u003c/ul\u003e"
},
{
"path":"THIRD-PARTY-NOTICES.md",
"title":"Third-party notices",
"html":"\u003ch1 id=\"h-third-party-notices\"\u003eThird-party notices\u003c/h1\u003e\n\u003cp\u003eComponents by others that are \u003cstrong\u003eincluded in this repository\u003c/strong\u003e, with where their licence text is.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eComponent\u003c/th\u003e\n\u003cth\u003eFiles here\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003cth\u003eLicence text\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eModRetro Chromatic FPGA design v18.14 (commit a01aa375), files modified by ChaoticSPARTAN1 for Jellymatic, 2026-11\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/sound-18.40/src/\u003c/code\u003e and \u003ccode\u003efpga/images/link-18.41/src/\u003c/code\u003e: ModRetro's files \u003ccode\u003etop.v\u003c/code\u003e, \u003ccode\u003ertl/BSP/system_monitor.sv\u003c/code\u003e, \u003ccode\u003ertl/EMU/emu_system_top.v\u003c/code\u003e, \u003ccode\u003ertl/EMU/cart.v\u003c/code\u003e, \u003ccode\u003eboard/evt1_x2/evt1_x2.sdc\u003c/code\u003e (both images), \u003ccode\u003ertl/BSP/uart/uart.v\u003c/code\u003e, and the project files \u003ccode\u003eevt1_x2.gprj\u003c/code\u003e, \u003ccode\u003ebuild_options.tcl\u003c/code\u003e (18.41); the full list is in \u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e (the same GPL-3.0 text)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003euart.v\u003c/code\u003e (UART2 wrapper) in ModRetro's design\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/link-18.41/src/rtl/BSP/uart/uart.v\u003c/code\u003e (modified)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0, as ModRetro publishes it in its repository\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e. The file came to ModRetro's design from Gowin's reference design; ModRetro publishes it under its repository's GPL. Kept as ModRetro ships it apart from Jellymatic's marked hook.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMiSTer core (\"Gameboy_MiSTer\") (Till Harbaum and the MiSTer developers), as used in ModRetro's design\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efpga/images/*/src/rtl/EMU/CORE/gb.v\u003c/code\u003e (modified)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0-or-later (file header)\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShiny Relay 1.1.5 (Shiny Gen), the open firmware for the Chromatic\u003c/td\u003e\n\u003ctd\u003ethe \u003ccode\u003euart_tx_busy\u003c/code\u003e one-cycle gap fix in \u003ccode\u003efpga/images/link-18.41/src/rtl/BSP/system_monitor.sv\u003c/code\u003e (taken from its \u003ccode\u003esystem_monitor.sv\u003c/code\u003e, marked in the file); the request-once status channel pattern of its \u003ccode\u003elink_ev_req\u003c/code\u003e in \u003ccode\u003ertl/chromatic_pocket_link.v\u003c/code\u003e; the plain-word Wi-Fi join messages in \u003ccode\u003echromatic/launcher/shared/wifi_scan.h\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGPL-3.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e (the same GPL-3.0 text)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003espeedcontrol.vhd\u003c/code\u003e of ModRetro's design (from the MiSTer core \"Gameboy_MiSTer\"), translated to Verilog for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/fpga-media/sim/speedcontrol_model.v\u003c/code\u003e (translation by ChaoticSPARTAN1, 2026-11)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0, as ModRetro publishes the original (ADDITIONAL-TERMS.md does not apply)\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Simple UART for FPGA\" (Jakub Cabal), as used in ModRetro's design; Verilog port for simulation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ertl/uart2_vhdl_port.v\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMIT (port: GPL-3.0-or-later)\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/MIT-uart_for_fpga.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/MIT-uart_for_fpga.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEspressif ESP-IDF bootloader start file\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003echromatic/launcher/bootloader_components/main/bootloader_start.c\u003c/code\u003e (modified)\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin logo (jellyfin/jellyfin-ux, commit 69a2b7b1)\u003c/td\u003e\n\u003ctd\u003escaled in \u003ccode\u003echromatic/launcher/shared/launcher_art.h\u003c/code\u003e, \u003ccode\u003escripts/chromatic_theme.py\u003c/code\u003e; shown in \u003ccode\u003edocs/images/jellymatic-icon.png\u003c/code\u003e and console screenshots\u003c/td\u003e\n\u003ctd\u003eCC BY-SA 4.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/CC-BY-SA-4.0-Jellyfin-logo.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRoboto Medium (Roboto 2.138, Copyright 2011 Google Inc.), rasterized and scaled by \u003ccode\u003escripts/build_ui_font.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epocket/ui_font.h\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/Apache-2.0.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePress Start 2P (CodeMan38)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/heading-PressStart2P-Regular.ttf\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/OFL-1.1-PressStart2P.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-PressStart2P.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSilkscreen (The Silkscreen Project Authors)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003escripts/chromatic_gui_fonts/body-Silkscreen-Regular.ttf\u003c/code\u003e, \u003ccode\u003edocs/fonts/\u003c/code\u003e, \u003ccode\u003eremote-pilot/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/OFL-1.1-Silkscreen.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-Silkscreen.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-not-included-needed-to-build-or-run\"\u003eNot included, needed to build or run\u003c/h2\u003e\n\u003cp\u003eInstalled separately by you; each comes with its own licence: ESP-IDF v5.3 and its components, ModRetro's\nfull FPGA source with its submodule, Gowin EDA (proprietary, needs your own licence), openFPGALoader\n(Apache-2.0), Python (PSF), PySide6/Qt (LGPL-3.0), esptool (GPL-2.0-or-later), pyserial (BSD-3-Clause).\u003c/p\u003e\n\u003ch2 id=\"h-if-you-distribute-built-images\"\u003eIf you distribute built images\u003c/h2\u003e\n\u003cp\u003eThis repo <script>
(function () {
  var data = JSON.parse(document.getElementById('docs-data').textContent);
  var pages = {}, order = [];
  data.groups.forEach(function (g) { g.pages.forEach(function (p) { p.group = g.name; pages[p.path] = p; order.push(p.path); }); });
  var current = null;
  function el(id) { return document.getElementById(id); }
  function link(text, hash, cls) {
    var a = document.createElement('a'); a.textContent = text; a.href = '#' + hash; if (cls) a.className = cls; return a;
  }
  function parse() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    var cut = h.indexOf(':'), path = cut < 0 ? h : h.slice(0, cut), anchor = cut < 0 ? '' : h.slice(cut + 1);
    if (!pages[path]) { path = order[0]; anchor = ''; }
    return { path: path, anchor: anchor };
  }
  function nav(page) {
    var tabs = el('tabs'), list = el('pages');
    tabs.textContent = ''; list.textContent = '';
    data.groups.forEach(function (g) {
      tabs.appendChild(link(g.name, g.pages[0].path, g.name === page.group ? 'on' : ''));
      if (data.theme === 'chroma' && g.name !== page.group) return;
      var head = document.createElement('div'); head.className = 'group'; head.textContent = g.name; list.appendChild(head);
      g.pages.forEach(function (p) { list.appendChild(link(p.title, p.path, p.path === page.path ? 'on' : '')); });
    });
  }
  function show() {
    var where = parse(), page = pages[where.path];
    if (current !== page) {
      el('page').innerHTML = page.html;
      el('title').textContent = page.title;
      el('crumb').textContent = data.project + ' / ' + page.path;
      document.title = page.title + ' \u00b7 ' + data.project + ' documentation';
      nav(page);
      current = page;
    }
    var target = where.anchor && document.getElementById('h-' + where.anchor.toLowerCase());
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
