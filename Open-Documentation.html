"path":"docs/Install-with-Chromatic-Manager.md",
"title":"Install with Chromatic Manager",
"html":"\u003ch1 id=\"h-install-with-chromatic-manager\"\u003eInstall with Chromatic Manager\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Install with Chromatic Manager\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:1-set-up-the-pc\"\u003e1. Set up the PC\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:2-get-the-start-up-menu-image\"\u003e2. Get the start-up menu image\u003c/a\u003e ·\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:3-install\"\u003e3. Install\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:the-window\"\u003eThe window\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:wi-fi-and-jellyfin-from-the-pc-optional\"\u003eWi-Fi and Jellyfin from the PC\u003c/a\u003e ·\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003eFull backup before any FPGA change\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eJellyfin sound\u003c/a\u003e ·\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:update-the-pocket-link-in-one-step-fpga-1841\"\u003eUpdate the Pocket link\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:apps-tv-and-chromatube\"\u003eApps: TV and ChromaTube\u003c/a\u003e ·\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:weather-location\"\u003eWeather location\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:text-menu\"\u003eText menu\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:where-your-files-are\"\u003eYour files\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-1-set-up-the-pc\"\u003e1. Set up the PC\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eInstall \u003cstrong\u003ePython 3.12+\u003c/strong\u003e from python.org (tick \"Add python.exe to PATH\").\u003c/li\u003e\n\u003cli\u003eDownload this repository (Code › Download ZIP, or \u003ccode\u003egit clone\u003c/code\u003e) and unzip it, for example to \u003ccode\u003eC:\\Jellymatic\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRight-click \u003ccode\u003eSetup-Jellymatic.ps1\u003c/code\u003e › \u003cstrong\u003eRun with PowerShell\u003c/strong\u003e (or\n\u003ccode\u003epowershell -ExecutionPolicy Bypass -File Setup-Jellymatic.ps1\u003c/code\u003e). It creates your private folder\n\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e and installs the three Python packages the Manager needs. It never\ntouches a console and never uploads anything.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-2-get-the-start-up-menu-image\"\u003e2. Get the start-up menu image\u003c/h2\u003e\n\u003cp\u003eThe Manager installs the three files in \u003ccode\u003erelease\\launcher\\\u003c/code\u003e (\u003ccode\u003ebootloader\\bootloader.bin\u003c/code\u003e,\n\u003ccode\u003epartition_table\\partition-table.bin\u003c/code\u003e, \u003ccode\u003echromatic_launcher.bin\u003c/code\u003e). The easy way:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eOpen the \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/releases/latest\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eReleases page\u003c/a\u003e (the latest\nJellymatic release).\u003c/li\u003e\n\u003cli\u003eDownload \u003cstrong\u003e\u003ccode\u003eJellymatic-start-up-menu-\u0026lt;version\u0026gt;.zip\u003c/code\u003e\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eExtract it \u003cstrong\u003einto your Jellymatic folder\u003c/strong\u003e (the one with \u003ccode\u003eChromatic-Manager-Window.cmd\u003c/code\u003e), keeping its\nfolders: the three files land in \u003ccode\u003erelease\\launcher\\\u003c/code\u003e, next to their licence notices and \u003ccode\u003eSHA256SUMS\u003c/code\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eOr build them yourself with \u003ccode\u003escripts\\Build-ChromaticLauncher.ps1\u003c/code\u003e\n(\u003ca href=\"#docs/Building-from-source.md:start-up-menu\"\u003eBuilding from source\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-3-install\"\u003e3. Install\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003ePlug the Chromatic into the PC with the USB cable and \u003cstrong\u003eswitch it on\u003c/strong\u003e, with a cartridge in.\u003c/li\u003e\n\u003cli\u003eDouble-click \u003cstrong\u003e\u003ccode\u003eChromatic-Manager-Window.cmd\u003c/code\u003e\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eThe Home tab checks the console (about 20 seconds; the first time, a full read takes about 6 minutes),\nthen shows \u003cstrong\u003eone\u003c/strong\u003e main button. For a console without Jellymatic it is \u003cstrong\u003eInstall\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePress it. The first time it asks \u003cstrong\u003eAdd Local Weather?\u003c/strong\u003e: \u003cstrong\u003eChoose my place...\u003c/strong\u003e, \u003cstrong\u003eUse Orlando, FL\u003c/strong\u003e or \u003cstrong\u003eSkip\nLocal Weather\u003c/strong\u003e (\u003ca href=\"#docs/TV-and-Local-Weather.md:the-first-install-asks\"\u003eTV and Local Weather\u003c/a\u003e). Then read the small\n\u003cstrong\u003eApprove\u003c/strong\u003e window (it names the exact image and what else it will write), press \u003cstrong\u003eApprove\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eThe first time, the Manager takes the \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003efull backup\u003c/a\u003e of both chips\n(about 15 minutes, nothing written). Then it writes the menu, reads it back, checks the whole flash and\nrestarts the console to watch it start. Keep the cable in and the console on until it says \u003cstrong\u003eDone\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eSwitch the console off and on: the start-up menu appears. Carry on with\n\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\n\u003cimg src=\"docs/images/manager-update.png\" width=\"400\" alt=\"Manager: one main button (here: an update is ready)\"\u003e\n\u003cimg src=\"docs/images/manager-approve.png\" width=\"400\" alt=\"The Approve window names the exact image\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n\u003cimg src=\"docs/images/manager-home.png\" width=\"400\" alt=\"Manager: up to date\"\u003e\n\u003cimg src=\"docs/images/manager-fix.png\" width=\"400\" alt=\"Manager: Fix a problem\"\u003e\n\u003c/p\u003e\n\u003cp\u003eUpdating later is the same: extract the newer release zip the same way; when \u003ccode\u003erelease\\launcher\\\u003c/code\u003e holds a\nnewer menu, Home shows \u003cstrong\u003eUpdate to x.y.z\u003c/strong\u003e. An update writes only the start-up menu's own area: your Wi-Fi, Jellyfin\nsign-in, app choices and weather location stay on the console.\u003c/p\u003e\n\u003ch2 id=\"h-the-window\"\u003eThe window\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTab\u003c/th\u003e\n\u003cth\u003eWhat is on it\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eHome\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe console's state in plain words and at most one main button; under \u003cstrong\u003eMore\u003c/strong\u003e: Check again, Official update, Wi-Fi, New Jellyfin sign-in\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFix a problem\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSet up Jellyfin sound, Back up, Repair menu, Remove menu, Switch menu off, Restore original, Forget Jellyfin, the console chip (FPGA) jobs, Finish job, Close job (each button explains itself when you hover)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eRemote Pilot\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSee and press the console's menus from the PC (\u003ca href=\"#docs/Remote-Pilot.md\"\u003eRemote Pilot\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSettings\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAI control (off unless you allow it), Jellyfin on this PC, \u003cstrong\u003eApps\u003c/strong\u003e, \u003cstrong\u003eWeather location\u003c/strong\u003e, \u003cstrong\u003eLive TV channels\u003c/strong\u003e, \u003cstrong\u003eChromaTube server\u003c/strong\u003e (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:apps-tv-and-chromatube\"\u003eApps\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eAbout\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eFolders, guide, licences\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe \u003cstrong\u003eeye\u003c/strong\u003e button at the top hides private details (addresses, network names, user names, IDs) on screen,\nso screenshots are safe. It is on at every start.\u003c/p\u003e\n\u003ch2 id=\"h-wi-fi-and-jellyfin-from-the-pc-optional\"\u003eWi-Fi and Jellyfin from the PC (optional)\u003c/h2\u003e\n\u003cp\u003eYou can set up everything on the console itself (\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run\u003c/a\u003e). If you prefer\nthe PC: \u003cstrong\u003eMore › Wi-Fi\u003c/strong\u003e. Networks come from \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\chromatic-wifi-networks.txt\u003c/code\u003e\n(optional; an \u003ccode\u003essid=\u003c/code\u003e line then a \u003ccode\u003epassword=\u003c/code\u003e line per network, see \u003ccode\u003echromatic-wifi-networks.example.txt\u003c/code\u003e)\nor are typed in the window; they are \u003cstrong\u003emerged\u003c/strong\u003e with the networks\nalready on the console (at most 4). If this PC has Jellyfin settings (Settings tab), the console also gets\n\u003cstrong\u003eits own\u003c/strong\u003e Jellyfin sign-in through Quick Connect: your password never goes to the console, and the\nconsole appears as its own device in Jellyfin's Dashboard › Devices, where you can revoke it. Jellymatic\nonly ever signs out the console's own sign-in, never your other devices.\u003c/p\u003e\n\u003ch2 id=\"h-full-backup-before-any-fpga-change\"\u003eFull backup before any FPGA change\u003c/h2\u003e\n\u003cp\u003eNothing is written to a console before a \u003cstrong\u003efull backup of both chips\u003c/strong\u003e exists on your PC. The first time\nyou press \u003cstrong\u003eInstall\u003c/strong\u003e (or \u003cstrong\u003eBack up\u003c/strong\u003e, an official update, or any console chip job), the Manager takes it by\nitself, before anything else, with no extra questions:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eIt checks the console model on the chips themselves (the ESP32, its flash chip, the console chip's\nJTAG id) and refuses a model or firmware it does not know.\u003c/li\u003e\n\u003cli\u003eIt reads the whole \u003cstrong\u003eESP32\u003c/strong\u003e flash (4 MiB) \u003cstrong\u003etwice\u003c/strong\u003e, every 256 KiB piece checked against the chip's\nown checksum, and the whole \u003cstrong\u003econsole chip (FPGA)\u003c/strong\u003e flash (4 MiB) \u003cstrong\u003etwice\u003c/strong\u003e over its JTAG bridge\n(needs openFPGALoader, see \u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e). The two reads of each chip must be\nidentical, or nothing is kept. Both chips must be checked to belong to the same console.\u003c/li\u003e\n\u003cli\u003eThe console must run the \u003cstrong\u003eofficial ModRetro firmware exactly as it comes\u003c/strong\u003e: no start-up menu (not\neven switched off), nothing half-installed, and none of Jellymatic's console chip images (sound\n18.40, Pocket link 18.41). Otherwise the backup is refused, because it would not be your original:\nput the official firmware back with ModRetro's own updater first\n(\u003ca href=\"#docs/Recovery.md:official-updates-and-restoring-chromatic-os\"\u003eRecovery\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eIt saves them in \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\chromatic-backup-\u0026lt;date\u0026gt;-\u0026lt;time\u0026gt;\\\u003c/code\u003e, makes the three-file\nrestore bundle, copies it to the \u003cstrong\u003esecond copy\u003c/strong\u003e folder, and reads every file back.\u003c/li\u003e\n\u003cli\u003eOnly then does it record the backup as your console's original and go on.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThis first full backup is taken \u003cstrong\u003eonce\u003c/strong\u003e. An original that is already recorded is \u003cstrong\u003enever replaced\u003c/strong\u003e: if\nit cannot be checked (for example the second copy's disk or USB stick is not connected), every job that\nneeds it stops and says so, and nothing is read or written. Connect the disk and try again.\u003c/p\u003e\n\u003cp\u003eThis takes about 15 minutes and writes nothing to the console (the screen goes dark for a moment while\nthe console chip is read, then the console restarts). Your Wi-Fi passwords and Jellyfin sign-in are left\nout of every backup.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe second copy is usually on the same disk\u003c/strong\u003e (\u003ccode\u003e%USERPROFILE%\\Jellymatic-Backups\u003c/code\u003e). For real safety\nput it on another disk or a USB stick: set \u003ccode\u003eJELLYMATIC_SECOND_COPY\u003c/code\u003e to a folder there before the first\nbackup (for example \u003ccode\u003esetx JELLYMATIC_SECOND_COPY \"E:\\Jellymatic-Backups\"\u003c/code\u003e, then open a new window).\u003c/p\u003e\n\u003cp\u003eAdvanced, the same backup by hand (read-only tools, in a PowerShell window in the Jellymatic folder):\n\u003ccode\u003escripts\\chromatic_backup.py mcu\u003c/code\u003e, then \u003ccode\u003escripts\\chromatic_backup.py fpga --folder \u0026lt;the folder name it shows\u0026gt;\u003c/code\u003e\n(add \u003ccode\u003e--second-copy \"\u0026lt;another disk\u0026gt;\"\u003c/code\u003e to choose where the second copy goes). The second step also makes the\nrestore bundle and its second copy and checks both; only then is the backup recorded as your original. The\nsame rules apply as in the Manager: both steps refuse at once, before touching the console, when a full\nbackup is already recorded, and they need the start-up menu files in \u003ccode\u003erelease\\launcher\\\u003c/code\u003e to recognise the\nofficial firmware.\u003c/p\u003e\n\u003ch2 id=\"h-jellyfin-sound-fpga-1840\"\u003eJellyfin sound (FPGA 18.40)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eFix a problem › Set up Jellyfin sound\u003c/strong\u003e is a guided job: Check FPGA (reads all 4 MiB and recognises your\noriginal image), a rehearsal that writes your original image back and checks it (so the undo is proven on\nyour console first), then the sound image, read back byte for byte. Needs the full backup above,\nopenFPGALoader, and the \u003cstrong\u003eofficial release files\u003c/strong\u003e \u003ccode\u003eevt1_x2.fs\u003c/code\u003e + \u003ccode\u003eevt1_x2.bin\u003c/code\u003e of the sound image in\n\u003ccode\u003efpga\\images\\sound-18.40\\build\\\u003c/code\u003e. Download \u003cstrong\u003e\u003ccode\u003eJellymatic-FPGA-images-\u0026lt;version\u0026gt;.zip\u003c/code\u003e\u003c/strong\u003e from the\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/releases/latest\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eReleases page\u003c/a\u003e and extract it into your\nJellymatic folder, keeping its folders: it puts both images (18.40 and 18.41) in their \u003ccode\u003ebuild\\\u003c/code\u003e folders\n(see \u003ca href=\"#docs/What-you-need.md:for-jellyfin-sound-and-the-pocket-link\"\u003eWhat you need\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-update-the-pocket-link-in-one-step-fpga-1841\"\u003eUpdate the Pocket link in one step (FPGA 18.41)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eUpdate the Pocket link\u003c/strong\u003e (Home, when the console has the sound image and the reviewed 18.41 image is in\n\u003ccode\u003efpga\\images\\link-18.41\\build\\\u003c/code\u003e) is one screen with one button, \u003cstrong\u003eUpdate now\u003c/strong\u003e:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eCheck FPGA: the flash must be the sound image, byte for byte.\u003c/li\u003e\n\u003cli\u003eThe new image is loaded into the chip's \u003cstrong\u003eRAM only\u003c/strong\u003e. Nothing is written yet.\u003c/li\u003e\n\u003cli\u003eAutomatic checks: the image loaded, USB came back, the start-up menu reports FPGA 18.41.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYour Approve, while the new image runs\u003c/strong\u003e: start a game for a moment and check picture and sound.\n\u003cem\u003eNot right\u003c/em\u003e, Cancel or switching the console off writes nothing (an off-and-on returns to the old image).\u003c/li\u003e\n\u003cli\u003eThe write, with backup checks, full read-back and journal; then a restart from flash that must report 18.41.\u003c/li\u003e\n\u003cli\u003eIf the start-up menu is older than the one in \u003ccode\u003erelease\\launcher\\\u003c/code\u003e, it is updated too (its own Approve).\nThen \u003cstrong\u003eReady: plug in the cable\u003c/strong\u003e, with \u003cstrong\u003ePut the previous image back\u003c/strong\u003e one click away.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-pocket-link-update.png\" width=\"400\" alt=\"Update the Pocket link, one step\"\u003e\u003c/p\u003e\n\u003cp\u003eThe Manager accepts only the reviewed 18.41 image: its \u003ccode\u003e.fs\u003c/code\u003e, \u003ccode\u003e.bin\u003c/code\u003e and stage receipt are pinned by\nSHA-256 in \u003ccode\u003escripts/chromatic_fpga.py\u003c/code\u003e. Any other build is refused, including your own build of the same\nsources (it is almost never byte-identical), so use the official release files from\n\u003ccode\u003eJellymatic-FPGA-images-\u0026lt;version\u0026gt;.zip\u003c/code\u003e on the \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/releases/latest\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eReleases page\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-apps-tv-and-chromatube\"\u003eApps: TV and ChromaTube\u003c/h2\u003e\n\u003cp\u003eFrom start-up menu \u003cstrong\u003e1.6.5\u003c/strong\u003e you choose which apps the menu shows (\u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e):\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSettings › Apps\u003c/strong\u003e (text menu \u003ccode\u003ea\u003c/code\u003e): \u003cstrong\u003eTV\u003c/strong\u003e on or off, with \u003cstrong\u003eLocal Weather only\u003c/strong\u003e (no server needed) or \u003cstrong\u003eLocal\nWeather and your Jellyfin server's Live TV channels\u003c/strong\u003e; \u003cstrong\u003eChromaTube\u003c/strong\u003e on or off. A new console has TV with Local\nWeather only and ChromaTube off.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSave and write to console\u003c/strong\u003e, then \u003cstrong\u003eApprove\u003c/strong\u003e: one journalled job writes the small apps record and checks the\nwhole flash on the chip; a game that is playing stops; the start-up menu, your Wi-Fi, Jellyfin sign-in and weather\nlocation are not touched. \u003cstrong\u003eUse defaults\u003c/strong\u003e goes back to the defaults. The console can hide and show the apps itself\ntoo (Select on the row; Other firmware › Show hidden apps).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLive TV channels\u003c/strong\u003e are optional and are added to your Jellyfin server, not to the console:\n\u003cstrong\u003eSettings › Live TV channels\u003c/strong\u003e (text menu \u003ccode\u003el\u003c/code\u003e; \u003ca href=\"#docs/TV-and-Local-Weather.md:live-tv-optional\"\u003eTV and Local Weather\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChromaTube\u003c/strong\u003e needs its server tool and one Jellyfin library first: \u003cstrong\u003eSettings › ChromaTube server\u003c/strong\u003e (text menu\n\u003ccode\u003ey\u003c/code\u003e; \u003ca href=\"#docs/ChromaTube.md:set-it-up\"\u003eChromaTube\u003c/a\u003e).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-apps.png\" width=\"600\" alt=\"Settings, Apps on the start-up menu\"\u003e\u003c/p\u003e\n\u003cp\u003eInstalls keep the apps record. If the console has none (after Remove menu or Restore original), an install of 1.6.5 or\nnewer writes this PC's saved copy back in the same job, under the same Approve. Server changes for Live TV and\nChromaTube follow the same rules as everything else in Jellymatic: add-only, a backup and a dry run first, proof\nafterwards, an administrator sign-in used once and never saved, and never a sign-out of your other devices.\u003c/p\u003e\n\u003ch2 id=\"h-weather-location\"\u003eWeather location\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eSettings › Weather location\u003c/strong\u003e (text menu: \u003ccode\u003ew\u003c/code\u003e) chooses the place for the TV row's Local Weather channel:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eType a US ZIP code or \"City, ST\" and press \u003cstrong\u003eFind\u003c/strong\u003e. The match comes from a table on this PC (US Census Bureau\n2024 Gazetteer, public domain): nothing is sent yet. If several places match, add the state (\"Springfield, MO\").\u003c/li\u003e\n\u003cli\u003ePress the place: the Manager asks the National Weather Service (the only service your place goes to) for its\nforecast area, time zone and six nearest weather stations, and shows them, with the pages the console will show.\nThe place shows masked until you turn the eye off.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSave and write to console\u003c/strong\u003e, then \u003cstrong\u003eApprove\u003c/strong\u003e: one journalled job writes the place to two small records of its\nown, checks the whole flash on the chip, and only then saves a copy on this PC (in your private folder).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eMake the area pages\u003c/strong\u003e (start-up menu 1.6.5 or newer), after step 2, makes your area's \u003cstrong\u003elocation pack\u003c/strong\u003e: the\nRegional Forecast map of your state, a close-up of your area and the nearest radar, previewed in the window and written\nwith the place under the same Approve. \u003cstrong\u003eExport pages...\u003c/strong\u003e / \u003cstrong\u003eImport pages...\u003c/strong\u003e save and use \u003ccode\u003e.pjlp\u003c/code\u003e pack files (same\nplace only; every pack is checked in full; import only packs you trust). Text menu: \u003ccode\u003ew\u003c/code\u003e, then \u003ccode\u003eimport \u0026lt;file\u0026gt;\u003c/code\u003e /\n\u003ccode\u003eexport \u0026lt;file\u0026gt;\u003c/code\u003e. Details and pictures: \u003ca href=\"#docs/TV-and-Local-Weather.md:your-areas-map-and-radar-pages-a-location-pack\"\u003eTV and Local Weather\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eUntil you choose one, the console shows the built-in default, Orlando, FL. \u003cstrong\u003eUse default (Orlando, FL)\u003c/strong\u003e erases\nthe place and its area pages (and the PC's copies) the same way. Install, update, downgrade and Switch menu off\nkeep the place; Remove menu and Restore original erase it; an install puts the PC's copy back if the console lost it.\nStatus and logs say \"your location\", never the place. An older start-up menu (before 1.6.3) ignores the record.\u003c/p\u003e\n\u003ch2 id=\"h-text-menu\"\u003eText menu\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eChromatic-Manager.cmd\u003c/code\u003e opens the same tool as a text menu: 1 status, 2 backup, 3 install, 4 remove,\n5 restore-stock, 6 guided official update, 7 Wi-Fi setup, 8 Jellyfin re-link, 9 Jellyfin forget, a apps, w weather\nlocation, l Live TV channels, y ChromaTube server. Every write asks you to type a one-time word shown on screen (for example \u003ccode\u003eyes482\u003c/code\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-where-your-files-are\"\u003eWhere your files are\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFolder\u003c/th\u003e\n\u003cth\u003eWhat\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eEverything personal: journals, backups, logs, settings, Wi-Fi list, Jellyfin settings, your weather location\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e%USERPROFILE%\\Jellymatic-Backups\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe second copy of every backup. It is usually on the same disk as the first: set \u003ccode\u003eJELLYMATIC_SECOND_COPY\u003c/code\u003e to another disk or a USB stick for real safety\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eSet \u003ccode\u003eJELLYMATIC_HOME\u003c/code\u003e to move the first one. None of it is ever part of the repository. Run\n\u003ccode\u003epython scripts\\user_paths.py\u003c/code\u003e to print the paths.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/First-run-on-the-console.md",
"title":"First run on the console",
"html":"\u003ch1 id=\"h-first-run-on-the-console\"\u003eFirst run on the console\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › First run on the console\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/First-run-on-the-console.md:open-jellyfin\"\u003eOpen Jellyfin\u003c/a\u003e · \u003ca href=\"#docs/First-run-on-the-console.md:add-your-wi-fi\"\u003eAdd your Wi-Fi\u003c/a\u003e ·\n\u003ca href=\"#docs/First-run-on-the-console.md:sign-in-to-jellyfin-quick-connect\"\u003eSign in to Jellyfin\u003c/a\u003e · \u003ca href=\"#docs/First-run-on-the-console.md:pocket-link\"\u003ePocket link\u003c/a\u003e · \u003ca href=\"#docs/First-run-on-the-console.md:buttons\"\u003eButtons\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-open-jellyfin\"\u003eOpen Jellyfin\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003ePut a cartridge in and switch the console \u003cstrong\u003eon\u003c/strong\u003e. The start-up menu appears: \u003cstrong\u003eGames\u003c/strong\u003e (selected), \u003cstrong\u003eJellyfin\u003c/strong\u003e,\n\u003cstrong\u003eTV\u003c/strong\u003e (from start-up menu 1.6) and \u003cstrong\u003eOther firmware\u003c/strong\u003e; \u003cstrong\u003eChromaTube\u003c/strong\u003e too once you switch it on.\u003c/li\u003e\n\u003cli\u003eHighlight \u003cstrong\u003eJellyfin\u003c/strong\u003e with the D-pad and press \u003cstrong\u003eA\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePress \u003cstrong\u003eSelect\u003c/strong\u003e to open \u003cstrong\u003eSetup\u003c/strong\u003e (Wi-Fi networks / Jellyfin server).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThe Wi-Fi and the Jellyfin sign-in you set up here are shared by every app: TV and ChromaTube need nothing new on the\nconsole (\u003ca href=\"#docs/Apps-on-the-start-up-menu.md\"\u003eApps on the start-up menu\u003c/a\u003e).\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/startup-menu-apps.png\" width=\"320\" alt=\"Start-up menu\"\u003e\n\u003cimg src=\"docs/images/jellyfin-screen.png\" width=\"320\" alt=\"Jellyfin highlighted on the start-up menu\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-add-your-wi-fi\"\u003eAdd your Wi-Fi\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSetup › Wi-Fi networks › Add a network…\u003c/strong\u003e The console scans and lists networks nearby\n(strongest first; a lock means a password is needed).\u003c/li\u003e\n\u003cli\u003eChoose yours and type the password on the on-screen keyboard:\nD-pad to move, \u003cstrong\u003eA\u003c/strong\u003e types, \u003cstrong\u003eB\u003c/strong\u003e deletes, \u003cstrong\u003eSelect\u003c/strong\u003e switches abc / ABC / #+=, \u003cstrong\u003eStart\u003c/strong\u003e is OK.\u003c/li\u003e\n\u003cli\u003eThe console says \u003cstrong\u003eSaved\u003c/strong\u003e, then \u003cstrong\u003eJoining…\u003c/strong\u003e, then \u003cstrong\u003eConnected\u003c/strong\u003e, or the reason it could not join\n(wrong password, network not found…) in plain words.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/setup-wifi.png\" width=\"320\" alt=\"Wi-Fi networks\"\u003e\n\u003cimg src=\"docs/images/setup-scan.png\" width=\"320\" alt=\"Choose a network (made-up names)\"\u003e\n\u003cimg src=\"docs/images/setup-keyboard.png\" width=\"320\" alt=\"Password keyboard\"\u003e\u003c/p\u003e\n\u003cp\u003eUp to \u003cstrong\u003e4\u003c/strong\u003e networks are kept. Choose a saved one to \u003cstrong\u003euse it now\u003c/strong\u003e, \u003cstrong\u003echange its password\u003c/strong\u003e or \u003cstrong\u003eforget\u003c/strong\u003e\nit. 2.4 GHz only; hotel-style sign-in pages are not supported (a phone hotspot works).\u003c/p\u003e\n\u003ch2 id=\"h-sign-in-to-jellyfin-quick-connect\"\u003eSign in to Jellyfin (Quick Connect)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSetup › Jellyfin server › Find servers nearby\u003c/strong\u003e (or \u003cstrong\u003eEnter server address\u003c/strong\u003e, for example\n\u003ccode\u003ehttp://your-server:8096\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003eChoose your server. The console shows a \u003cstrong\u003e6-digit code\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eIn any Jellyfin app where you are signed in (web, phone, TV): \u003cstrong\u003eSettings › Quick Connect\u003c/strong\u003e, enter the\ncode, approve it.\u003c/li\u003e\n\u003cli\u003eThe console says \u003cstrong\u003eSigned in\u003c/strong\u003e. It now has its own sign-in, shown in Jellyfin's\n\u003cstrong\u003eDashboard › Devices\u003c/strong\u003e as \"Chromatic\". Your password never goes to the console.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/setup-quick-connect.png\" width=\"320\" alt=\"Quick Connect code on the console\"\u003e\u003c/p\u003e\n\u003cp\u003eQuick Connect must be on in the server's \u003cstrong\u003eDashboard › General\u003c/strong\u003e. To undo: \u003cstrong\u003eSetup › Jellyfin server ›\nForget this sign-in\u003c/strong\u003e (it signs the console out on the server too), or revoke the device in Jellyfin.\u003c/p\u003e\n\u003ch2 id=\"h-pocket-link\"\u003ePocket link\u003c/h2\u003e\n\u003cp\u003eOnly with the 18.41 console chip image installed (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:update-the-pocket-link-in-one-step-fpga-1841\"\u003eInstall\u003c/a\u003e)\nand \u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e on the Pocket. See \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-buttons\"\u003eButtons\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eButtons\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStart-up menu\u003c/td\u003e\n\u003ctd\u003eD-pad choose · \u003cstrong\u003eA\u003c/strong\u003e start · \u003cstrong\u003eB\u003c/strong\u003e Games · \u003cstrong\u003eSelect\u003c/strong\u003e on TV or ChromaTube: hide it (\u003ca href=\"#docs/Apps-on-the-start-up-menu.md:on-the-console\"\u003eApps\u003c/a\u003e); elsewhere: Credits\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin page\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e open the library · \u003cstrong\u003eSelect\u003c/strong\u003e setup · \u003cstrong\u003eB\u003c/strong\u003e or \u003cstrong\u003eStart\u003c/strong\u003e back to the menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTV\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eUp/Down\u003c/strong\u003e choose · \u003cstrong\u003eA\u003c/strong\u003e watch · \u003cstrong\u003eB\u003c/strong\u003e back (\u003ca href=\"#docs/TV-and-Local-Weather.md:buttons\"\u003eTV and Local Weather\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChromaTube\u003c/td\u003e\n\u003ctd\u003eD-pad choose · \u003cstrong\u003eA\u003c/strong\u003e open or play · \u003cstrong\u003eB\u003c/strong\u003e back (\u003ca href=\"#docs/ChromaTube.md:using-it\"\u003eChromaTube\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSetup screens\u003c/td\u003e\n\u003ctd\u003eD-pad · \u003cstrong\u003eA\u003c/strong\u003e open · \u003cstrong\u003eB\u003c/strong\u003e back\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHolding any button while switching on\u003c/td\u003e\n\u003ctd\u003eSkips the menu: straight to Games\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin on the Chromatic\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Using-Jellyfin-on-the-Chromatic.md",
"title":"Using Jellyfin",
"html":"\u003ch1 id=\"h-using-jellyfin-on-the-chromatic\"\u003eUsing Jellyfin on the Chromatic\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Using Jellyfin on the Chromatic\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:browsing\"\u003eBrowsing\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:playing\"\u003ePlaying\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:sound\"\u003eSound\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:slow-wi-fi\"\u003eSlow Wi-Fi\u003c/a\u003e ·\n\u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:leaving\"\u003eLeaving\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:limits\"\u003eLimits\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-browsing\"\u003eBrowsing\u003c/h2\u003e\n\u003cp\u003eOpen \u003cstrong\u003eJellyfin\u003c/strong\u003e from the start-up menu. The console joins your saved Wi-Fi by itself and talks straight\nto your Jellyfin server; no PC is needed.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eHome\u003c/strong\u003e: rows in Jellyfin's own order (My Media, Continue Watching, Next Up, Latest per library).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFolders\u003c/strong\u003e: grids of posters or episode pictures.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDetails\u003c/strong\u003e: \u003cstrong\u003eResume\u003c/strong\u003e or \u003cstrong\u003eFrom start\u003c/strong\u003e, how far you got, and the overview.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/player-home.png\" width=\"320\" alt=\"Jellyfin home on the Chromatic (sample data)\"\u003e\n\u003cimg src=\"docs/images/player-details.png\" width=\"320\" alt=\"Details page (sample data)\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-playing\"\u003ePlaying\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eButton\u003c/th\u003e\n\u003cth\u003eDoes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003ePause / play\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eLeft / Right\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBack / forward 10 seconds\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSelect\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eShow or hide the bar under the picture\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eStop\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/player-playing.png\" width=\"320\" alt=\"Playback with the bar below the picture (sample test pattern)\"\u003e\n\u003cimg src=\"docs/images/player-menu.png\" width=\"320\" alt=\"The app\u0026#x27;s menu: Home, card size, audio track, playback info\"\u003e\u003c/p\u003e\n\u003cp\u003eThe app's menu has \u003cstrong\u003eHome\u003c/strong\u003e, the card size, the \u003cstrong\u003eaudio track\u003c/strong\u003e (when a title has more than one) and\n\u003cstrong\u003ePlayback info\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eThe server converts each title to a size the console can show (up to 160 × 120), at the title's own frame\nrate. Pictures that are late are skipped rather than shown out of time. Where you stopped and what you\nwatched go back to the server, so other Jellyfin apps continue from the same place.\u003c/p\u003e\n\u003ch2 id=\"h-sound\"\u003eSound\u003c/h2\u003e\n\u003cp\u003eSound needs the console chip (FPGA) sound image 18.40 or the Pocket link image 18.41\n(\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eInstall\u003c/a\u003e). With the official FPGA image, video\nplays without sound and the console says so.\u003c/p\u003e\n\u003ch2 id=\"h-slow-wi-fi\"\u003eSlow Wi-Fi\u003c/h2\u003e\n\u003cp\u003eThe player starts at about 1 Mbit/s and up to 15 pictures a second. If the network falls behind it halves the\nbitrate (down to 200 kbit/s); if the console falls behind it asks for fewer pictures a second. The message\n\"Adjusting quality\" shows when it does. Smooth play earns the quality back next time.\u003c/p\u003e\n\u003ch2 id=\"h-leaving\"\u003eLeaving\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eB\u003c/strong\u003e stops playback; \u003cstrong\u003eB\u003c/strong\u003e again goes back through the screens; \u003cstrong\u003eStart\u003c/strong\u003e on the Jellyfin page returns to\nthe start-up menu, where \u003cstrong\u003eGames\u003c/strong\u003e starts your cartridge.\u003c/p\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA cartridge must be in the console (the app draws over it).\u003c/li\u003e\n\u003cli\u003e2.4 GHz Wi-Fi only; no hotel sign-in pages.\u003c/li\u003e\n\u003cli\u003eSubtitles and search are not available yet.\u003c/li\u003e\n\u003cli\u003eVideos of the \u003cstrong\u003eChromaTube\u003c/strong\u003e library play correctly only from the ChromaTube row (\u003ca href=\"#docs/ChromaTube.md\"\u003eChromaTube\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Hosting-Jellyfin.md\"\u003eHosting Jellyfin\u003c/a\u003e · \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Apps-on-the-start-up-menu.md",
"title":"Apps on the menu",
"html":"\u003ch1 id=\"h-apps-on-the-start-up-menu\"\u003eApps on the start-up menu\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Apps on the start-up menu\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Apps-on-the-start-up-menu.md:the-rows\"\u003eThe rows\u003c/a\u003e · \u003ca href=\"#docs/Apps-on-the-start-up-menu.md:in-chromatic-manager\"\u003eIn Chromatic Manager\u003c/a\u003e · \u003ca href=\"#docs/Apps-on-the-start-up-menu.md:on-the-console\"\u003eOn the console\u003c/a\u003e ·\n\u003ca href=\"#docs/Apps-on-the-start-up-menu.md:what-each-app-needs\"\u003eWhat each app needs\u003c/a\u003e · \u003ca href=\"#docs/Apps-on-the-start-up-menu.md:what-stays-the-same\"\u003eWhat stays the same\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-the-rows\"\u003eThe rows\u003c/h2\u003e\n\u003cp\u003eFrom start-up menu \u003cstrong\u003e1.6.5\u003c/strong\u003e, you choose which apps the menu shows. \u003cstrong\u003eGames\u003c/strong\u003e is always first, always selected when\nyou switch the console on, and \u003cstrong\u003eB\u003c/strong\u003e always means Games.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRow\u003c/th\u003e\n\u003cth\u003eWhat it is\u003c/th\u003e\n\u003cth\u003eShown\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eGames\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eYour cartridge, on the console's own untouched firmware\u003c/td\u003e\n\u003ctd\u003eAlways\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eJellyfin\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBrowse and play your Jellyfin library (\u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eAlways\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eTV\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe retro \u003cstrong\u003eLocal Weather\u003c/strong\u003e channel; optionally also your Jellyfin server's \u003cstrong\u003eLive TV\u003c/strong\u003e channels (\u003ca href=\"#docs/TV-and-Local-Weather.md\"\u003eTV and Local Weather\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eOn by default, with Local Weather only\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eChromaTube\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eOptional video channels through your Jellyfin server (\u003ca href=\"#docs/ChromaTube.md\"\u003eChromaTube\u003c/a\u003e)\u003c/td\u003e\n\u003ctd\u003eOff by default\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eOther firmware\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe stock firmware, listed and protected; and \u003cstrong\u003eShow hidden apps\u003c/strong\u003e when an app is hidden\u003c/td\u003e\n\u003ctd\u003eAlways\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eSo a new console shows four rows: \u003cstrong\u003eGames, Jellyfin, TV, Other firmware\u003c/strong\u003e, and TV opens straight to Local Weather,\nwhich needs only Wi-Fi.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/startup-menu-apps.png\" width=\"320\" alt=\"A new console: Games, Jellyfin, TV, Other firmware\"\u003e\n\u003cimg src=\"docs/images/startup-menu-all-apps.png\" width=\"320\" alt=\"With ChromaTube switched on: five rows\"\u003e\u003c/p\u003e\n\u003cp\u003eTV and ChromaTube are separate apps with their own guides and server tools\n(\u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e and \u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e),\nbuilt into the same start-up menu: there is still one start-up menu to install, check and undo.\u003c/p\u003e\n\u003ch2 id=\"h-in-chromatic-manager\"\u003eIn Chromatic Manager\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eSettings › Apps\u003c/strong\u003e (text menu: \u003ccode\u003ea\u003c/code\u003e):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTV\u003c/strong\u003e: on or off. When on, choose \u003cstrong\u003eLocal Weather only\u003c/strong\u003e (no server needed) or \u003cstrong\u003eLocal Weather and your Jellyfin\nserver's Live TV channels\u003c/strong\u003e (only once your server has Live TV channels: \u003ca href=\"#docs/TV-and-Local-Weather.md:live-tv-optional\"\u003eTV and Local Weather\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChromaTube\u003c/strong\u003e: on or off (useful once your server has the ChromaTube library: \u003ca href=\"#docs/ChromaTube.md:set-it-up\"\u003eChromaTube\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePress \u003cstrong\u003eSave and write to console\u003c/strong\u003e, plug the console in, switch it on and press \u003cstrong\u003eApprove\u003c/strong\u003e. Only the small apps\nrecord is written and checked on the chip; a game that is playing stops; your Wi-Fi, Jellyfin sign-in, weather\nlocation and games stay as they are. \u003cstrong\u003eUse defaults\u003c/strong\u003e goes back to \"TV with Local Weather only, ChromaTube off\".\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-apps.png\" width=\"600\" alt=\"Chromatic Manager: Settings, Apps on the start-up menu\"\u003e\u003c/p\u003e\n\u003cp\u003eThe choice survives updates of the start-up menu and Switch menu off. If the console ever loses it (after Remove menu\nor Restore original), the next install puts back the copy Chromatic Manager kept on your PC.\u003c/p\u003e\n\u003ch2 id=\"h-on-the-console\"\u003eOn the console\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eHide an app:\u003c/strong\u003e on the start-up menu, move to \u003cstrong\u003eTV\u003c/strong\u003e or \u003cstrong\u003eChromaTube\u003c/strong\u003e and press \u003cstrong\u003eSelect\u003c/strong\u003e. The console asks\n\"Hide TV?\": \u003cstrong\u003eA\u003c/strong\u003e hides it, \u003cstrong\u003eB\u003c/strong\u003e cancels. (On Games, Jellyfin and Other firmware, Select still shows the Credits.)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBring hidden apps back:\u003c/strong\u003e choose \u003cstrong\u003eOther firmware\u003c/strong\u003e, then \u003cstrong\u003eShow hidden apps\u003c/strong\u003e (the row is there whenever an app is\nhidden), and press \u003cstrong\u003eA\u003c/strong\u003e on the question.\u003c/li\u003e\n\u003cli\u003eThese questions answer only to the console's own buttons, not to remote-control tools such as Remote Pilot. If the\nconsole says \u003cstrong\u003eCould not save\u003c/strong\u003e, nothing changed on the menu: try again, or use Chromatic Manager.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/hide-prompt-tv.png\" width=\"320\" alt=\"Hide TV? A: hide, B: cancel\"\u003e\n\u003cimg src=\"docs/images/show-hidden-apps.png\" width=\"320\" alt=\"Other firmware: Show hidden apps\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-each-app-needs\"\u003eWhat each app needs\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eApp\u003c/th\u003e\n\u003cth\u003eNeeds\u003c/th\u003e\n\u003cth\u003eSet up with\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin\u003c/td\u003e\n\u003ctd\u003eWi-Fi, your Jellyfin server, a Quick Connect sign-in\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTV: Local Weather\u003c/td\u003e\n\u003ctd\u003eWi-Fi with internet (no Jellyfin server, no sign-in); a US place\u003c/td\u003e\n\u003ctd\u003eSettings › Weather location (until then: Orlando, FL)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTV: Live TV channels\u003c/td\u003e\n\u003ctd\u003eOne Live TV tuner on your Jellyfin server; Live TV allowed for the console's user\u003c/td\u003e\n\u003ctd\u003eSettings › Live TV channels, or \u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e's PC tools\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChromaTube\u003c/td\u003e\n\u003ctd\u003eA small server tool beside Jellyfin and one library named \"ChromaTube\"\u003c/td\u003e\n\u003ctd\u003eSettings › ChromaTube server, or \u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e's files and tool\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eSound in every app needs the console chip image 18.40 or 18.41\n(\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eInstall\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-what-stays-the-same\"\u003eWhat stays the same\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe official firmware, your games, saves, cartridges and flash carts are never touched by any app.\u003c/li\u003e\n\u003cli\u003eHolding a button while switching on still skips the menu; any restart that is not a power-on still goes straight\nto Games.\u003c/li\u003e\n\u003cli\u003eNo app needs a new sign-in on the console: TV's Live TV and ChromaTube use the console's existing Jellyfin sign-in;\nLocal Weather needs none.\u003c/li\u003e\n\u003cli\u003eThe Pocket link is still offered from the Jellyfin row only; TV and ChromaTube are on the Chromatic only.\u003c/li\u003e\n\u003cli\u003eThe apps record holds nothing personal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/TV-and-Local-Weather.md\"\u003eTV and Local Weather\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/TV-and-Local-Weather.md",
"title":"TV and Local Weather",
"html":"\u003ch1 id=\"h-tv-and-local-weather\"\u003eTV and Local Weather\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › TV and Local Weather\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/TV-and-Local-Weather.md:local-weather\"\u003eLocal Weather\u003c/a\u003e · \u003ca href=\"#docs/TV-and-Local-Weather.md:your-weather-location\"\u003eYour weather location\u003c/a\u003e ·\n\u003ca href=\"#docs/TV-and-Local-Weather.md:your-areas-map-and-radar-pages-a-location-pack\"\u003eLocation packs\u003c/a\u003e · \u003ca href=\"#docs/TV-and-Local-Weather.md:live-tv-optional\"\u003eLive TV (optional)\u003c/a\u003e ·\n\u003ca href=\"#docs/TV-and-Local-Weather.md:buttons\"\u003eButtons\u003c/a\u003e · \u003ca href=\"#docs/TV-and-Local-Weather.md:privacy\"\u003ePrivacy\u003c/a\u003e · \u003ca href=\"#docs/TV-and-Local-Weather.md:limits\"\u003eLimits\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eThe \u003cstrong\u003eTV\u003c/strong\u003e row is the app \u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision\u003c/a\u003e, built into the start-up menu.\nIts full guide, and PC tools for setting up live channels by hand, are in that repository.\u003c/p\u003e\n\u003ch2 id=\"h-local-weather\"\u003eLocal Weather\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eLocal Weather\u003c/strong\u003e is an early-1990s cable-style local forecast loop drawn by the console itself: current conditions,\nlatest observations, almanac (sun and moon), local and extended forecast, and a rain outlook (or radar), with music\nand an announcer, from free US National Weather Service data. It needs Wi-Fi with internet access, \u003cstrong\u003enot\u003c/strong\u003e your\nJellyfin server and no sign-in.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTV with Local Weather only\u003c/strong\u003e (the default): start-up menu › \u003cstrong\u003eTV\u003c/strong\u003e opens \u003cstrong\u003estraight to Local Weather\u003c/strong\u003e once Wi-Fi\nhas joined. \u003cstrong\u003eB\u003c/strong\u003e returns to the start-up menu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTV with Live TV channels\u003c/strong\u003e (see below): TV opens a channel list with \u003cstrong\u003eWX LOCAL WEATHER\u003c/strong\u003e as its first row.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/weather-current.png\" width=\"320\" alt=\"Local Weather: current conditions in Orlando, FL (sample data)\"\u003e\n\u003cimg src=\"docs/images/weather-regional.png\" width=\"320\" alt=\"Regional forecast: Florida (sample data)\"\u003e\n\u003cimg src=\"docs/images/weather-radar.png\" width=\"320\" alt=\"Current radar around Orlando (sample data)\"\u003e\u003c/p\u003e\n\u003cp\u003eEvery page of one loop for the built-in example place, Orlando, FL (drawn by the project's preview renderer from a\nrecorded set of weather replies):\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/weather-contact-sheet.png\" width=\"100%\" alt=\"Every Local Weather page for Orlando, FL (sample data)\"\u003e\u003c/p\u003e\n\u003cp\u003eWithout Wi-Fi, TV says \u003cstrong\u003eWi-Fi isn't set up yet\u003c/strong\u003e and \u003cstrong\u003eSelect\u003c/strong\u003e sets it up right there:\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/tv-weather-no-wifi.png\" width=\"320\" alt=\"TV: Wi-Fi isn\u0026#x27;t set up yet\"\u003e\n\u003cimg src=\"docs/images/tv-channel-list.png\" width=\"320\" alt=\"The TV channel list with Live TV (sample names)\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eFor fun only: \u003cstrong\u003enever use it for safety decisions\u003c/strong\u003e; follow official warnings.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-your-weather-location\"\u003eYour weather location\u003c/h2\u003e\n\u003cp\u003eUntil you choose a place, Local Weather shows the built-in default: \u003cstrong\u003eOrlando, FL\u003c/strong\u003e. To show your own:\nChromatic Manager › \u003cstrong\u003eSettings › Weather location\u003c/strong\u003e (text menu: \u003ccode\u003ew\u003c/code\u003e):\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eType a US ZIP code or \"City, ST\" (for example \u003ccode\u003e32801\u003c/code\u003e or \u003ccode\u003eOrlando, FL\u003c/code\u003e) and press \u003cstrong\u003eFind\u003c/strong\u003e. The match comes from a table on your PC (US Census Bureau\nGazetteer, public domain): nothing is sent yet.\u003c/li\u003e\n\u003cli\u003eChoose the place. The Manager asks the National Weather Service (the only service your place is sent to) for its\nforecast area, time zone and six nearest weather stations, and shows them.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSave and write to console\u003c/strong\u003e, then \u003cstrong\u003eApprove\u003c/strong\u003e. Two small records of their own on the console hold the place;\nyour Wi-Fi and Jellyfin set-up are not touched. The whole flash is checked on the chip.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eUse default (Orlando, FL)\u003c/strong\u003e erases your place (and its area pages) again. Installing, updating, downgrading or switching off the start-up\nmenu keeps the place; \u003cstrong\u003eRemove menu\u003c/strong\u003e and \u003cstrong\u003eRestore original\u003c/strong\u003e erase it. If the console lost the place (for example\nafter a removal), the next install writes the PC's saved copy back in the same job.\u003c/p\u003e\n\u003ch3 id=\"h-your-areas-map-and-radar-pages-a-location-pack\"\u003eYour area's map and radar pages: a location pack\u003c/h3\u003e\n\u003cp\u003eOn its own, a place gets its conditions, forecasts, almanac and nearby stations, with a \u003cstrong\u003eRain Outlook\u003c/strong\u003e page where\nthe map and radar pages would be (a place in Florida keeps the built-in Florida map pages, and the radar near\nOrlando). For your own area's maps and radar, add its \u003cstrong\u003earea pages\u003c/strong\u003e, a \"location pack\" (start-up menu 1.6.5 or\nnewer):\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eIn \u003cstrong\u003eSettings › Weather location\u003c/strong\u003e, after choosing your place, press \u003cstrong\u003eMake the area pages\u003c/strong\u003e. Chromatic Manager asks\nthe National Weather Service about the towns near your place (about a minute; for the chosen area only) and makes a\nsmall pack (a few KB) with:\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRegional Forecast\u003c/strong\u003e: your state's outline with today's highs for your place and up to five larger towns;\u003c/li\u003e\n\u003cli\u003ea \u003cstrong\u003eclose-up\u003c/strong\u003e of your area with nearby towns;\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCurrent Radar\u003c/strong\u003e: the nearest weather service radar, around your place, with town labels.\u003c/li\u003e\n\u003c/ul\u003e\u003c/li\u003e\n\u003cli\u003eA preview of every weather page, drawn by the console's own drawing code, appears in the window (hidden while\nprivate details are hidden; the figures show \u003ccode\u003e--\u003c/code\u003e until the console fetches them).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSave and write to console\u003c/strong\u003e, then \u003cstrong\u003eApprove\u003c/strong\u003e: the place and its pages are written together and checked. They\nstay through updates of the start-up menu; \u003cstrong\u003eUse default (Orlando, FL)\u003c/strong\u003e removes both.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-location-pack.png\" width=\"600\" alt=\"Chromatic Manager: Weather location with the area pages made (example place: Denver, CO)\"\u003e\u003c/p\u003e\n\u003cp\u003eThe pages a pack gives Orlando, FL (the built-in place, made here by the tool as an example; the figures appear when\nthe console fetches them):\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/location-pack-contact-sheet.png\" width=\"100%\" alt=\"Every Local Weather page from a location pack for Orlando, FL, before the first fetch\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSharing pack files.\u003c/strong\u003e \u003cstrong\u003eExport pages...\u003c/strong\u003e saves the pack as a \u003ccode\u003e.pjlp\u003c/code\u003e file; \u003cstrong\u003eImport pages...\u003c/strong\u003e uses one, for the same\nplace only. A pack file names its place: share it only if you want to. Chromatic Manager and the console check every\npack in full and ignore a damaged one (the console then shows the place without the map and radar pages), but \u003cstrong\u003eonly\nimport packs from people you trust\u003c/strong\u003e. Without the window: \u003ccode\u003epy -3 scripts\\make_location_pack.py \"Orlando, FL\" orlando.pjlp\u003c/code\u003e\nmakes the same file (Python 3 and a connection to the US weather service only).\u003c/p\u003e\n\u003cp\u003eThe map pages are made by a program, not drawn by hand, so a crowded state can show fewer towns than Orlando's built-in\npages; town names and state outlines come from US Census Bureau data bundled with Jellymatic (public domain).\u003c/p\u003e\n\u003ch3 id=\"h-the-first-install-asks\"\u003eThe first install asks\u003c/h3\u003e\n\u003cp\u003eWhen Chromatic Manager installs the start-up menu on a console for the first time, it asks \u003cstrong\u003eAdd Local Weather?\u003c/strong\u003e\nbefore the install's \u003cstrong\u003eApprove\u003c/strong\u003e: \u003cstrong\u003eChoose my place...\u003c/strong\u003e (a ZIP code or \"City, ST\", then it offers to make the area\npages), \u003cstrong\u003eUse Orlando, FL\u003c/strong\u003e, or \u003cstrong\u003eSkip Local Weather\u003c/strong\u003e (the TV row stays hidden; turn it on any time in Settings ›\nApps). Your answer is written by that same install, which says what it will write first. Updates do not ask again.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-add-local-weather.png\" width=\"520\" alt=\"Add Local Weather? Choose my place, Use Orlando, FL, or Skip Local Weather\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-live-tv-optional\"\u003eLive TV (optional)\u003c/h2\u003e\n\u003cp\u003eYour Jellyfin server's built-in Live TV can add live channels: one tuner reads a channel list built from public\niptv-org lists (free channels only; pay-TV re-streams are never included), and your server converts the channel you\nwatch into the console's small format. Nothing is installed on the console.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIn Chromatic Manager:\u003c/strong\u003e \u003cstrong\u003eSettings › Live TV channels\u003c/strong\u003e (text menu: \u003ccode\u003el\u003c/code\u003e):\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eTick the channel groups you want (English cartoons, US weather, US news, classic TV).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChoose...\u003c/strong\u003e the folder on your PC that holds your Jellyfin library folders (for example a network share).\u003c/li\u003e\n\u003cli\u003eSign in for this job: the saved sign-in (only if it is an administrator and you tick it), or type an administrator's\nname and password. A typed password is kept only in memory and that sign-in is signed out at the end of the job.\nNo other device or session is ever signed out.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDry run\u003c/strong\u003e only reads: it shows how many channels, which library folder the list file would go into (a new\nfolder \"ChromaticTV\") and the exact tuner that would be added.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAdd\u003c/strong\u003e and \u003cstrong\u003eApprove\u003c/strong\u003e: a backup of your Live TV settings first; the list file is copied; the tuner is added only\nonce the server can see the file; then a check that nothing else changed.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSettings › Apps\u003c/strong\u003e: choose \"Local Weather and your Jellyfin server's Live TV channels\".\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-livetv.png\" width=\"600\" alt=\"Chromatic Manager: Live TV channels, a dry run (private fields masked)\"\u003e\u003c/p\u003e\n\u003cp\u003eThe tuner is named \"Chromavision Live TV (added by Chromavision tools)\" and allows at most 2 channels at once. The\nchannels also show under Live TV in your other Jellyfin apps. Chromavision's PC tools can do the same by hand, with\nyour own choice of channels, and recognise a tuner the Manager added (and the reverse)\n(\u003ca href=\"https://github.com/ChaoticSPARTAN1/Chromavision/blob/main/docs/Live-TV-setup.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision: Live TV set-up\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eUndo:\u003c/strong\u003e Settings › Live TV channels › \u003cstrong\u003eRemove\u003c/strong\u003e and Approve. It deletes exactly that tuner and the list file it\nwrote, and compares your Live TV settings with the backup. Then choose \"Local Weather only\" in Apps.\u003c/p\u003e\n\u003ch2 id=\"h-buttons\"\u003eButtons\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eButtons\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eLocal Weather\u003c/td\u003e\n\u003ctd\u003ePages turn by themselves · \u003cstrong\u003eB\u003c/strong\u003e back (to the start-up menu, or to the channel list with Live TV) · with Live TV: \u003cstrong\u003eUp/Down\u003c/strong\u003e to the first/last channel\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChannel list (with Live TV)\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eUp/Down\u003c/strong\u003e move · \u003cstrong\u003eA\u003c/strong\u003e watch · \u003cstrong\u003eB\u003c/strong\u003e back to the start-up menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWatching a channel\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eUp/Down\u003c/strong\u003e next/previous channel (it tunes 1.5 s after your last press) · \u003cstrong\u003eA\u003c/strong\u003e, \u003cstrong\u003eStart\u003c/strong\u003e or \u003cstrong\u003eSelect\u003c/strong\u003e show the channel name · \u003cstrong\u003eB\u003c/strong\u003e back to the list\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eStart-up menu, TV focused\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eSelect\u003c/strong\u003e asks \"Hide TV?\" (\u003ca href=\"#docs/Apps-on-the-start-up-menu.md:on-the-console\"\u003eApps\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eA channel can show \u003cstrong\u003eNo signal\u003c/strong\u003e (it refused, ended, or sent no picture for 20 s): free channels come and go. Every\nway out closes the stream on the server. If Local Weather cannot open, the TV screen says \u003cstrong\u003eLocal Weather did not\nopen\u003c/strong\u003e with the reason; \u003cstrong\u003eB\u003c/strong\u003e returns.\u003c/p\u003e\n\u003ch2 id=\"h-privacy\"\u003ePrivacy\u003c/h2\u003e\n\u003cp\u003eYour weather location stays on your PC and your console and is sent only to the National Weather Service: making\narea pages asks it about the chosen area only (and checks one radar picture on its map server). The place look-up and\nthe maps use US Census Bureau data bundled with Jellymatic, so nothing else is asked. The console's clock also asks a\npublic time service (pool.ntp.org) for the time; it sends no location. Chromatic\nManager's status and logs say \"your location\", never the place. TV writes no watch history. Nothing about what you\nwatch is sent anywhere else.\u003c/p\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eLocal Weather covers US places only. The radar page and the regional maps come from the built-in Orlando area or from\nyour place's location pack; for a place without a pack a Rain Outlook page takes their place.\u003c/li\u003e\n\u003cli\u003eOne live channel at a time; no programme guide yet; no pause or rewind on live channels.\u003c/li\u003e\n\u003cli\u003eSound needs the console chip image 18.40 or 18.41.\u003c/li\u003e\n\u003cli\u003eNot on the Analogue Pocket.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/ChromaTube.md\"\u003eChromaTube\u003c/a\u003e\u003c/p\u003e"
},

"title":"ChromaTube",
"html":"\u003ch1 id=\"h-chromatube\"\u003eChromaTube\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › ChromaTube\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/ChromaTube.md:what-it-is\"\u003eWhat it is\u003c/a\u003e · \u003ca href=\"#docs/ChromaTube.md:before-you-set-it-up\"\u003eBefore you set it up\u003c/a\u003e · \u003ca href=\"#docs/ChromaTube.md:set-it-up\"\u003eSet it up\u003c/a\u003e ·\n\u003ca href=\"#docs/ChromaTube.md:using-it\"\u003eUsing it\u003c/a\u003e · \u003ca href=\"#docs/ChromaTube.md:undo\"\u003eUndo\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cp\u003eThe optional \u003cstrong\u003eChromaTube\u003c/strong\u003e row is the app \u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e, built into the\nstart-up menu and \u003cstrong\u003eoff until you switch it on\u003c/strong\u003e: the newest videos of the channels you choose, played through your own\nJellyfin server. A small third-party tool beside Jellyfin lists those videos as one Jellyfin library named \"ChromaTube\";\nnothing is downloaded ahead or kept, and the server converts the one video you play into the console's small format,\nlike a film.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromatube-details.png\" width=\"320\" alt=\"ChromaTube: a video\u0026#x27;s page (sample data)\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChromaTube is unofficial: it is not made, affiliated with or endorsed by YouTube or Google.\u003c/strong\u003e YouTube is a trademark\nof Google LLC.\u003c/p\u003e\n\u003ch2 id=\"h-before-you-set-it-up\"\u003eBefore you set it up\u003c/h2\u003e\n\u003cp\u003eThe server tool ChromaTube uses, \u003cstrong\u003eytdlp2STRM\u003c/strong\u003e (it fetches videos with yt-dlp), \u003cstrong\u003econflicts with YouTube's Terms of\nService\u003c/strong\u003e. Setting it up is \u003cstrong\u003eyour own private choice\u003c/strong\u003e; this project does not ship, host or run it for you. Nothing\nelse on the start-up menu needs it. Read\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube/blob/main/docs/Before-you-start.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube: Before you start\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-set-it-up\"\u003eSet it up\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eIn Chromatic Manager:\u003c/strong\u003e \u003cstrong\u003eSettings › ChromaTube server\u003c/strong\u003e (text menu: \u003ccode\u003ey\u003c/code\u003e); tick \"I understand\" first.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eFill in your Docker machine's home-network address, a \u003cstrong\u003emedia folder\u003c/strong\u003e on that machine that your Jellyfin container\ncan already see (but \u003cstrong\u003enot\u003c/strong\u003e inside one of your library folders: then Jellyfin needs no restart and no new mount),\nthe folder where you keep the settings files, and your channels (one a line, like \u003ccode\u003ehttps://www.youtube.com/@name\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSave files...\u003c/strong\u003e writes \u003ccode\u003edocker-compose.yml\u003c/code\u003e and four settings files into a folder you choose on your PC.\n\u003ccode\u003econfig.json\u003c/code\u003e gets the tool's \u003cstrong\u003epage sign-in\u003c/strong\u003e, which is \u003cstrong\u003erequired\u003c/strong\u003e: a random user name and password that Chromatic\nManager makes for you. It is stored only in \u003ccode\u003econfig.json\u003c/code\u003e and in a private copy on your PC (Chromatic Manager's file\n\u003ccode\u003echromatube-server-signin.json\u003c/code\u003e); the window never shows it (open either file if you need to read it). Saving again\nkeeps the same sign-in. Never share \u003ccode\u003econfig.json\u003c/code\u003e or put it in Git. Copy the five files to the settings folder on the\nDocker machine.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRequired:\u003c/strong\u003e on the Docker machine's firewall, allow port \u003cstrong\u003e5005\u003c/strong\u003e only from your Jellyfin server; allow your PC\nonly while you run \u003cstrong\u003eCheck it answers\u003c/strong\u003e or open the tool's page, then remove that rule. Never forward 5005 on your\nrouter. The firewall is the real protection: the sign-in guards only the tool's settings pages.\u003c/li\u003e\n\u003cli\u003eIn your Docker app, create a project named \u003ccode\u003echromatube\u003c/code\u003e from \u003ccode\u003edocker-compose.yml\u003c/code\u003e (or run\n\u003ccode\u003edocker compose -p chromatube up -d\u003c/code\u003e in that folder). The Manager never runs Docker for you.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCheck it answers\u003c/strong\u003e (with the temporary firewall rule for your PC): it passes only when the tool's settings page\n\u003cstrong\u003erefuses\u003c/strong\u003e a visitor without the sign-in and \u003cstrong\u003eanswers\u003c/strong\u003e with it (the private copy on your PC). If it says the tool\nanswers without a sign-in, copy the saved \u003ccode\u003econfig.json\u003c/code\u003e to the Docker machine again and restart the project. Then\nremove the firewall rule for your PC.\u003c/li\u003e\n\u003cli\u003eSign in as an administrator for this job (a typed password is kept in memory only and signed out at the end; no\nother device is ever signed out), press \u003cstrong\u003eFind it\u003c/strong\u003e (or type the folder as Jellyfin sees it), \u003cstrong\u003eDry run\u003c/strong\u003e, then\n\u003cstrong\u003eAdd library\u003c/strong\u003e and \u003cstrong\u003eApprove\u003c/strong\u003e. One library named \"ChromaTube\" is added; your other libraries stay exactly as\nthey were.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSettings › Apps\u003c/strong\u003e: switch ChromaTube on.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-chromatube-saved.png\" width=\"600\" alt=\"Chromatic Manager: ChromaTube server after Save files (private fields masked; the sign-in is never shown)\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKeep it safe (required):\u003c/strong\u003e the tool's page can change its settings, so it \u003cstrong\u003emust have a sign-in\u003c/strong\u003e: both\n\u003ccode\u003eytdlp2strm_web_username\u003c/code\u003e and \u003ccode\u003eytdlp2strm_web_password\u003c/code\u003e set in \u003ccode\u003econfig.json\u003c/code\u003e (Chromatic Manager's Save files, or\nChromaTube's \u003ccode\u003emake_server_config.py\u003c/code\u003e, writes a random pair; keep the file private, never commit or share it). \u003cstrong\u003eWhat\nthe sign-in does not cover:\u003c/strong\u003e in the pinned version it protects the settings pages only. The tool's live command\nchannel (Socket.IO, used by its page to run its own command line) has no sign-in and accepts connections from any web\npage, and it can start programs inside the container, so anything that can reach port 5005 (including a web page open\nin a browser on an allowed computer) could use it. \u003cstrong\u003eThe firewall rule is the real protection:\u003c/strong\u003e allow port \u003cstrong\u003e5005\u003c/strong\u003e\non that machine's firewall \u003cstrong\u003eonly from your Jellyfin server\u003c/strong\u003e, with no port forwarding; allow your PC only while you run\nCheck it answers or open the page, then remove that rule. The image is pinned by its digest and never changes by\nitself; ChromaTube's compose file mounts the settings read-only and allows no privilege escalation (if the tool cannot\nread its settings, check the owner and permissions of \u003ccode\u003econfig.json\u003c/code\u003e on the Docker machine); \u003cstrong\u003eno YouTube account or\ncookies\u003c/strong\u003e are used. ChromaTube must not be used for paid, members-only or\nDRM-protected videos. By hand, without the Manager: ChromaTube's\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube/blob/main/docs/Server-setup.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eServer set-up\u003c/a\u003e and\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube/blob/main/docs/Add-the-library.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eAdd the library\u003c/a\u003e; its tool and the\nManager recognise each other's library record.\u003c/p\u003e\n\u003ch2 id=\"h-using-it\"\u003eUsing it\u003c/h2\u003e\n\u003cp\u003eStart-up menu › \u003cstrong\u003eChromaTube\u003c/strong\u003e › a channel › a video › \u003cstrong\u003ePlay\u003c/strong\u003e. \u003cstrong\u003eB\u003c/strong\u003e goes back; at the channels it returns to the\nstart-up menu. Videos play as one stream from the beginning (no seeking or resume). If the server has no library named\nexactly \"ChromaTube\", the row says \u003cstrong\u003eChromaTube isn't set up on your server\u003c/strong\u003e.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromatube-not-set-up.png\" width=\"320\" alt=\"ChromaTube isn\u0026#x27;t set up on your server. Set it up in Chromatic Manager: Settings, ChromaTube server\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSelect\u003c/strong\u003e on the start-up menu's\nChromaTube row asks \"Hide ChromaTube?\".\u003c/p\u003e\n\u003cp\u003eOpen ChromaTube videos from the \u003cstrong\u003eChromaTube\u003c/strong\u003e row: the library also shows in the Jellyfin row, but a ChromaTube video\nopened there plays full size without sound.\u003c/p\u003e\n\u003ch2 id=\"h-undo\"\u003eUndo\u003c/h2\u003e\n\u003cp\u003eSettings › ChromaTube server › \u003cstrong\u003eRemove library\u003c/strong\u003e and Approve (the library only; its files are not touched). A library\nthis PC did not add is removed only when its folder is named ChromaTube and holds channel folders, after you confirm it\nis yours. In your\nDocker app, stop and delete the \u003ccode\u003echromatube\u003c/code\u003e project; delete the settings folder and the ChromaTube media folder. Then\nswitch ChromaTube off in Settings › Apps. Your Jellyfin server is otherwise exactly as before\n(\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube/blob/main/docs/Undo-everything.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube: Undo everything\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Hosting-Jellyfin.md\"\u003eHosting Jellyfin\u003c/a\u003e\u003c/p\u003e"
},
