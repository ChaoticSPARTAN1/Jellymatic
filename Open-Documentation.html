"title":"Start here",
"html":"\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/readme/jellymatic-banner.png\" width=\"100%\" alt=\"Jellymatic: Jellyfin on your ModRetro Chromatic. A pixel-art Chromatic handheld next to a red Chromatic Manager window reading Games + Jellyfin + Pocket link\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  A start-up menu for the Chromatic that keeps your games exactly as they are, a Jellyfin app,\n  a link to the Analogue Pocket, and a PC tool that installs, checks and undoes everything.\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  \u003cb\u003eRead the guide:\u003c/b\u003e \u003ca href=\"docs/Jellymatic-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/Jellymatic-Guide.pdf\u003c/a\u003e (opens right on GitHub),\n  or download and double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e for the interactive version.\n\u003c/p\u003e\n\u003ch2 id=\"h-safety\"\u003eSafety\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eJellymatic is an independent project, not affiliated with ModRetro or the Jellyfin project.\u003c/strong\u003e\nIt is not made, endorsed or supported by ModRetro, Analogue or the Jellyfin project. \"Jellyfin\" is a\ntrademark of its owners; \"ModRetro\" and \"Chromatic\" are trademarks of ModRetro, Inc.; they are used here\nonly to say what this project works with. \u003cstrong\u003eUse it at your own risk.\u003c/strong\u003e It changes firmware on your\nconsole. Support is not guaranteed.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhat it does\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eStart-up menu\u003c/strong\u003e (ESP32 \"launcher\")\u003c/td\u003e\n\u003ctd\u003eShows \u003cstrong\u003eGames\u003c/strong\u003e, \u003cstrong\u003eJellyfin\u003c/strong\u003e and \u003cstrong\u003eOther firmware\u003c/strong\u003e when you switch the console on. Games is always there and starts the console's own, untouched firmware.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eJellyfin app\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBrowse your Jellyfin library and play video with sound on the Chromatic, over Wi-Fi. Wi-Fi and the Jellyfin sign-in are set up on the console itself.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePocket link\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAn updated console chip (FPGA) image, 18.41, that lets the Chromatic feed an Analogue Pocket over a link cable. The Pocket side is \u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eChromatic Manager\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eA Windows program (window, text menu, local API and MCP server) that installs, updates, checks, backs up and removes all of the above, one Approve at a time.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eRemote Pilot\u003c/strong\u003e (bundled)\u003c/td\u003e\n\u003ctd\u003eSee and press the console's menus from your PC, in your browser or in the Manager's own tab. The full tool is \u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/startup-menu.png\" width=\"320\" alt=\"The start-up menu: Games, Jellyfin, Other firmware\"\u003e\n  \u003cimg src=\"docs/images/player-details.png\" width=\"320\" alt=\"The Jellyfin app on the console (sample data)\"\u003e\n  \u003cimg src=\"docs/images/pocket-link.png\" width=\"320\" alt=\"The Pocket link screen\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/manager-home.png\" width=\"480\" alt=\"Chromatic Manager: up to date\"\u003e\n\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eAll pictures are drawn by the project's own preview renderers with made-up sample data.\u003c/em\u003e\u003c/p\u003e\n\u003ch2 id=\"h-remote-pilot-your-chromatic-on-your-pc-screen\"\u003eRemote Pilot: your Chromatic on your PC screen\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eRemote Pilot\u003c/strong\u003e\u003c/a\u003e lets you \u003cstrong\u003esee and control the\nChromatic from your PC\u003c/strong\u003e: its live screen, its buttons, its logs and screenshots, over the USB cable or\nyour home Wi-Fi. A copy is bundled in \u003ccode\u003eremote-pilot/\u003c/code\u003e so the Manager's \u003cstrong\u003eRemote Pilot\u003c/strong\u003e tab works out of\nthe box.\u003c/p\u003e\n\u003cp\u003eWhy it is included:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEasier set-up and troubleshooting\u003c/strong\u003e: read the console's menus and messages on a big screen instead of\nsquinting at the handheld, and press its buttons with the mouse.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClean bug reports\u003c/strong\u003e: save screenshots and logs with addresses, network names and codes masked.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI assistants, safely\u003c/strong\u003e: Claude, Codex or another assistant can test or demo the console through\nRemote Pilot's command line (it presses buttons and reads the screen; it cannot change firmware).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRemote demos\u003c/strong\u003e: show the console's screens to someone else from your PC.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIt is \u003cstrong\u003eoptional\u003c/strong\u003e, stays \u003cstrong\u003eon your own PC and network\u003c/strong\u003e by default, and is \u003cstrong\u003enever needed\u003c/strong\u003e to watch\nJellyfin. Full documentation: \u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e and\n\u003ca href=\"#docs/Remote-Pilot.md\"\u003edocs/Remote-Pilot.md\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-quick-start-plain-english\"\u003eQuick start (plain English)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eRead \u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e.\u003c/strong\u003e It explains why your games keep working and what\nis changed on the console.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGet the tools\u003c/strong\u003e (\u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e): a Windows PC, Python 3.12+, the USB cable,\nopenFPGALoader with GWU2X support (for the first backup), and your Chromatic switched \u003cstrong\u003eon\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOpen Chromatic Manager\u003c/strong\u003e: double-click \u003ccode\u003eChromatic-Manager-Window.cmd\u003c/code\u003e (first run sets everything up;\nsee \u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall with Chromatic Manager\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePress the one big button\u003c/strong\u003e the Manager shows (Install), then \u003cstrong\u003eApprove\u003c/strong\u003e. The first time it takes a\nfull backup of both chips (about 15 minutes, nothing written), then writes the start-up menu, reads\nevery byte back and checks the console starts. The backup's second copy is usually on the same disk;\nput it on another disk or a USB stick for real safety (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003eInstall\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOn the console\u003c/strong\u003e: switch it off and on, choose \u003cstrong\u003eJellyfin\u003c/strong\u003e, press \u003cstrong\u003eSelect\u003c/strong\u003e for setup, add your\nWi-Fi and sign in to Jellyfin with \u003cstrong\u003eQuick Connect\u003c/strong\u003e\n(\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePlay\u003c/strong\u003e: choose a film or episode and press A (\u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin\u003c/a\u003e).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eSomething went wrong? \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e explains what the Manager does by itself, and how to put\neverything back, including with ModRetro's \u003cstrong\u003eofficial\u003c/strong\u003e update tool.\u003c/p\u003e\n\u003ch2 id=\"h-documentation-wiki\"\u003eDocumentation (wiki)\u003c/h2\u003e\n\u003cp\u003eStart at \u003cstrong\u003e\u003ca href=\"#docs/Home.md\"\u003edocs/Home.md\u003c/a\u003e\u003c/strong\u003e. Pages: What you need · Before you start · Install with Chromatic\nManager · First run on the console · Using Jellyfin on the Chromatic · Hosting Jellyfin · Pocket link ·\nRemote Pilot · Recovery · FAQ · Building from source · AI prompt examples · Credits \u0026amp; licences.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAs one PDF:\u003c/strong\u003e \u003ca href=\"docs/Jellymatic-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/Jellymatic-Guide.pdf\u003c/a\u003e holds every page, with a clickable table\nof contents; GitHub shows it right in the browser.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOffline:\u003c/strong\u003e download or clone this repository, then double-click \u003cstrong\u003e\u003ccode\u003eOpen-Documentation.html\u003c/code\u003e\u003c/strong\u003e in its main\nfolder. It opens every page above in your browser, with pictures, without a server or an internet\nconnection (keep it in the repository folder: it loads the pictures from \u003ccode\u003edocs/\u003c/code\u003e). It is built from the\nMarkdown pages by \u003ccode\u003escripts/build_docs_html.py\u003c/code\u003e (the PDF by \u003ccode\u003escripts/build_docs_pdf.py\u003c/code\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-what-is-in-this-repository\"\u003eWhat is in this repository\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003echromatic/launcher/     start-up menu (ESP-IDF 5.3 app, custom bootloader, host tests)\nchromatic/jellyfin/     the console's Jellyfin app (shared C, host-tested)\nchromatic/fpga-media/   console chip (FPGA) sound hooks, Verilog + test benches\nrtl/                    Pocket link bridge and link-port RTL + test benches\nfpga/images/            the exact sources and build receipts of the reviewed FPGA images 18.40 and 18.41\nscripts/                Chromatic Manager (GUI, text menu, API, MCP), FPGA staging, tests, preview renderer\nremote-pilot/           Remote Pilot receiver + web viewer, Chromatic package and presets\npocket/, shared/        the small shared parts the launcher uses (link framing, fonts)\ndocs/                   the wiki\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eNot in this repository:\u003c/strong\u003e ModRetro's firmware or updater, any console backup, built firmware images,\nthe Gowin FPGA tools or licence, and anything personal. The start-up menu you can build yourself. \u003cstrong\u003eJellyfin\nsound and the Pocket link need the official release files\u003c/strong\u003e of the console chip (FPGA) images 18.40 and\n18.41 (\u003ccode\u003eevt1_x2.fs\u003c/code\u003e and \u003ccode\u003eevt1_x2.bin\u003c/code\u003e), published separately as release assets: a build of your own will\nnot match the SHA-256 pins the Manager checks, so it is refused (see \u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e).\nYour own files (Wi-Fi list, Jellyfin sign-in, backups) live in a per-user folder, \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e,\ncreated on first run and never part of Git.\u003c/p\u003e\n\u003ch2 id=\"h-sibling-projects\"\u003eSibling projects\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e: Jellyfin on the Analogue Pocket (the Pocket side of the Pocket link).\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e: this project.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e: Remote Pilot, the full PC remote-control tool.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-licence\"\u003eLicence\u003c/h2\u003e\n\u003cp\u003eJellymatic is free software: \u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), with additional terms under GPLv3\nsection 7 (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e): keep the author attribution \"ChaoticSPARTAN1\" (7(b)),\nmark modified versions as modified (7(c)), and additional permissions for FPGA bitstreams that combine\nJellymatic's RTL with ModRetro's design and Gowin IP, and for linking the console firmware with Espressif's\nbinary-only Wi-Fi/PHY libraries and the ESP32 ROM.\nParts made by others keep their own licences; see \u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e, \u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e\nand \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-contributing-and-security\"\u003eContributing and security\u003c/h2\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome: \u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e. To report a\nsecurity problem privately: \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e. Never post Wi-Fi details, server addresses, tokens\nor logs with addresses.\u003c/p\u003e\n\u003ch2 id=\"h-credits\"\u003eCredits\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. Built on ModRetro's open-source Chromatic FPGA source (GPL-3.0),\nEspressif ESP-IDF (Apache-2.0), the MiSTer core (\"Gameboy_MiSTer\"), and the Jellyfin logo (CC BY-SA 4.0, the\nJellyfin contributors). Small parts come from \u003cstrong\u003eShiny Relay\u003c/strong\u003e by Shiny Gen (GPL-3.0): its \u003ccode\u003euart_tx_busy\u003c/code\u003e fix in the\n18.41 image and the request-once status channel pattern of the Pocket link bridge. Thanks also to the authors of\nChromatiX, whose open documentation was read as a reference. Full list: \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e"
},

"path":"docs/Home.md",
"title":"Wiki home",
"html":"\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/jellymatic-icon.png\" width=\"132\" alt=\"Pixel Chromatic with the Jellyfin logo\"\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/jellymatic-logo.png\" width=\"444\" alt=\"Jellymatic\"\u003e\u003c/p\u003e\n\u003ch1 id=\"h-jellymatic-wiki\"\u003eJellymatic wiki\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eJellyfin on your ModRetro Chromatic\u003c/strong\u003e, with a start-up menu that keeps your games exactly as they were.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRead it as one PDF:\u003c/strong\u003e \u003ca href=\"docs/Jellymatic-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic-Guide.pdf\u003c/a\u003e (opens right on GitHub). \u003cstrong\u003eOr offline:\u003c/strong\u003e\ndownload or clone the repository, then double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e in its main folder. Every\npage here opens in your browser, with pictures, with no internet connection needed.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eJellymatic is an independent project, not affiliated with ModRetro or the Jellyfin project. Use it at\nyour own risk; support is not guaranteed. \"Jellyfin\", \"ModRetro\" and \"Chromatic\" are trademarks of their\nowners, used only to say what this works with.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-contents\"\u003eContents\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePage\u003c/th\u003e\n\u003cth\u003eRead it when\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBefore anything else: the console, the PC, the cable, the server\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to know why your games keep working and what changes\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall with Chromatic Manager\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou are ready to install or update\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWi-Fi, Jellyfin sign-in, Pocket link set-up on the console\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin on the Chromatic\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBrowsing and playing\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Hosting-Jellyfin.md\"\u003eHosting Jellyfin\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYour server is not reachable over Wi-Fi yet\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou have an Analogue Pocket and a link cable\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Remote-Pilot.md\"\u003eRemote Pilot\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to see and press the console's menus from the PC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eSomething went wrong, or you want to undo everything\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eShort answers\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Building-from-source.md\"\u003eBuilding from source\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to build the start-up menu, the FPGA images or the Manager yourself\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/AI-prompt-examples.md\"\u003eAI prompt examples\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou use Claude, Codex or another assistant with the Manager\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWho made what, and under which licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Design-notes.md\"\u003eDesign notes\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou read the code and meet a reference to an internal note\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-in-one-picture\"\u003eIn one picture\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003e Switch on ──► start-up menu ──┬─► Games ............ the console's own firmware, untouched (always there)\n                               ├─► Jellyfin ......... browse and play over Wi-Fi (Select: set-up)\n                               │      └─► Pocket link  feed an Analogue Pocket over a link cable\n                               └─► Other firmware ... the stock firmware, listed and protected\n Hold any button while switching on ──► straight to Games, no menu\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/startup-menu.png\" width=\"320\" alt=\"The start-up menu\"\u003e\u003c/p\u003e\n\u003cp\u003eThe PC side is \u003cstrong\u003eChromatic Manager\u003c/strong\u003e: one window with one main button at a time. It backs up the\nconsole, installs or updates the start-up menu, reads every byte back, and can undo all of it.\u003c/p\u003e"
},

"path":"docs/What-you-need.md",
"title":"What you need",
"html":"\u003ch1 id=\"h-what-you-need\"\u003eWhat you need\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › What you need\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/What-you-need.md:for-the-start-up-menu-and-jellyfin\"\u003eFor the start-up menu and Jellyfin\u003c/a\u003e ·\n\u003ca href=\"#docs/What-you-need.md:for-jellyfin-sound-and-the-pocket-link\"\u003eFor Jellyfin sound and the Pocket link\u003c/a\u003e ·\n\u003ca href=\"#docs/What-you-need.md:not-needed\"\u003eNot needed\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-for-the-start-up-menu-and-jellyfin\"\u003eFor the start-up menu and Jellyfin\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eModRetro Chromatic\u003c/strong\u003e with its \u003cstrong\u003eofficial firmware\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe start-up menu sits next to it\u003c/td\u003e\n\u003ctd\u003eTested with official MCU firmware v4.6 and FPGA v18.14. The Manager reads the console first and \u003cstrong\u003erefuses\u003c/strong\u003e layouts or firmware it does not know, rather than guess.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003ecartridge\u003c/strong\u003e in the console\u003c/td\u003e\n\u003ctd\u003eThe menu draws over a running cartridge\u003c/td\u003e\n\u003ctd\u003eAny working cartridge or flash cart. Without one, the console simply starts as normal.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eWindows 10 or 11 PC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eChromatic Manager runs there\u003c/td\u003e\n\u003ctd\u003emacOS/Linux: the code is Python and mostly portable, but only Windows is tested.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePython 3.12 or newer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eRuns Chromatic Manager from source\u003c/td\u003e\n\u003ctd\u003eFrom \u003ca href=\"https://www.python.org/downloads/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003epython.org\u003c/a\u003e. \u003ccode\u003eSetup-Jellymatic.ps1\u003c/code\u003e installs the rest.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eUSB-C data cable\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003ePC ↔ console\u003c/td\u003e\n\u003ctd\u003eThe console must be switched \u003cstrong\u003eon\u003c/strong\u003e while the Manager works.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eJellyfin server\u003c/strong\u003e on your network, with \u003cstrong\u003eQuick Connect\u003c/strong\u003e turned on\u003c/td\u003e\n\u003ctd\u003eThe console signs in with its own code\u003c/td\u003e\n\u003ctd\u003eSee \u003ca href=\"#docs/Hosting-Jellyfin.md\"\u003eHosting Jellyfin\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e2.4 GHz Wi-Fi\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe console's radio\u003c/td\u003e\n\u003ctd\u003eA phone hotspot works. Hotel-style sign-in pages are not supported.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe \u003cstrong\u003estart-up menu image\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eWhat the Manager installs\u003c/td\u003e\n\u003ctd\u003eBuild it (\u003ca href=\"#docs/Building-from-source.md\"\u003eBuilding from source\u003c/a\u003e) or copy it from a release into \u003ccode\u003erelease/launcher/\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eopenFPGALoader\u003c/strong\u003e with \u003cstrong\u003eGWU2X\u003c/strong\u003e cable support\u003c/td\u003e\n\u003ctd\u003eThe first \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003efull backup\u003c/a\u003e reads the console chip (FPGA) too, over the console's USB\u003c/td\u003e\n\u003ctd\u003eNot shipped with Jellymatic (Apache-2.0). Ready-made downloads often lack GWU2X support, so it usually has to be \u003cstrong\u003ebuilt\u003c/strong\u003e: see ModRetro's own instructions in its \u003ca href=\"https://github.com/ModRetro/oss-chromatic-console-fpga#flashing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromatic FPGA source\u003c/a\u003e (README, \"Flashing\": openFPGALoader must be compiled with GWU2X cable support) and \u003ca href=\"https://trabucayre.github.io/openFPGALoader/guide/install.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eopenFPGALoader's build guide\u003c/a\u003e. Put it at \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\tools\\openFPGALoader\\openFPGALoader.exe\u003c/code\u003e or set \u003ccode\u003eJELLYMATIC_OPENFPGALOADER\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe Gowin \u003cstrong\u003eGWU2X USB driver\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe JTAG bridge openFPGALoader talks to\u003c/td\u003e\n\u003ctd\u003eUsually installed by ModRetro's official updater.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-for-jellyfin-sound-and-the-pocket-link\"\u003eFor Jellyfin sound and the Pocket link\u003c/h2\u003e\n\u003cp\u003eThese change the console's \u003cstrong\u003egame chip (FPGA)\u003c/strong\u003e. They are optional; the start-up menu and silent video\nwork without them.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003efull backup of your console\u003c/strong\u003e (both chips)\u003c/td\u003e\n\u003ctd\u003eThe Manager will only change the FPGA when it can put your original image back. It takes this backup by itself the first time (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003eInstall\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eopenFPGALoader\u003c/strong\u003e and the \u003cstrong\u003eGWU2X driver\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAs above: they read and write the FPGA over the console's USB.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe \u003cstrong\u003eofficial release files\u003c/strong\u003e of the FPGA images 18.40 (sound) and 18.41 (sound + Pocket link)\u003c/td\u003e\n\u003ctd\u003eThe sound and the Pocket link \u003cstrong\u003eneed the official release files\u003c/strong\u003e (\u003ccode\u003eevt1_x2.fs\u003c/code\u003e and \u003ccode\u003eevt1_x2.bin\u003c/code\u003e of each image), published separately as \u003cstrong\u003erelease assets\u003c/strong\u003e of this project. Put each pair in its folder's \u003ccode\u003ebuild\\\u003c/code\u003e (\u003ccode\u003efpga/images/sound-18.40/build/\u003c/code\u003e, \u003ccode\u003efpga/images/link-18.41/build/\u003c/code\u003e). This repository has the exact sources and receipts, but no binaries. \u003cstrong\u003eA build of your own will not match the pins\u003c/strong\u003e (it is almost never byte-identical to the reviewed image), and the Manager refuses it on purpose: only the reviewed image was tried on a console (\u003ca href=\"#docs/Building-from-source.md:console-chip-fpga-images\"\u003eBuilding from source\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFor the Pocket link: an \u003cstrong\u003eAnalogue Pocket\u003c/strong\u003e, \u003cstrong\u003ePocketFin\u003c/strong\u003e, and a \u003cstrong\u003elink cable\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSee \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-not-needed\"\u003eNot needed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eNo developer cartridge, UART adapter or soldering.\u003c/li\u003e\n\u003cli\u003eNo account anywhere, and nothing is uploaded. Your Wi-Fi and Jellyfin details stay on your PC\n(\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e) and your console.\u003c/li\u003e\n\u003cli\u003eNo ModRetro files: Jellymatic never ships their firmware or updater. For official updates you use\n\u003cstrong\u003eModRetro's own update tool\u003c/strong\u003e, downloaded from ModRetro (\u003ca href=\"#docs/Recovery.md:official-updates-and-restoring-chromatic-os\"\u003eRecovery\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Before-you-start.md\"\u003eBefore you start\u003c/a\u003e\u003c/p\u003e"
},

"title":"Before you start",
"html":"\u003ch1 id=\"h-before-you-start-keeping-your-games-working\"\u003eBefore you start: keeping your games working\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Before you start\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Before-you-start.md:how-the-start-up-menu-works\"\u003eHow the start-up menu works\u003c/a\u003e ·\n\u003ca href=\"#docs/Before-you-start.md:games-is-always-there\"\u003eGames is always there\u003c/a\u003e · \u003ca href=\"#docs/Before-you-start.md:what-is-changed-on-the-console\"\u003eWhat is changed on the console\u003c/a\u003e ·\n\u003ca href=\"#docs/Before-you-start.md:what-is-never-changed\"\u003eWhat is never changed\u003c/a\u003e · \u003ca href=\"#docs/Before-you-start.md:if-something-fails\"\u003eIf something fails\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-how-the-start-up-menu-works\"\u003eHow the start-up menu works\u003c/h2\u003e\n\u003cp\u003eThe Chromatic has two chips: an \u003cstrong\u003eESP32\u003c/strong\u003e (menus, Wi-Fi, settings) and an \u003cstrong\u003eFPGA\u003c/strong\u003e (the game hardware itself).\nJellymatic adds a small \u003cstrong\u003estart-up menu\u003c/strong\u003e to the ESP32, \u003cstrong\u003enext to\u003c/strong\u003e the official firmware, not instead of it.\u003c/p\u003e\n\u003cp\u003eWhen you switch the console on, a tiny boot program makes one decision:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eHow the console started\u003c/th\u003e\n\u003cth\u003eWhat runs\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eYou switched it on\u003c/td\u003e\n\u003ctd\u003eThe start-up menu (if its image checks out; otherwise the official firmware)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAnything else: a restart, a crash, a watchdog\u003c/td\u003e\n\u003ctd\u003eThe official firmware, directly\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYou held any button while switching on\u003c/td\u003e\n\u003ctd\u003eThe official firmware, directly, no menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThere is no setting, flag or saved state that could go wrong: the reason for the start is the only input.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/startup-menu.png\" width=\"320\" alt=\"Start-up menu with Games, Jellyfin and Other firmware\"\u003e\n\u003cimg src=\"docs/images/other-firmware.png\" width=\"320\" alt=\"Other firmware: the stock Chromatic is protected and always there\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-games-is-always-there\"\u003eGames is always there\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eGames\u003c/strong\u003e (or \u003cstrong\u003eB\u003c/strong\u003e on the menu) restarts the console into its own firmware and your cartridge. It is\nthe same as before Jellymatic, with your settings, palettes and saves.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOther firmware\u003c/strong\u003e lists the stock Chromatic first, marked \"Protected, always here\".\u003c/li\u003e\n\u003cli\u003eThe menu waits for your choice; nothing starts by itself, and nothing is lost by leaving it open.\u003c/li\u003e\n\u003cli\u003eCartridges, flash carts, their SD cards and saves are never read or written by Jellymatic.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-is-changed-on-the-console\"\u003eWhat is changed on the console\u003c/h2\u003e\n\u003cp\u003eOnly three areas of the ESP32's flash:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eArea\u003c/th\u003e\n\u003cth\u003eWhat\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBoot program (\u003ccode\u003e0x1000\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eA small custom bootloader built from Espressif's ESP-IDF 5.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePartition table (\u003ccode\u003e0x8000\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eThe three official rows, unchanged and in order, plus one row for the menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMenu area (\u003ccode\u003e0x260000\u003c/code\u003e onward)\u003c/td\u003e\n\u003ctd\u003eThe start-up menu and, at the very end, your Wi-Fi and Jellyfin set-up\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eOptional, only if you choose Jellyfin sound or the Pocket link: the FPGA image is replaced by a version of\nModRetro's own open-source design with sound hooks (18.40) or with sound hooks and the Pocket link\nbridge (18.41). It still plays every game; it reports itself with the same major version (18) so\nModRetro's tools still recognise the console.\u003c/p\u003e\n\u003ch2 id=\"h-what-is-never-changed\"\u003eWhat is never changed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe \u003cstrong\u003eofficial firmware\u003c/strong\u003e slot, your \u003cstrong\u003esettings\u003c/strong\u003e (NVS) and \u003cstrong\u003eradio calibration\u003c/strong\u003e (PHY data).\u003c/li\u003e\n\u003cli\u003eThe cartridge, its saves, and any flash cart.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-if-something-fails\"\u003eIf something fails\u003c/h2\u003e\n\u003cp\u003eEvery change is made by Chromatic Manager, and every write:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003estarts from a \u003cstrong\u003ebackup\u003c/strong\u003e of the console (the first time: both chips, each read twice), saved with a second copy on your PC (put that copy on another disk or a USB stick if you can);\u003c/li\u003e\n\u003cli\u003eis \u003cstrong\u003ewritten down in a journal\u003c/strong\u003e before it happens, so an interrupted job can be finished or undone;\u003c/li\u003e\n\u003cli\u003eis \u003cstrong\u003eread back\u003c/strong\u003e and compared byte for byte, then the whole flash is checked;\u003c/li\u003e\n\u003cli\u003eneeds \u003cstrong\u003eyour Approve\u003c/strong\u003e in the Manager's window (an AI assistant can ask, but you decide);\u003c/li\u003e\n\u003cli\u003eends with a \u003cstrong\u003estart check\u003c/strong\u003e: the console must start and keep running.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThe ESP32 also has a recovery mode in its read-only ROM that no flash content can block, so the Manager\n(or ModRetro's official updater) can always reach it again. See \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Install-with-Chromatic-Manager.md\"\u003eInstall with Chromatic Manager\u003c/a\u003e\u003c/p\u003e"
}
]

"title":"Install with Chromatic Manager",
"html":"\u003ch1 id=\"h-install-with-chromatic-manager\"\u003eInstall with Chromatic Manager\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Install with Chromatic Manager\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:1-set-up-the-pc\"\u003e1. Set up the PC\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:2-get-the-start-up-menu-image\"\u003e2. Get the start-up menu image\u003c/a\u003e ·\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:3-install\"\u003e3. Install\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:the-window\"\u003eThe window\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:wi-fi-and-jellyfin-from-the-pc-optional\"\u003eWi-Fi and Jellyfin from the PC\u003c/a\u003e ·\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003eFull backup before any FPGA change\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eJellyfin sound\u003c/a\u003e ·\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:update-the-pocket-link-in-one-step-fpga-1841\"\u003eUpdate the Pocket link\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:text-menu\"\u003eText menu\u003c/a\u003e · \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:where-your-files-are\"\u003eYour files\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-1-set-up-the-pc\"\u003e1. Set up the PC\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eInstall \u003cstrong\u003ePython 3.12+\u003c/strong\u003e from python.org (tick \"Add python.exe to PATH\").\u003c/li\u003e\n\u003cli\u003eDownload this repository (Code › Download ZIP, or \u003ccode\u003egit clone\u003c/code\u003e) and unzip it, for example to \u003ccode\u003eC:\\Jellymatic\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRight-click \u003ccode\u003eSetup-Jellymatic.ps1\u003c/code\u003e › \u003cstrong\u003eRun with PowerShell\u003c/strong\u003e (or\n\u003ccode\u003epowershell -ExecutionPolicy Bypass -File Setup-Jellymatic.ps1\u003c/code\u003e). It creates your private folder\n\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e and installs the three Python packages the Manager needs. It never\ntouches a console and never uploads anything.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-2-get-the-start-up-menu-image\"\u003e2. Get the start-up menu image\u003c/h2\u003e\n\u003cp\u003eThe Manager installs the three files in \u003ccode\u003erelease\\launcher\\\u003c/code\u003e (\u003ccode\u003ebootloader\\bootloader.bin\u003c/code\u003e,\n\u003ccode\u003epartition_table\\partition-table.bin\u003c/code\u003e, \u003ccode\u003echromatic_launcher.bin\u003c/code\u003e). Either copy them there from a published\nrelease, or build them yourself with \u003ccode\u003escripts\\Build-ChromaticLauncher.ps1\u003c/code\u003e\n(\u003ca href=\"#docs/Building-from-source.md:start-up-menu\"\u003eBuilding from source\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-3-install\"\u003e3. Install\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003ePlug the Chromatic into the PC with the USB cable and \u003cstrong\u003eswitch it on\u003c/strong\u003e, with a cartridge in.\u003c/li\u003e\n\u003cli\u003eDouble-click \u003cstrong\u003e\u003ccode\u003eChromatic-Manager-Window.cmd\u003c/code\u003e\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eThe Home tab checks the console (about 20 seconds; the first time, a full read takes about 6 minutes),\nthen shows \u003cstrong\u003eone\u003c/strong\u003e main button. For a console without Jellymatic it is \u003cstrong\u003eInstall\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePress it, read the small \u003cstrong\u003eApprove\u003c/strong\u003e window (it names the exact image), press \u003cstrong\u003eApprove\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eThe first time, the Manager takes the \u003ca href=\"#docs/Install-with-Chromatic-Manager.md:full-backup-before-any-fpga-change\"\u003efull backup\u003c/a\u003e of both chips\n(about 15 minutes, nothing written). Then it writes the menu, reads it back, checks the whole flash and\nrestarts the console to watch it start. Keep the cable in and the console on until it says \u003cstrong\u003eDone\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eSwitch the console off and on: the start-up menu appears. Carry on with\n\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\n\u003cimg src=\"docs/images/manager-update.png\" width=\"400\" alt=\"Manager: one main button (here: an update is ready)\"\u003e\n\u003cimg src=\"docs/images/manager-approve.png\" width=\"400\" alt=\"The Approve window names the exact image\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n\u003cimg src=\"docs/images/manager-home.png\" width=\"400\" alt=\"Manager: up to date\"\u003e\n\u003cimg src=\"docs/images/manager-fix.png\" width=\"400\" alt=\"Manager: Fix a problem\"\u003e\n\u003c/p\u003e\n\u003cp\u003eUpdating later is the same: when \u003ccode\u003erelease\\launcher\\\u003c/code\u003e holds a newer menu, Home shows \u003cstrong\u003eUpdate to x.y.z\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-the-window\"\u003eThe window\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTab\u003c/th\u003e\n\u003cth\u003eWhat is on it\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eHome\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe console's state in plain words and at most one main button; under \u003cstrong\u003eMore\u003c/strong\u003e: Check again, Official update, Wi-Fi, New Jellyfin sign-in\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFix a problem\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSet up Jellyfin sound, Back up, Repair menu, Remove menu, Switch menu off, Restore original, Forget Jellyfin, the console chip (FPGA) jobs, Finish job, Close job (each button explains itself when you hover)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eRemote Pilot\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSee and press the console's menus from the PC (\u003ca href=\"#docs/Remote-Pilot.md\"\u003eRemote Pilot\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSettings\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAI control (off unless you allow it), Jellyfin on this PC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eAbout\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eFolders, guide, licences\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe \u003cstrong\u003eeye\u003c/strong\u003e button at the top hides private details (addresses, network names, user names, IDs) on screen,\nso screenshots are safe. It is on at every start.\u003c/p\u003e\n\u003ch2 id=\"h-wi-fi-and-jellyfin-from-the-pc-optional\"\u003eWi-Fi and Jellyfin from the PC (optional)\u003c/h2\u003e\n\u003cp\u003eYou can set up everything on the console itself (\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run\u003c/a\u003e). If you prefer\nthe PC: \u003cstrong\u003eMore › Wi-Fi\u003c/strong\u003e. Networks come from \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\chromatic-wifi-networks.txt\u003c/code\u003e\n(optional; an \u003ccode\u003essid=\u003c/code\u003e line then a \u003ccode\u003epassword=\u003c/code\u003e line per network, see \u003ccode\u003echromatic-wifi-networks.example.txt\u003c/code\u003e)\nor are typed in the window; they are \u003cstrong\u003emerged\u003c/strong\u003e with the networks\nalready on the console (at most 4). If this PC has Jellyfin settings (Settings tab), the console also gets\n\u003cstrong\u003eits own\u003c/strong\u003e Jellyfin sign-in through Quick Connect: your password never goes to the console, and the\nconsole appears as its own device in Jellyfin's Dashboard › Devices, where you can revoke it. Jellymatic\nonly ever signs out the console's own sign-in, never your other devices.\u003c/p\u003e\n\u003ch2 id=\"h-full-backup-before-any-fpga-change\"\u003eFull backup before any FPGA change\u003c/h2\u003e\n\u003cp\u003eNothing is written to a console before a \u003cstrong\u003efull backup of both chips\u003c/strong\u003e exists on your PC. The first time\nyou press \u003cstrong\u003eInstall\u003c/strong\u003e (or \u003cstrong\u003eBack up\u003c/strong\u003e, an official update, or any console chip job), the Manager takes it by\nitself, before anything else, with no extra questions:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eIt checks the console model on the chips themselves (the ESP32, its flash chip, the console chip's\nJTAG id) and refuses a model or firmware it does not know.\u003c/li\u003e\n\u003cli\u003eIt reads the whole \u003cstrong\u003eESP32\u003c/strong\u003e flash (4 MiB) \u003cstrong\u003etwice\u003c/strong\u003e, every 256 KiB piece checked against the chip's\nown checksum, and the whole \u003cstrong\u003econsole chip (FPGA)\u003c/strong\u003e flash (4 MiB) \u003cstrong\u003etwice\u003c/strong\u003e over its JTAG bridge\n(needs openFPGALoader, see \u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e). The two reads of each chip must be\nidentical, or nothing is kept. Both chips must be checked to belong to the same console.\u003c/li\u003e\n\u003cli\u003eThe console must run the \u003cstrong\u003eofficial ModRetro firmware exactly as it comes\u003c/strong\u003e: no start-up menu (not\neven switched off), nothing half-installed, and none of Jellymatic's console chip images (sound\n18.40, Pocket link 18.41). Otherwise the backup is refused, because it would not be your original:\nput the official firmware back with ModRetro's own updater first\n(\u003ca href=\"#docs/Recovery.md:official-updates-and-restoring-chromatic-os\"\u003eRecovery\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eIt saves them in \u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\\chromatic-backup-\u0026lt;date\u0026gt;-\u0026lt;time\u0026gt;\\\u003c/code\u003e, makes the three-file\nrestore bundle, copies it to the \u003cstrong\u003esecond copy\u003c/strong\u003e folder, and reads every file back.\u003c/li\u003e\n\u003cli\u003eOnly then does it record the backup as your console's original and go on.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThis first full backup is taken \u003cstrong\u003eonce\u003c/strong\u003e. An original that is already recorded is \u003cstrong\u003enever replaced\u003c/strong\u003e: if\nit cannot be checked (for example the second copy's disk or USB stick is not connected), every job that\nneeds it stops and says so, and nothing is read or written. Connect the disk and try again.\u003c/p\u003e\n\u003cp\u003eThis takes about 15 minutes and writes nothing to the console (the screen goes dark for a moment while\nthe console chip is read, then the console restarts). Your Wi-Fi passwords and Jellyfin sign-in are left\nout of every backup.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe second copy is usually on the same disk\u003c/strong\u003e (\u003ccode\u003e%USERPROFILE%\\Jellymatic-Backups\u003c/code\u003e). For real safety\nput it on another disk or a USB stick: set \u003ccode\u003eJELLYMATIC_SECOND_COPY\u003c/code\u003e to a folder there before the first\nbackup (for example \u003ccode\u003esetx JELLYMATIC_SECOND_COPY \"E:\\Jellymatic-Backups\"\u003c/code\u003e, then open a new window).\u003c/p\u003e\n\u003cp\u003eAdvanced, the same backup by hand (read-only tools, in a PowerShell window in the Jellymatic folder):\n\u003ccode\u003escripts\\chromatic_backup.py mcu\u003c/code\u003e, then \u003ccode\u003escripts\\chromatic_backup.py fpga --folder \"\u0026lt;the folder it made\u0026gt;\"\u003c/code\u003e,\nthen \u003ccode\u003escripts\\verify_chromatic_backup.py \"\u0026lt;that folder\u0026gt;\" --create-bundle --second-copy \"\u0026lt;another disk\u0026gt;\"\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-jellyfin-sound-fpga-1840\"\u003eJellyfin sound (FPGA 18.40)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eFix a problem › Set up Jellyfin sound\u003c/strong\u003e is a guided job: Check FPGA (reads all 4 MiB and recognises your\noriginal image), a rehearsal that writes your original image back and checks it (so the undo is proven on\nyour console first), then the sound image, read back byte for byte. Needs the full backup above,\nopenFPGALoader, and the \u003cstrong\u003eofficial release files\u003c/strong\u003e \u003ccode\u003eevt1_x2.fs\u003c/code\u003e + \u003ccode\u003eevt1_x2.bin\u003c/code\u003e of the sound image in\n\u003ccode\u003efpga\\images\\sound-18.40\\build\\\u003c/code\u003e (published separately as release assets, see\n\u003ca href=\"#docs/What-you-need.md:for-jellyfin-sound-and-the-pocket-link\"\u003eWhat you need\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-update-the-pocket-link-in-one-step-fpga-1841\"\u003eUpdate the Pocket link in one step (FPGA 18.41)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eUpdate the Pocket link\u003c/strong\u003e (Home, when the console has the sound image and the reviewed 18.41 image is in\n\u003ccode\u003efpga\\images\\link-18.41\\build\\\u003c/code\u003e) is one screen with one button, \u003cstrong\u003eUpdate now\u003c/strong\u003e:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eCheck FPGA: the flash must be the sound image, byte for byte.\u003c/li\u003e\n\u003cli\u003eThe new image is loaded into the chip's \u003cstrong\u003eRAM only\u003c/strong\u003e. Nothing is written yet.\u003c/li\u003e\n\u003cli\u003eAutomatic checks: the image loaded, USB came back, the start-up menu reports FPGA 18.41.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYour Approve, while the new image runs\u003c/strong\u003e: start a game for a moment and check picture and sound.\n\u003cem\u003eNot right\u003c/em\u003e, Cancel or switching the console off writes nothing (an off-and-on returns to the old image).\u003c/li\u003e\n\u003cli\u003eThe write, with backup checks, full read-back and journal; then a restart from flash that must report 18.41.\u003c/li\u003e\n\u003cli\u003eIf the start-up menu is older than the one in \u003ccode\u003erelease\\launcher\\\u003c/code\u003e, it is updated too (its own Approve).\nThen \u003cstrong\u003eReady: plug in the cable\u003c/strong\u003e, with \u003cstrong\u003ePut the previous image back\u003c/strong\u003e one click away.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-pocket-link-update.png\" width=\"400\" alt=\"Update the Pocket link, one step\"\u003e\u003c/p\u003e\n\u003cp\u003eThe Manager accepts only the reviewed 18.41 image: its \u003ccode\u003e.fs\u003c/code\u003e, \u003ccode\u003e.bin\u003c/code\u003e and stage receipt are pinned by\nSHA-256 in \u003ccode\u003escripts/chromatic_fpga.py\u003c/code\u003e. Any other build is refused, including your own build of the same\nsources (it is almost never byte-identical), so use the official release files.\u003c/p\u003e\n\u003ch2 id=\"h-text-menu\"\u003eText menu\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eChromatic-Manager.cmd\u003c/code\u003e opens the same tool as a text menu: 1 status, 2 backup, 3 install, 4 remove,\n5 restore-stock, 6 guided official update, 7 Wi-Fi setup, 8 Jellyfin re-link, 9 Jellyfin forget. Every\nwrite asks you to type a one-time word shown on screen (for example \u003ccode\u003eyes482\u003c/code\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-where-your-files-are\"\u003eWhere your files are\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFolder\u003c/th\u003e\n\u003cth\u003eWhat\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e%LOCALAPPDATA%\\Jellymatic\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eEverything personal: journals, backups, logs, settings, Wi-Fi list, Jellyfin settings\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e%USERPROFILE%\\Jellymatic-Backups\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe second copy of every backup. It is usually on the same disk as the first: set \u003ccode\u003eJELLYMATIC_SECOND_COPY\u003c/code\u003e to another disk or a USB stick for real safety\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eSet \u003ccode\u003eJELLYMATIC_HOME\u003c/code\u003e to move the first one. None of it is ever part of the repository. Run\n\u003ccode\u003epython scripts\\user_paths.py\u003c/code\u003e to print the paths.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run on the console\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/First-run-on-the-console.md",
"title":"First run on the console",
"html":"\u003ch1 id=\"h-first-run-on-the-console\"\u003eFirst run on the console\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › First run on the console\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/First-run-on-the-console.md:open-jellyfin\"\u003eOpen Jellyfin\u003c/a\u003e · \u003ca href=\"#docs/First-run-on-the-console.md:add-your-wi-fi\"\u003eAdd your Wi-Fi\u003c/a\u003e ·\n\u003ca href=\"#docs/First-run-on-the-console.md:sign-in-to-jellyfin-quick-connect\"\u003eSign in to Jellyfin\u003c/a\u003e · \u003ca href=\"#docs/First-run-on-the-console.md:pocket-link\"\u003ePocket link\u003c/a\u003e · \u003ca href=\"#docs/First-run-on-the-console.md:buttons\"\u003eButtons\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-open-jellyfin\"\u003eOpen Jellyfin\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003ePut a cartridge in and switch the console \u003cstrong\u003eon\u003c/strong\u003e. The start-up menu appears.\u003c/li\u003e\n\u003cli\u003eHighlight \u003cstrong\u003eJellyfin\u003c/strong\u003e with the D-pad and press \u003cstrong\u003eA\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePress \u003cstrong\u003eSelect\u003c/strong\u003e to open \u003cstrong\u003eSetup\u003c/strong\u003e (Wi-Fi networks / Jellyfin server).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/startup-menu.png\" width=\"320\" alt=\"Start-up menu\"\u003e\n\u003cimg src=\"docs/images/jellyfin-screen.png\" width=\"320\" alt=\"Jellyfin highlighted on the start-up menu\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-add-your-wi-fi\"\u003eAdd your Wi-Fi\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSetup › Wi-Fi networks › Add a network…\u003c/strong\u003e The console scans and lists networks nearby\n(strongest first; a lock means a password is needed).\u003c/li\u003e\n\u003cli\u003eChoose yours and type the password on the on-screen keyboard:\nD-pad to move, \u003cstrong\u003eA\u003c/strong\u003e types, \u003cstrong\u003eB\u003c/strong\u003e deletes, \u003cstrong\u003eSelect\u003c/strong\u003e switches abc / ABC / #+=, \u003cstrong\u003eStart\u003c/strong\u003e is OK.\u003c/li\u003e\n\u003cli\u003eThe console says \u003cstrong\u003eSaved\u003c/strong\u003e, then \u003cstrong\u003eJoining…\u003c/strong\u003e, then \u003cstrong\u003eConnected\u003c/strong\u003e, or the reason it could not join\n(wrong password, network not found…) in plain words.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/setup-wifi.png\" width=\"320\" alt=\"Wi-Fi networks\"\u003e\n\u003cimg src=\"docs/images/setup-scan.png\" width=\"320\" alt=\"Choose a network (made-up names)\"\u003e\n\u003cimg src=\"docs/images/setup-keyboard.png\" width=\"320\" alt=\"Password keyboard\"\u003e\u003c/p\u003e\n\u003cp\u003eUp to \u003cstrong\u003e4\u003c/strong\u003e networks are kept. Choose a saved one to \u003cstrong\u003euse it now\u003c/strong\u003e, \u003cstrong\u003echange its password\u003c/strong\u003e or \u003cstrong\u003eforget\u003c/strong\u003e\nit. 2.4 GHz only; hotel-style sign-in pages are not supported (a phone hotspot works).\u003c/p\u003e\n\u003ch2 id=\"h-sign-in-to-jellyfin-quick-connect\"\u003eSign in to Jellyfin (Quick Connect)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSetup › Jellyfin server › Find servers nearby\u003c/strong\u003e (or \u003cstrong\u003eEnter server address\u003c/strong\u003e, for example\n\u003ccode\u003ehttp://your-server:8096\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003eChoose your server. The console shows a \u003cstrong\u003e6-digit code\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eIn any Jellyfin app where you are signed in (web, phone, TV): \u003cstrong\u003eSettings › Quick Connect\u003c/strong\u003e, enter the\ncode, approve it.\u003c/li\u003e\n\u003cli\u003eThe console says \u003cstrong\u003eSigned in\u003c/strong\u003e. It now has its own sign-in, shown in Jellyfin's\n\u003cstrong\u003eDashboard › Devices\u003c/strong\u003e as \"Chromatic\". Your password never goes to the console.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/setup-quick-connect.png\" width=\"320\" alt=\"Quick Connect code on the console\"\u003e\u003c/p\u003e\n\u003cp\u003eQuick Connect must be on in the server's \u003cstrong\u003eDashboard › General\u003c/strong\u003e. To undo: \u003cstrong\u003eSetup › Jellyfin server ›\nForget this sign-in\u003c/strong\u003e (it signs the console out on the server too), or revoke the device in Jellyfin.\u003c/p\u003e\n\u003ch2 id=\"h-pocket-link\"\u003ePocket link\u003c/h2\u003e\n\u003cp\u003eOnly with the 18.41 console chip image installed (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:update-the-pocket-link-in-one-step-fpga-1841\"\u003eInstall\u003c/a\u003e)\nand \u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e on the Pocket. See \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-buttons\"\u003eButtons\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eButtons\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStart-up menu\u003c/td\u003e\n\u003ctd\u003eD-pad choose · \u003cstrong\u003eA\u003c/strong\u003e start · \u003cstrong\u003eB\u003c/strong\u003e Games\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin page\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e open the library · \u003cstrong\u003eSelect\u003c/strong\u003e setup · \u003cstrong\u003eB\u003c/strong\u003e or \u003cstrong\u003eStart\u003c/strong\u003e back to the menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSetup screens\u003c/td\u003e\n\u003ctd\u003eD-pad · \u003cstrong\u003eA\u003c/strong\u003e open · \u003cstrong\u003eB\u003c/strong\u003e back\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHolding any button while switching on\u003c/td\u003e\n\u003ctd\u003eSkips the menu: straight to Games\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md\"\u003eUsing Jellyfin on the Chromatic\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Using-Jellyfin-on-the-Chromatic.md",
"title":"Using Jellyfin",
"html":"\u003ch1 id=\"h-using-jellyfin-on-the-chromatic\"\u003eUsing Jellyfin on the Chromatic\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Using Jellyfin on the Chromatic\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:browsing\"\u003eBrowsing\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:playing\"\u003ePlaying\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:sound\"\u003eSound\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:slow-wi-fi\"\u003eSlow Wi-Fi\u003c/a\u003e ·\n\u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:leaving\"\u003eLeaving\u003c/a\u003e · \u003ca href=\"#docs/Using-Jellyfin-on-the-Chromatic.md:limits\"\u003eLimits\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-browsing\"\u003eBrowsing\u003c/h2\u003e\n\u003cp\u003eOpen \u003cstrong\u003eJellyfin\u003c/strong\u003e from the start-up menu. The console joins your saved Wi-Fi by itself and talks straight\nto your Jellyfin server; no PC is needed.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eHome\u003c/strong\u003e: rows in Jellyfin's own order (My Media, Continue Watching, Next Up, Latest per library).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFolders\u003c/strong\u003e: grids of posters or episode pictures.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDetails\u003c/strong\u003e: \u003cstrong\u003eResume\u003c/strong\u003e or \u003cstrong\u003eFrom start\u003c/strong\u003e, how far you got, and the overview.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/player-home.png\" width=\"320\" alt=\"Jellyfin home on the Chromatic (sample data)\"\u003e\n\u003cimg src=\"docs/images/player-details.png\" width=\"320\" alt=\"Details page (sample data)\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-playing\"\u003ePlaying\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eButton\u003c/th\u003e\n\u003cth\u003eDoes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003ePause / play\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eLeft / Right\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBack / forward 10 seconds\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSelect\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eShow or hide the bar under the picture\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eStop\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/player-playing.png\" width=\"320\" alt=\"Playback with the bar below the picture (sample test pattern)\"\u003e\n\u003cimg src=\"docs/images/player-menu.png\" width=\"320\" alt=\"The app\u0026#x27;s menu: Home, card size, audio track, playback info\"\u003e\u003c/p\u003e\n\u003cp\u003eThe app's menu has \u003cstrong\u003eHome\u003c/strong\u003e, the card size, the \u003cstrong\u003eaudio track\u003c/strong\u003e (when a title has more than one) and\n\u003cstrong\u003ePlayback info\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eThe server converts each title to a size the console can show (up to 160 × 120), at the title's own frame\nrate. Pictures that are late are skipped rather than shown out of time. Where you stopped and what you\nwatched go back to the server, so other Jellyfin apps continue from the same place.\u003c/p\u003e\n\u003ch2 id=\"h-sound\"\u003eSound\u003c/h2\u003e\n\u003cp\u003eSound needs the console chip (FPGA) sound image 18.40 or the Pocket link image 18.41\n(\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eInstall\u003c/a\u003e). With the official FPGA image, video\nplays without sound and the console says so.\u003c/p\u003e\n\u003ch2 id=\"h-slow-wi-fi\"\u003eSlow Wi-Fi\u003c/h2\u003e\n\u003cp\u003eThe player starts at about 1 Mbit/s and up to 15 pictures a second. If the network falls behind it halves the\nbitrate (down to 200 kbit/s); if the console falls behind it asks for fewer pictures a second. The message\n\"Adjusting quality\" shows when it does. Smooth play earns the quality back next time.\u003c/p\u003e\n\u003ch2 id=\"h-leaving\"\u003eLeaving\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eB\u003c/strong\u003e stops playback; \u003cstrong\u003eB\u003c/strong\u003e again goes back through the screens; \u003cstrong\u003eStart\u003c/strong\u003e on the Jellyfin page returns to\nthe start-up menu, where \u003cstrong\u003eGames\u003c/strong\u003e starts your cartridge.\u003c/p\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA cartridge must be in the console (the app draws over it).\u003c/li\u003e\n\u003cli\u003e2.4 GHz Wi-Fi only; no hotel sign-in pages.\u003c/li\u003e\n\u003cli\u003eSubtitles and search are not available yet.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Hosting-Jellyfin.md\"\u003eHosting Jellyfin\u003c/a\u003e · \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Hosting-Jellyfin.md",
"title":"Hosting Jellyfin",
"html":"\u003ch1 id=\"h-hosting-jellyfin-for-wireless-use\"\u003eHosting Jellyfin for wireless use\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Hosting Jellyfin\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Hosting-Jellyfin.md:what-the-console-needs\"\u003eWhat the console needs\u003c/a\u003e · \u003ca href=\"#docs/Hosting-Jellyfin.md:steps\"\u003eSteps\u003c/a\u003e ·\n\u003ca href=\"#docs/Hosting-Jellyfin.md:a-separate-sign-in-per-device-recommended\"\u003eA separate sign-in per device\u003c/a\u003e · \u003ca href=\"#docs/Hosting-Jellyfin.md:checks\"\u003eChecks\u003c/a\u003e · \u003ca href=\"#docs/Hosting-Jellyfin.md:safety\"\u003eSafety\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-the-console-needs\"\u003eWhat the console needs\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA Jellyfin server on the \u003cstrong\u003esame local network\u003c/strong\u003e as the console's Wi-Fi.\u003c/li\u003e\n\u003cli\u003eAn address the console can reach, for example \u003ccode\u003ehttp://your-server:8096\u003c/code\u003e (8096 is Jellyfin's usual port).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eQuick Connect\u003c/strong\u003e turned on, so the console can get its own sign-in without your password.\u003c/li\u003e\n\u003cli\u003eThe server's FFmpeg (Jellyfin's own) able to transcode: the console asks for small MJPEG video with\nADPCM sound, which the server makes on the fly.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-steps\"\u003eSteps\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eInstall Jellyfin on a PC, NAS or small computer that stays on: see\n\u003ca href=\"https://jellyfin.org/downloads/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ejellyfin.org/downloads\u003c/a\u003e. Add your libraries.\u003c/li\u003e\n\u003cli\u003eGive the server a \u003cstrong\u003efixed address\u003c/strong\u003e on your network (in your router's DHCP settings, \"address\nreservation\"), so \u003ccode\u003ehttp://your-server:8096\u003c/code\u003e keeps working.\u003c/li\u003e\n\u003cli\u003eAllow Jellyfin through the server's firewall for your \u003cstrong\u003eprivate\u003c/strong\u003e network (port 8096, TCP), and UDP 7359\nif you want the console's \u003cstrong\u003eFind servers nearby\u003c/strong\u003e to work.\u003c/li\u003e\n\u003cli\u003eIn Jellyfin: \u003cstrong\u003eDashboard › General › Quick Connect: Enable\u003c/strong\u003e. Save.\u003c/li\u003e\n\u003cli\u003eCheck that transcoding works: \u003cstrong\u003eDashboard › Playback › Transcoding\u003c/strong\u003e (the default settings are fine).\u003c/li\u003e\n\u003cli\u003eOn the console: \u003cstrong\u003eJellyfin › Select › Jellyfin server › Find servers nearby\u003c/strong\u003e, or enter the address.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-a-separate-sign-in-per-device-recommended\"\u003eA separate sign-in per device (recommended)\u003c/h2\u003e\n\u003cp\u003eUse \u003cstrong\u003eQuick Connect\u003c/strong\u003e for the console (and for Chromatic Manager, when you give it Jellyfin settings).\nEach gets its \u003cstrong\u003eown\u003c/strong\u003e sign-in, listed in \u003cstrong\u003eDashboard › Devices\u003c/strong\u003e, that you can revoke on its own without\nchanging your password or signing out your TV or phone. Jellymatic never signs out other devices.\u003c/p\u003e\n\u003cp\u003eYou can also make a separate Jellyfin \u003cstrong\u003euser\u003c/strong\u003e for the console with access to only some libraries\n(Dashboard › Users › Add user, then sign in on the console as that user).\u003c/p\u003e\n\u003ch2 id=\"h-checks\"\u003eChecks\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProblem\u003c/th\u003e\n\u003cth\u003eTry\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Find servers nearby\" finds nothing\u003c/td\u003e\n\u003ctd\u003eEnter the address by hand; allow UDP 7359; console and server on the same network\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuick Connect code is refused\u003c/td\u003e\n\u003ctd\u003eTurn Quick Connect on (Dashboard › General); the code expires after a few minutes\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePlays, but stutters\u003c/td\u003e\n\u003ctd\u003eMove closer to the router; the console adjusts quality by itself\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo sound\u003c/td\u003e\n\u003ctd\u003eInstall the sound image (\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:jellyfin-sound-fpga-1840\"\u003eInstall\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-safety\"\u003eSafety\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep Jellyfin on your \u003cstrong\u003ehome network\u003c/strong\u003e. Jellymatic does not need it to be reachable from the internet.\u003c/li\u003e\n\u003cli\u003eIf you do expose it, use HTTPS and strong passwords; the console supports \u003ccode\u003ehttps://\u003c/code\u003e addresses.\u003c/li\u003e\n\u003cli\u003eNever post your server address, user names or tokens in issues or screenshots.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Pocket-link.md\"\u003ePocket link\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Pocket-link.md",
"title":"Pocket link",
"html":"\u003ch1 id=\"h-pocket-link\"\u003ePocket link\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Pocket link\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Pocket-link.md:what-it-is\"\u003eWhat it is\u003c/a\u003e · \u003ca href=\"#docs/Pocket-link.md:what-you-need\"\u003eWhat you need\u003c/a\u003e · \u003ca href=\"#docs/Pocket-link.md:set-it-up\"\u003eSet it up\u003c/a\u003e ·\n\u003ca href=\"#docs/Pocket-link.md:what-the-screen-says\"\u003eWhat the screen says\u003c/a\u003e · \u003ca href=\"#docs/Pocket-link.md:undo\"\u003eUndo\u003c/a\u003e · \u003ca href=\"#docs/Pocket-link.md:limits\"\u003eLimits\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cp\u003eThe Chromatic joins your Wi-Fi and Jellyfin; an \u003cstrong\u003eAnalogue Pocket\u003c/strong\u003e plugged into it with a \u003cstrong\u003elink\ncable\u003c/strong\u003e then browses your library and plays from it, through the Chromatic. The Pocket side is\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003ePocketFin\u003c/strong\u003e\u003c/a\u003e (its own repository and instructions).\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e Jellyfin server ──Wi-Fi──► Chromatic (start-up menu, FPGA 18.41) ──link cable──► Analogue Pocket (PocketFin)\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-what-you-need\"\u003eWhat you need\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe start-up menu installed and Jellyfin signed in on the Chromatic (\u003ca href=\"#docs/First-run-on-the-console.md\"\u003eFirst run\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eThe console chip image \u003cstrong\u003e18.41\u003c/strong\u003e (sound + Pocket link) installed with\n\u003ca href=\"#docs/Install-with-Chromatic-Manager.md:update-the-pocket-link-in-one-step-fpga-1841\"\u003eUpdate the Pocket link\u003c/a\u003e.\n18.41 is ModRetro's open-source FPGA design (v18.14) with sound hooks and a link bridge added; every\ngame still plays as before.\u003c/li\u003e\n\u003cli\u003eAn Analogue Pocket with PocketFin installed, and a link cable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-set-it-up\"\u003eSet it up\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eOn the Chromatic: start-up menu › \u003cstrong\u003eJellyfin\u003c/strong\u003e, and stay on the Jellyfin page. With 18.41 the Pocket\nlink starts there by itself and shows \u003cstrong\u003ePocket link: waiting\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePlug the link cable into both consoles.\u003c/li\u003e\n\u003cli\u003eOn the Pocket: open PocketFin's Jellyfin core.\u003c/li\u003e\n\u003cli\u003eThe Chromatic shows \u003cstrong\u003ePocket link: connected\u003c/strong\u003e. Browse and play on the Pocket; keep the Chromatic on\nthat screen.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/pocket-link.png\" width=\"320\" alt=\"Pocket link: streaming\"\u003e\n\u003cimg src=\"docs/images/pocket-link-waiting.png\" width=\"320\" alt=\"Pocket link: waiting\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-the-screen-says\"\u003eWhat the screen says\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLight\u003c/th\u003e\n\u003cth\u003eWords\u003c/th\u003e\n\u003cth\u003eMeans\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eYellow\u003c/td\u003e\n\u003ctd\u003ePocket link: waiting\u003c/td\u003e\n\u003ctd\u003ePlug the cable in, open Jellyfin on the Pocket\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGreen\u003c/td\u003e\n\u003ctd\u003ePocket link: connected\u003c/td\u003e\n\u003ctd\u003eThe Pocket can browse your library and play from here\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYellow\u003c/td\u003e\n\u003ctd\u003eSyncing N of M\u003c/td\u003e\n\u003ctd\u003eCopying pictures to the Pocket for offline browsing\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGreen\u003c/td\u003e\n\u003ctd\u003ePocket link: streaming\u003c/td\u003e\n\u003ctd\u003eA video plays on the Pocket\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRed\u003c/td\u003e\n\u003ctd\u003ePocket link: unplugged\u003c/td\u003e\n\u003ctd\u003eNo word from the Pocket for 9 seconds: plug the cable back in\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRed\u003c/td\u003e\n\u003ctd\u003ePocket link: stopped\u003c/td\u003e\n\u003ctd\u003eThe link stopped (the reason is shown); it tries again by itself\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYellow\u003c/td\u003e\n\u003ctd\u003ePocket link: slow\u003c/td\u003e\n\u003ctd\u003eThe fast connection failed: browse and pictures only, no playing on this link\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eB\u003c/strong\u003e goes back to the Jellyfin page. \u003cstrong\u003eGames\u003c/strong\u003e on the start-up menu works as always; the link is only\nactive on the Jellyfin page.\u003c/p\u003e\n\u003ch2 id=\"h-undo\"\u003eUndo\u003c/h2\u003e\n\u003cp\u003eChromatic Manager › \u003cstrong\u003ePut the previous image back\u003c/strong\u003e (the sound image 18.40), or \u003cstrong\u003eFix a problem ›\nRestore FPGA\u003c/strong\u003e (your own original FPGA image, from your full backup), or ModRetro's official update tool.\nSee \u003ca href=\"#docs/Recovery.md\"\u003eRecovery\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eTested on the PC with simulators and on one console; your link cable and Pocket may behave differently.\u003c/li\u003e\n\u003cli\u003eThe link speed is limited by the cable: picture size and frame rate on the Pocket are small.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Remote-Pilot.md\"\u003eRemote Pilot\u003c/a\u003e\u003c/p\u003e"
},
